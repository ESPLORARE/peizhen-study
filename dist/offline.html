function home(){const s=stats(),today=state.days[dayKey()]||0,session=state.practice&&!state.practice.completed?state.practice:null;return heading('每一份用心，都让陪伴更专业','欢迎来到陪诊研习室，开启今天的学习吧。',`<div class="date-chip">${icon('calendar',15)}　${new Date().toLocaleDateString('zh-CN',{month:'long',day:'numeric',weekday:'long'})}</div>`)+`<section class="hero"><div class="hero-copy"><div class="eyebrow">LEARN WITH CARE, GROW WITH PURPOSE</div><h2>学好陪诊知识，<br>为每一次陪伴做好准备。</h2><p>470 道精选原题 · 逐题解析 · 让每一次练习都有收获</p><button class="btn primary" data-action="${session?'resume':'sequential'}">${icon(session?'refresh':'book',16)} ${session?'继续上次练习':'开始顺序练习'}</button></div>${heroArt}</section><div class="stats">${[['已练习题目',`${s.done}<small>/ 470 题</small>`,'完整覆盖三种题型','book'],['答题正确率',`${s.accuracy}<small>%</small>`,s.attempts?`累计作答 ${s.attempts} 次`:'从第一道题开始积累','chart'],['待复习错题',`${s.wrong}<small>题</small>`,'答对后自动移出错题本','wrong'],['累计学习',`${s.days}<small>天</small>`,today?`今天已作答 ${today} 次`:'今天也给自己一点进步','clock']].map(([t,v,n,i])=>`<div class="stat"><div class="stat-top">${t}<span class="stat-icon">${icon(i,17)}</span></div><div class="stat-value">${v}</div><div class="stat-note">${n}</div></div>`).join('')}</div><div class="section-title"><h2>选择你的学习方式</h2><span class="small">循序渐进，让知识慢慢沉淀</span></div><div class="mode-grid">${[['sequential','book','顺序练习','按题库顺序系统学习，打好专业基础。','开始练习','470 道原题'],['random','shuffle','随机练习','打乱题目顺序，检验知识掌握程度。','随机抽题','灵活巩固'],['wrong-mode','wrong','错题巩固','专注薄弱环节，把不会的变成会的。','复习错题',`${s.wrong} 题待复习`]].map(([a,i,t,d,l,n])=>`<button class="mode-card" data-action="${a}"><span class="tile-icon">${icon(i,24)}</span><span class="corner">${icon('spark',15)}</span><h3>${t}</h3><p>${d}</p><span class="card-link"><span>${l}</span><span>${n}</span></span></button>`).join('')}</div><div class="lower-grid"><section class="panel"><div class="section-title"><h2>题型学习进度</h2><a href="#library" class="small">查看全部</a></div>${Object.entries(TYPES).map(([t,l])=>{const total=Q.filter(q=>q.type===t).length,done=Q.filter(q=>q.type===t&&state.records[q.id]).length;return `<div class="progress-row"><div class="progress-row-head"><span>${l}</span><b>${done} / ${total} 题</b></div><div class="progress-track" role="progressbar" aria-label="${l}已练习" aria-valuenow="${done}" aria-valuemin="0" aria-valuemax="${total}"><span style="width:${done/total*100}%"></span></div></div>`;}).join('')}</section><section class="panel"><h3 class="tip-heading">${icon('leaf',18)} 学习小贴士</h3><p class="tip-copy">先理解，再记忆。完成练习后读一读解析，遇到不熟悉的知识，记得加入收藏。</p><div class="tip-box">建议每天练习 20 题，再复习 5 道错题。<br>稳定的小进步，也会积累成专业的底气。</div><div class="inline-links"><a href="#exam">试试模拟测验</a><a href="#favorites">查看我的收藏</a></div></section></div><div class="banner">${icon('info',16)}<span>答案与解析沿用原题库。发现的原文矛盾或缺失已逐题标注，可随时查看原 PDF 核对。</span></div>`;}
function filtered(){return Q.filter(q=>(view!=='wrong'||isWrong(q.id))&&(view!=='favorites'||state.favorites.includes(q.id))&&(filters.type==='all'||filters.type===q.type)&&(filters.category==='all'||filters.category===q.category)&&(filters.status==='all'||(filters.status==='new'&&!state.records[q.id])||(filters.status==='done'&&state.records[q.id])||(filters.status==='issue'&&q.sourceNote))&&(!filters.search||`${q.title} ${q.options.map(o=>o.text).join(' ')} ${q.explanation} ${q.number} ${q.category}`.toLowerCase().includes(filters.search.toLowerCase())));}
function list(){lastList=view;const names={library:['全部题库','在完整题库中找到知识，也找到你的学习节奏。'],wrong:['错题本','把薄弱的知识点，再认真练习一次。答对后自动移出。'],favorites:['我的收藏','把值得反复温习的题目，放在触手可及的地方。']};return heading(...names[view],`<button class="btn soft" data-action="list-start">${icon('book',16)} 开始练习</button>`)+`<section class="filter-panel"><div class="search-box">${icon('search',18)}<label class="sr-only" for="search">搜索题目、选项、解析或题号</label><input id="search" type="search" placeholder="搜索题目、选项、解析或原题号…" value="${esc(filters.search)}" autocomplete="off"></div><div class="filter-line"><span class="filter-label">题型</span><div class="chips">${[['all','全部题型'],...Object.entries(TYPES)].map(([t,l])=>`<button class="chip ${filters.type===t?'selected':''}" data-filter="${t}" aria-pressed="${filters.type===t}">${l}</button>`).join('')}</div></div><div class="filter-line"><label class="filter-label" for="category">专题</label><select id="category" class="filter-select"><option value="all">全部知识专题</option>${CATEGORIES.map(c=>`<option ${filters.category===c?'selected':''}>${c}</option>`).join('')}</select><label class="sr-only" for="status">题目状态</label><select id="status" class="filter-select">${[['all','全部状态'],['new','尚未练习'],['done','已练习'],['issue','原文问题标注']].map(([v,l])=>`<option value="${v}" ${filters.status===v?'selected':''}>${l}</option>`).join('')}</select><button class="btn text small-btn" data-action="reset-filters">重置筛选</button></div></section><div id="list-content">${listContent()}</div>`;}
function listContent(){const qs=filtered(),pages=Math.max(1,Math.ceil(qs.length/15));filters.page=Math.min(filters.page,pages);const start=(filters.page-1)*15;return `<div class="list-bar"><span>共 <b>${qs.length}</b> 道题目</span><div class="list-actions"><button class="btn small-btn" data-action="list-random">${icon('shuffle',14)} 随机练习</button><button class="btn small-btn" data-action="list-memorize">${icon('book',14)} 背题模式</button></div></div>${qs.length?`<div class="question-list">${qs.slice(start,start+15).map(q=>{const r=state.records[q.id];return `<article class="question-row"><div class="row-main"><div class="tags">${typeTag(q)}<span>${q.category}</span><span>原题 ${q.number}</span>${q.sourceNote?'<span class="tag warning">原文有标注</span>':''}</div><button class="row-title" data-open="${q.id}">${esc(q.title)}</button><div class="row-status">${r?(r.lastCorrect?`已答对 · 累计练习 ${r.attempts} 次`:`待复习 · 累计答错 ${r.wrongCount} 次`):'尚未练习'}${state.notes[q.id]?' · 有学习笔记':''}</div></div><button class="icon-btn ${state.favorites.includes(q.id)?'active':''}" data-favorite="${q.id}" aria-label="${state.favorites.includes(q.id)?'取消收藏':'收藏'}${TYPES[q.type]}第${q.number}题" aria-pressed="${state.favorites.includes(q.id)}">${icon('star',17)}</button><button class="btn small-btn" data-open="${q.id}">练习</button></article>`;}).join('')}</div><div class="pagination"><button class="btn small-btn" data-page="${filters.page-1}" ${filters.page===1?'disabled':''}>上一页</button><span>${filters.page} / ${pages}</span><button class="btn small-btn" data-page="${filters.page+1}" ${filters.page===pages?'disabled':''}>下一页</button></div>`:`<div class="empty">${icon(view==='wrong'?'check':'search',40)}<h2>${view==='wrong'&&!filters.search&&filters.type==='all'&&filters.category==='all'?'暂时没有待复习的错题':'这里还没有题目'}</h2><p>${view==='favorites'?'练习时点击星标，就能在这里找到收藏。':'试试调整筛选条件，或从全部题库开始练习。'}</p><a href="#library" class="btn soft">浏览全部题库</a></div>`}`;}
function start(ids,title,mode='practice',reveal=false,reviewAnswers=null){if(!ids.length){toast('当前没有可练习的题目');return;}const s={ids:[...ids],index:0,answers:reviewAnswers||{},drafts:{},title,reveal,review:!!reviewAnswers,completed:false,startedAt:Date.now(),origin:lastList};if(mode==='exam'){s.endAt=Date.now()+examMinutes*60000;s.minutes=examMinutes;state.exam=s;lastList='exam';}else state.practice=s;save();go(mode==='exam'?'exam-run':'practice');}
function currentSession(){return view==='exam-run'?state.exam:state.practice;}
function practice(){const s=currentSession();if(s?.origin)lastList=s.origin;if(!s)return `<div class="empty"><h2>准备开始练习了吗？</h2><p>选择一组题目，开始今天的学习。</p><a href="#library" class="btn primary">前往题库</a></div>`;const exam=view==='exam-run',q=byId[s.ids[s.index]],submitted=s.answers[q.id],selected=submitted||s.drafts[q.id]||[],reveal=!exam&&(!!submitted||s.reveal||s.review),ok=same(submitted,q.answer),answered=Object.values(exam?s.drafts:s.answers).filter(a=>a.length).length;return `<div class="practice-head"><div class="flex"><button class="btn small-btn" data-action="leave-practice">返回</button><span class="crumb">${esc(s.title)}</span></div><span class="count-badge">第 ${s.index+1} / ${s.ids.length} 题 ${s.review?'· 答卷回顾':s.reveal?'· 背题不计成绩':''}</span></div><div class="practice-layout"><section class="question-panel" data-question-id="${q.id}" data-ai-allowed="${!exam}"><div class="q-toolbar"><div class="tags">${typeTag(q)}<span>${q.category}</span><span>原题 ${q.number}</span></div><button class="icon-btn ${state.favorites.includes(q.id)?'active':''}" data-favorite="${q.id}" aria-label="${state.favorites.includes(q.id)?'取消收藏':'收藏本题'}" aria-pressed="${state.favorites.includes(q.id)}">${icon('star',19)}</button></div><h1 class="q-title">${esc(q.title)}</h1><p class="q-instruction">${s.review?'答卷回顾：下方显示当时作答与参考答案。':s.reveal?'背题模式：直接阅读参考答案与解析，不计入学习成绩。':q.type==='multiple'?'多选题，请选出所有正确选项；少选、多选均按答错计。':q.type==='boolean'?'判断下列表述是否正确。':'请选择一个最合适的答案。'}</p><div class="options" role="group" aria-label="本题选项">${q.options.map(o=>{const chosen=selected.includes(o.key),correct=q.answer.includes(o.key),cls=reveal?(correct?'correct':chosen?'wrong':''):chosen?'selected':'';return `<button class="option ${q.type==='multiple'?'multi':''} ${cls}" data-option="${o.key}" aria-pressed="${chosen}" ${reveal?'disabled':''}><span class="option-key">${q.type==='boolean'?(o.key==='T'?'√':'×'):o.key}</span><span>${esc(o.text)}</span>${reveal&&(correct||chosen)?`<span class="answer-mark">${correct?'参考答案':'你的选择'}</span>`:''}</button>`;}).join('')}</div>${reveal?`<section class="explanation ${submitted&&!ok?'bad':''}" aria-live="polite"><div class="answer-result"><strong>${s.reveal&&!submitted?'参考答案':submitted?(ok?'回答正确':'本题答错'):'本题未作答'}</strong><span>原题答案：${answerText(q,q.answer)}</span>${!s.reveal?`<span>你的答案：${answerText(q,submitted)}</span>`:''}</div><h3>原题解析</h3><p>${esc(q.explanation)}</p></section>${q.sourceNote?`<div class="source-note">${icon('info',16)} <strong>原文核对提示：</strong>${esc(q.sourceNote)}本页按原题库答案判分。</div>`:''}`:''}<div class="q-actions"><button class="btn" data-action="prev" ${s.index===0?'disabled':''}>上一题</button><div class="q-actions-right">${!reveal&&!exam?`<button class="btn primary" data-action="submit-answer" ${!selected.length?'disabled':''}>确认答案</button>`:''}<button class="btn ${reveal||exam?'primary':''}" data-action="next">${s.index===s.ids.length-1?(exam?'检查答卷':'完成练习'):'下一题'}</button></div></div>${!exam?`<a class="source-link" href="${SOURCE}#page=${q.page}" target="_blank" rel="noopener">查看原 PDF · 第 ${q.page} 页</a><details class="notes" ${state.notes[q.id]?'open':''}><summary>我的学习笔记 ${state.notes[q.id]?'· 已记录':''}</summary><label class="sr-only" for="question-note">本题学习笔记</label><textarea id="question-note" data-note="${q.id}" maxlength="5000" placeholder="用自己的话记下知识点，笔记自动保存…">${esc(state.notes[q.id]||'')}</textarea><span class="note-count">仅保存在当前浏览器 · 最多 5000 字</span></details>`:''}</section><aside class="side-panel"><div class="section-title"><h3>${exam?'测验答题卡':'练习答题卡'}</h3><span class="small">${s.ids.length} 题</span></div>${exam?`<div class="timer" id="timer" role="timer" aria-label="测验剩余时间"></div><p class="small muted">交卷后统一查看答案与解析</p>`:''}<div class="progress-track"><span style="width:${answered/s.ids.length*100}%"></span></div><div class="side-summary"><span>${s.reveal?'背题模式':`已答 ${answered} 题`}</span><span>${Math.round(answered/s.ids.length*100)}%</span></div><div class="number-grid">${s.ids.map((id,i)=>{const a=s.answers[id],draft=s.drafts[id],cls=exam?(draft?.length?'done':''):(a?(same(a,byId[id].answer)?'ok':'no'):'');return `<button class="number-btn ${cls} ${s.index===i?'current':''}" data-jump="${i}" aria-label="第${i+1}题，${a||draft?.length?'已作答':'未作答'}" ${s.index===i?'aria-current="true"':''}>${i+1}</button>`;}).join('')}</div><div class="legend"><span><i></i>未答</span>${exam?'<span><i class="done"></i>已选</span>':'<span><i class="ok"></i>答对</span><span><i class="no"></i>答错</span>'}</div>${exam?'<button class="btn primary w-full mt" data-action="finish-exam">结束测验并交卷</button>':!s.review?`<button class="btn w-full mt" data-action="toggle-reveal">${s.reveal?'切换到答题模式':'切换到背题模式'}</button>`:''}<p class="aside-tip">${exam?'选择即自动暂存。可跳题、修改选项，计时结束后自动交卷。':'点击题号自由跳转。答错的题目自动收入错题本，下次答对即可移出。'}</p></aside></div>`;}
function exam(){lastList='exam';return heading('模拟测验','给自己一段专注的时间，检验真实的知识掌握程度。')+(state.exam?`<div class="banner" style="margin:0 0 20px">${icon('clock',17)}<span>你有一场尚未交卷的测验，剩余时间以原计时为准。</span><button class="btn small-btn soft" data-action="resume-exam">继续测验</button></div>`:'')+`<div class="setup-grid"><section class="panel setup-card"><h2>准备好，开始一次自我检验</h2><p>从完整题库中随机抽题，交卷后生成成绩与答题回顾。</p><label class="field"><span>测验题量</span><div class="segmented">${[20,50,100].map(n=>`<button class="segment ${examCount===n?'selected':''}" data-exam-count="${n}" aria-pressed="${examCount===n}">${n} 题</button>`).join('')}</div></label><label class="field" for="exam-minutes"><span>测验时长</span><select id="exam-minutes">${[20,30,60,90,120].map(n=>`<option value="${n}" ${examMinutes===n?'selected':''}>${n} 分钟</option>`).join('')}</select></label><p class="small">单选、多选、判断按原题库比例抽取。每题等值，多选题全对得分。</p><button class="btn primary w-full" data-action="start-exam">${icon('exam',17)} 开始模拟测验</button></section><aside class="panel setup-guide"><div class="eyebrow">A MOMENT TO FOCUS</div><div class="setup-number">470<span style="font-size:17px"> 题</span></div><h3>让一次测验，变成一次进步</h3><p>测验期间不显示参考答案。<br>未作答的题目按答错计入成绩。<br>计时结束后自动交卷。<br>完成后，错题自动进入错题本。</p><div class="tip-box">成绩只反映本次题库练习表现。<br>原题的矛盾标注会在交卷后显示。</div></aside></div><section class="panel mt"><div class="section-title"><h2>最近测验</h2><span class="small">保留最近 30 次</span></div>${state.history.length?state.history.map((h,i)=>{const correct=h.ids.filter(id=>same(h.answers[id],byId[id].answer)).length;return `<div class="exam-record"><span class="score">${Math.round(correct/h.ids.length*100)}<small> 分</small></span><div class="record-info">${h.ids.length} 题模拟测验 · 答对 ${correct} 题<small>${formatDate(h.date)}</small></div><button class="btn small-btn" data-history="${i}">回顾答卷</button></div>`;}).join(''):`<p class="small muted">还没有测验记录。完成第一场测验，留下你的进步足迹。</p>`}</section>`;}
function formatDate(date){const d=new Date(date);return Number.isNaN(d.valueOf())?'':esc(d.toLocaleString('zh-CN',{year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'}));}
function tick(){if(state.exam&&!state.exam.completed&&state.exam.endAt<=Date.now()){finishExam(true);return;}const el=document.getElementById('timer');if(el&&state.exam){const left=Math.max(0,Math.ceil((state.exam.endAt-Date.now())/1000));el.textContent=`${String(Math.floor(left/60)).padStart(2,'0')}:${String(left%60).padStart(2,'0')}`;el.classList.toggle('urgent',left<300);}}
function makeExam(){const counts={single:Math.round(examCount*300/470),multiple:Math.round(examCount*70/470)};counts.boolean=examCount-counts.single-counts.multiple;const ids=shuffle(Object.entries(counts).flatMap(([t,n])=>shuffle(Q.filter(q=>q.type===t).map(q=>q.id)).slice(0,n)));start(ids,`${examCount} 题模拟测验`,'exam');}
function finishExam(auto=false){const s=state.exam;if(!s)return;const complete=()=>{const answers={...s.drafts};for(const id of s.ids)record(id,answers[id]||[]);const h={id:`exam-${Date.now()}`,ids:s.ids,answers,date:new Date().toISOString(),count:s.ids.length,minutes:s.minutes,elapsed:Math.min(s.minutes*60000,Date.now()-s.startedAt)};state.history.unshift(h);state.history=state.history.slice(0,30);state.exam=null;state.result={...h,kind:'exam'};save();go('result');if(auto)toast('测验时间已到，已自动交卷');};if(auto)complete();else{const n=s.ids.filter(id=>!s.drafts[id]?.length).length;modal('结束测验并交卷',n?`还有 ${n} 道题未作答，未作答的题目将按答错计分并进入错题本。确认交卷吗？`:'所有题目已作答。交卷后将生成成绩与解析。',complete,'确认交卷');}}
function finishPractice(){const s=state.practice;if(s.review){go(lastList);return;}const missing=s.ids.filter(id=>!s.answers[id]).length;const complete=()=>{s.completed=true;state.result={kind:s.reveal?'memorize':'practice',ids:s.ids,answers:s.answers,date:new Date().toISOString()};save();go('result');};if(missing&&!s.reveal)modal('结束本轮练习',`还有 ${missing} 道题未提交答案。结束后仅统计已提交的题目，未答题目不计入错题。`,complete,'结束练习');else complete();}
function result(){const r=state.result;if(!r)return `<div class="empty"><h2>暂无本次练习结果</h2><a href="#home" class="btn primary">回到学习概览</a></div>`;const ids=r.ids,exam=r.kind==='exam',memorize=r.kind==='memorize',submitted=ids.filter(id=>r.answers[id]),correct=ids.filter(id=>same(r.answers[id],byId[id].answer)),wrong=ids.filter(id=>(exam||r.answers[id])&&!same(r.answers[id],byId[id].answer)),denom=exam?ids.length:submitted.length;return `<section class="panel result-panel">${icon(memorize?'book':'check',42)}<h1 class="mt">${memorize?'本轮背题已结束':exam?'测验已完成':'本轮练习已完成'}</h1><p class="muted small">每一次认真学习，都会让你更有底气。</p>${!memorize?`<div class="result-score">${denom?Math.round(correct.length/denom*100):0}<small>${exam?' 分':'% 正确率'}</small></div><div class="result-stats"><div><b>${correct.length}</b><span>答对题目</span></div><div><b>${wrong.length}</b><span>答错题目</span></div><div><b>${ids.length-submitted.length}</b><span>未作答题目</span></div></div><p class="small muted">${exam?'每题等值，未答题计零分；错题已自动收录。':'仅统计已提交答案的题目，错题已自动收录。'}</p>`:'<p class="muted">背题模式不计分，不改变错题与练习记录。</p>'}<div class="result-buttons">${wrong.length?'<button class="btn primary" data-action="result-wrong">复习本次错题</button>':''}<button class="btn ${wrong.length?'':'primary'}" data-action="result-review">${memorize?'再次背题':'回顾全部题目'}</button><a class="btn" href="#home">回到概览</a></div></section>`;}
function settings(){const s=stats();return heading('数据管理','把学习记录妥善保存，让进步有迹可循。')+`<div class="settings-grid"><section class="panel"><h2>学习记录备份</h2><p>记录保存在当前设备、当前浏览器。换手机、换浏览器或清理浏览器数据前，请先导出备份，再在新设备导入。</p><div class="settings-actions"><button class="btn primary" data-action="export">${icon('download',16)} 导出学习记录</button><button class="btn" data-action="import">导入备份</button><input id="import-file" class="file-input" type="file" accept="application/json,.json"></div><p class="settings-note">备份包含答题记录、错题、收藏、笔记和测验历史。导入将替换当前记录。</p><div class="info-table"><table class="info-table"><tbody><tr><td>已练习</td><td>${s.done} / 470 题</td></tr><tr><td>当前错题</td><td>${s.wrong} 题</td></tr><tr><td>收藏与笔记</td><td>${state.favorites.length} 道收藏 · ${Object.keys(state.notes).filter(id=>state.notes[id]).length} 条笔记</td></tr></tbody></table></div></section><section class="panel"><h2>阅读与显示</h2><label class="toggle-row"><span>放大答题文字</span><input type="checkbox" id="big-text" ${state.settings.bigText?'checked':''}></label><p>开启后放大题干、选项和解析文字，适合在手机上阅读。</p><h2 class="mt">题库来源</h2><table class="info-table"><tbody><tr><td>原始文件</td><td>医疗陪诊顾问-题库202512</td></tr><tr><td>PDF 页数</td><td>72 页</td></tr><tr><td>完整收录</td><td>300 单选 / 70 多选 / 100 判断</td></tr></tbody></table><div class="settings-actions"><a class="btn small-btn" href="offline.html" download="陪诊题库-离线版.html">下载离线网页</a><a class="btn small-btn" href="${SOURCE}" target="_blank" rel="noopener">打开原始 PDF</a><a class="btn small-btn" href="${SOURCE}" download="医疗陪诊顾问-题库202512.pdf">下载原始 PDF</a></div></section><section class="panel"><h2>关于原题内容</h2><p>题干、选项、答案和解析均提取自原 PDF；保留原题号与重复题目，另按内容整理了 15 个知识专题。背题不计分，模拟测验交卷后才显示答案。</p><p>题库答案未作医学或法律有效性审核。练习按原题库参考答案判分，原文问题会单独提示，便于向授课老师核对。</p><details class="source-issues"><summary>查看已发现的 ${Q.filter(q=>q.sourceNote).length} 处原文问题</summary><ul>${Q.filter(q=>q.sourceNote).map(q=>`<li><button class="btn text small-btn" data-open="${q.id}">${TYPES[q.type]}第 ${q.number} 题</button>：${esc(q.sourceNote)}</li>`).join('')}</ul></details></section><section class="panel"><h2>重新开始学习</h2><p>清空此浏览器里的所有答题记录、错题、收藏、笔记和测验记录。建议先导出一份备份。</p><button class="btn danger" data-action="reset-data">清空全部学习记录</button><p class="settings-note">题库内容和原始 PDF 不受影响。</p></section></div>`;}
function render(){view=(location.hash.slice(1)||'home').split('/')[0];document.body.classList.toggle('big-text',state.settings.bigText);const titles={home:'学习概览',library:'全部题库',wrong:'错题本',favorites:'我的收藏',exam:'模拟测验','exam-run':'模拟测验',practice:'题库练习',result:'学习结果',settings:'数据管理'};document.getElementById('page-title').textContent=titles[view]||'学习概览';if(view==='practice'&&state.practice?.origin)lastList=state.practice.origin;navigation();const routes={home,library:list,wrong:list,favorites:list,exam,'exam-run':practice,practice,result,settings};main.innerHTML=(routes[view]||home)();tick();if(storageFailed)document.getElementById('save-status').textContent='本地保存异常，请导出备份';}
function refreshList(){document.getElementById('list-content').innerHTML=listContent();}
function toggleFavorite(id){if(!byId[id])return;const old=state.favorites.includes(id);state.favorites=old?state.favorites.filter(x=>x!==id):[...state.favorites,id];save();if(['library','wrong','favorites'].includes(view))refreshList();else if(view==='practice'||view==='exam-run'){const b=main.querySelector(`[data-favorite="${id}"]`);b?.classList.toggle('active',!old);b?.setAttribute('aria-pressed',String(!old));b?.setAttribute('aria-label',old?'收藏本题':'取消收藏');}toast(old?'已取消收藏':'已加入收藏');}
function nextQuestion(dir){const s=currentSession();if(!s)return;if(s.index+dir>=s.ids.length){view==='exam-run'?finishExam():finishPractice();return;}s.index=Math.max(0,s.index+dir);save();render();window.scrollTo({top:0,behavior:'instant'});}
function download(filename,content,type='application/json'){const blob=new Blob([content],{type}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),10000);}
main.addEventListener('click',e=>{const b=e.target.closest('button');if(!b||b.disabled)return;if(b.dataset.favorite){toggleFavorite(b.dataset.favorite);return;}if(b.dataset.filter){filters.type=b.dataset.filter;filters.page=1;render();return;}if(b.dataset.page){filters.page=Number(b.dataset.page);refreshList();window.scrollTo({top:180,behavior:'instant'});return;}if(b.dataset.open){const pool=['library','wrong','favorites'].includes(view)?filtered().map(q=>q.id):[b.dataset.open];const id=b.dataset.open;start(pool,view==='wrong'?'错题巩固':view==='favorites'?'收藏练习':'题库练习');state.practice.index=Math.max(0,pool.indexOf(id));save();if(view==='practice')render();return;}if(b.dataset.option){const s=currentSession();if(!s)return;const id=s.ids[s.index],q=byId[id];if(view!=='exam-run'&&(s.answers[id]||s.reveal||s.review))return;let selected=s.drafts[id]||[];selected=q.type==='multiple'?(selected.includes(b.dataset.option)?selected.filter(k=>k!==b.dataset.option):[...selected,b.dataset.option]):[b.dataset.option];s.drafts[id]=selected.sort();save();render();return;}if(b.dataset.jump){currentSession().index=Number(b.dataset.jump);save();render();window.scrollTo({top:0,behavior:'instant'});return;}if(b.dataset.examCount){examCount=Number(b.dataset.examCount);render();return;}if(b.dataset.history){const h=state.history[Number(b.dataset.history)];state.result={...h,kind:'exam'};save();go('result');return;}const a=b.dataset.action;if(!a)return;
 switch(a){
 case 'sequential':lastList='library';start(Q.map(q=>q.id),'顺序练习');break;
 case 'random':lastList='library';start(shuffle(Q.map(q=>q.id)),'随机练习');break;
 case 'wrong-mode':lastList='wrong';start(wrongIds(),'错题巩固');break;
 case 'resume':go('practice');break;
 case 'resume-exam':go('exam-run');break;
 case 'list-start':case 'list-random':case 'list-memorize':start(a==='list-random'?shuffle(filtered().map(q=>q.id)):filtered().map(q=>q.id),view==='wrong'?'错题巩固':view==='favorites'?'收藏练习':'题库练习','practice',a==='list-memorize');break;
 case 'reset-filters':filters={search:'',type:'all',category:'all',status:'all',page:1};render();break;
 case 'leave-practice':go(view==='exam-run'?'exam':lastList);break;
 case 'prev':nextQuestion(-1);break;
 case 'next':nextQuestion(1);break;
 case 'submit-answer':{const s=state.practice,id=s.ids[s.index],answer=s.drafts[id];if(!answer?.length||s.answers[id])break;s.answers[id]=[...answer];record(id,answer);save();render();break;}
 case 'toggle-reveal':state.practice.reveal=!state.practice.reveal;save();render();break;
 case 'finish-exam':finishExam();break;
 case 'start-exam':if(state.exam)modal('重新开始测验','已有测验尚未完成，重新开始会放弃当前测验的暂存答案。',makeExam,'重新开始');else makeExam();break;
 case 'result-wrong':{const r=state.result;const ids=r.ids.filter(id=>(r.kind==='exam'||r.answers[id])&&!same(r.answers[id],byId[id].answer));lastList='wrong';start(ids,'本次错题巩固');break;}
 case 'result-review':{const r=state.result;lastList=r.kind==='exam'?'exam':'library';if(r.kind==='memorize')start(r.ids,'背题回顾','practice',true);else start(r.ids,'答题回顾','practice',false,r.answers);break;}
 case 'export':download(`陪诊学习备份-${dayKey()}.json`,JSON.stringify({...state,exportedAt:new Date().toISOString(),bank:BANK.title},null,2));toast('学习备份已导出');break;
 case 'import':document.getElementById('import-file').click();break;
 case 'reset-data':modal('清空全部学习记录','这会删除当前浏览器内的所有学习数据，无法撤销。请确认已导出需要保留的备份。',()=>{state=blank();save();render();toast('学习记录已清空');},'确认清空',true);break;
 }
});
main.addEventListener('input',e=>{if(e.target.id==='search'){filters.search=e.target.value;filters.page=1;refreshList();}if(e.target.dataset.note){state.notes[e.target.dataset.note]=e.target.value;save();}});
main.addEventListener('change',e=>{if(e.target.id==='category'||e.target.id==='status'){filters[e.target.id]=e.target.value;filters.page=1;refreshList();}if(e.target.id==='exam-minutes')examMinutes=Number(e.target.value);if(e.target.id==='big-text'){state.settings.bigText=e.target.checked;save();document.body.classList.toggle('big-text',state.settings.bigText);}if(e.target.id==='import-file'){const f=e.target.files[0];if(!f)return;if(f.size>10*1024*1024){toast('备份文件过大，请选择有效的 JSON 备份');return;}f.text().then(t=>{let imported;try{imported=validState(JSON.parse(t));}catch{toast('备份文件格式不正确，未修改当前记录');return;}modal('导入学习备份',`将替换当前记录。备份中有 ${Object.keys(imported.records).length} 道已练习题和 ${imported.favorites.length} 道收藏。确认导入吗？`,()=>{state=imported;save();render();toast('备份已导入');},'导入并替换');}).catch(()=>toast('文件读取失败，请重新选择备份'));e.target.value='';}});
window.addEventListener('hashchange',()=>{if(!['library','wrong','favorites'].includes((location.hash.slice(1)||'home').split('/')[0]))filters.page=1;render();});
window.addEventListener('storage',e=>{if(e.key===KEY){try{state=e.newValue?validState(JSON.parse(e.newValue)):blank();render();toast('已同步此浏览器其他标签页的学习记录');}catch{toast('其他标签页的数据无法读取');}}});
setInterval(tick,1000);render();
})();
</script>
</body>
