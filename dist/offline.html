情低落"},{"key":"C","text":"持续的兴奋状态"},{"key":"D","text":"记忆力显著下降"}],"answer":["B"],"explanation":"抑郁症的主要临床特征指的是显著而持久的心情低落。","page":45,"endPage":45,"category":"心理健康","sourceNote":""},{"id":"single-261","type":"single","number":261,"title":"抑郁症患者可能出现的严重症状包括","options":[{"key":"A","text":"持续的不幸福感"},{"key":"B","text":"幻想和妄想"},{"key":"C","text":"强烈的食欲"},{"key":"D","text":"长时间逃避社交"}],"answer":["B"],"explanation":"抑郁症最严重的症状是幻想和妄想。","page":45,"endPage":45,"category":"心理健康","sourceNote":""},{"id":"single-262","type":"single","number":262,"title":"抑郁症患者的情绪消沉可能出现什么样的变化","options":[{"key":"A","text":"从极度兴奋到轻度愉快"},{"key":"B","text":"从焦虑不安到极度恐慌"},{"key":"C","text":"从闷闷不乐到悲痛欲绝"},{"key":"D","text":"从轻度消沉到极度狂躁"}],"answer":["C"],"explanation":"抑郁症患者的情绪消沉可出现从闷闷不乐到悲痛欲绝的变化。","page":45,"endPage":45,"category":"心理健康","sourceNote":""},{"id":"single-263","type":"single","number":263,"title":"中医养生是指通过各种方法颐养生命、增强体质、预防疾病，从而达到延年益寿的一种医事活动。通过调节情绪来达到养生效果是中医养生中的","options":[{"key":"A","text":"顺时养生"},{"key":"B","text":"情志养生"},{"key":"C","text":"气功养生"},{"key":"D","text":"经络养生"}],"answer":["B"],"explanation":"情志养生是指通过调节情绪来达到养生的效果。","page":45,"endPage":45,"category":"康复与中医","sourceNote":""},{"id":"single-264","type":"single","number":264,"title":"在中医养生中，“顺时养生”强调的是","options":[{"key":"A","text":"根据季节变化调整饮食和生活方式"},{"key":"B","text":"根据个人体质选择养生方法"},{"key":"C","text":"仅在特定季节进行养生活动"},{"key":"D","text":"通过运动来适应四季变化"}],"answer":["A"],"explanation":"“顺时养生”强调的是根据季节变化调整饮食和生活方式。","page":45,"endPage":45,"category":"康复与中医","sourceNote":""},{"id":"single-265","type":"single","number":265,"title":"通过呼吸和动作的协调来增强身体机能，运用的是中医养生中的哪种养生方式","options":[{"key":"A","text":"药物养生"},{"key":"B","text":"睡眠养生"},{"key":"C","text":"膳食养生"},{"key":"D","text":"气功养生"}],"answer":["D"],"explanation":"气功养生是通过呼吸和动作的协调来增强身体机能。","page":45,"endPage":46,"category":"康复与中医","sourceNote":""},{"id":"single-266","type":"single","number":266,"title":"在健康咨询中，维护咨询人员隐私权、保密权和自我决定的权利属于哪个伦理边界原则","options":[{"key":"A","text":"善行"},{"key":"B","text":"责任"},{"key":"C","text":"公正"},{"key":"D","text":"尊重"}],"answer":["D"],"explanation":"维护咨询人员隐私权、保密权和自我决定的权利属于尊重的原则。","page":46,"endPage":46,"category":"咨询与访视","sourceNote":""},{"id":"single-267","type":"single","number":267,"title":"健康咨询中，咨询师应如何对待潜在的偏见和能力局限","options":[{"key":"A","text":"采取忽视态度"},{"key":"B","text":"公开讨论"},{"key":"C","text":"采取谨慎态度，防止不适当行为"},{"key":"D","text":"完全避免咨询"}],"answer":["C"],"explanation":"当健康咨询中出现潜在的偏见和能力局限，需采用谨慎态度，防止不适当行为。","page":46,"endPage":46,"category":"咨询与访视","sourceNote":""},{"id":"single-268","type":"single","number":268,"title":"在健康咨询中，咨询师与来访者保持除专业关系以外的其他社会关系，这可能会","options":[{"key":"A","text":"加强信任关系"},{"key":"B","text":"破坏专业界限"},{"key":"C","text":"增加咨询效果"},{"key":"D","text":"无关紧要"}],"answer":["B"],"explanation":"在健康咨询中，咨询师与来访者出现了除专业关系外的其他社会关系时，会破坏专业界限。","page":46,"endPage":46,"category":"咨询与访视","sourceNote":""},{"id":"single-269","type":"single","number":269,"title":"当咨询者的问题超出健康咨询服务范围时，咨询师应采取的措施是","options":[{"key":"A","text":"继续提供咨询服务"},{"key":"B","text":"尝试自行解决问题"},{"key":"C","text":"转给其他专家或有关机构处理"},{"key":"D","text":"忽略问题范围，继续咨询"}],"answer":["C"],"explanation":"当咨询者的问题超出健康咨询服务范围时，咨询师应转给其他专家或有关机构处理。","page":46,"endPage":46,"category":"咨询与访视","sourceNote":""},{"id":"single-270","type":"single","number":270,"title":"当咨询者出现情绪不稳或行为反常时，咨询师应立即","options":[{"key":"A","text":"忽视这些行为，继续咨询"},{"key":"B","text":"采取适当的措施并干预"},{"key":"C","text":"让咨询者自行调节"},{"key":"D","text":"推荐咨询者参加情绪管理课程"}],"answer":["B"],"explanation":"当咨询者出现情绪不稳或行为反常时，咨询师应立即采取适当的措施并进行干预。","page":46,"endPage":46,"category":"咨询与访视","sourceNote":""},{"id":"single-271","type":"single","number":271,"title":"健康访视的分类不包括以下哪一项","options":[{"key":"A","text":"评估性访视"},{"key":"B","text":"连续照顾性访视"},{"key":"C","text":"急诊性访视"},{"key":"D","text":"预防性访视"}],"answer":["D"],"explanation":"健康访视的分类主要包括评估性访视、连续照顾性访视和急诊性访视。预防性访视并不是文档中提到的分类之一。","page":46,"endPage":47,"category":"咨询与访视","sourceNote":""},{"id":"single-272","type":"single","number":272,"title":"评估性访视通常适用于哪种情况","options":[{"key":"A","text":"患有慢性病的患者"},{"key":"B","text":"社区中老年体弱患者家庭的考察"},{"key":"C","text":"临时发生紧急情况"},{"key":"D","text":"卧床患者或临终患者"}],"answer":["B"],"explanation":"评估性访视通常是一次性的，适用于社区中老年体弱患者家庭的考察，如营养评估、皮肤评估、跌倒危险因素评估等。","page":47,"endPage":47,"category":"咨询与访视","sourceNote":""},{"id":"single-273","type":"single","number":273,"title":"连续照顾性访视的特点是","options":[{"key":"A","text":"通常是随机进行"},{"key":"B","text":"通常是定期进行"},{"key":"C","text":"只针对急性疾病"},{"key":"D","text":"仅限于首次访视"}],"answer":["B"],"explanation":"连续照顾性访视通常是定期进行的，适用于患有慢性病或行动受限的卧床患者或临终患者。","page":47,"endPage":47,"category":"咨询与访视","sourceNote":""},{"id":"single-274","type":"single","number":274,"title":"急诊性访视的特点是","options":[{"key":"A","text":"通常是定期进行"},{"key":"B","text":"多为随机性的"},{"key":"C","text":"只针对慢性病患者"},{"key":"D","text":"仅限于首次访视"}],"answer":["B"],"explanation":"急诊性访视多为随机性的，适用于临时发生紧急情况的情况。","page":47,"endPage":47,"category":"咨询与访视","sourceNote":""},{"id":"single-275","type":"single","number":275,"title":"健康访视的对象可以是","options":[{"key":"A","text":"仅限于患者本人"},{"key":"B","text":"仅限于家庭成员"},{"key":"C","text":"患者本人或整个家庭、团队"},{"key":"D","text":"仅限于社区居民"}],"answer":["C"],"explanation":"健康访视的对象可以是患者本人或整个家庭、团队，具体取决于访视的目的和需求。","page":47,"endPage":47,"category":"咨询与访视","sourceNote":""},{"id":"single-276","type":"single","number":276,"title":"健康访视人群按健康状态划分不包括","options":[{"key":"A","text":"健康"},{"key":"B","text":"亚健康"},{"key":"C","text":"疾病"},{"key":"D","text":"绝对健康"}],"answer":["D"],"explanation":"健康访视人群按健康状态划分为健康、亚健康、亚临床、疾病、特殊生理时期状态，没有“绝对健康”这一分类。","page":47,"endPage":47,"category":"咨询与访视","sourceNote":""},{"id":"single-277","type":"single","number":277,"title":"健康访视人群按疾病类别划分不包括","options":[{"key":"A","text":"高血压"},{"key":"B","text":"糖尿病"},{"key":"C","text":"冠心病"},{"key":"D","text":"传染病"}],"answer":["D"],"explanation":"健康访视人群按疾病类别划分为高血压、高血脂症、糖尿病、冠心病、脑血管病、肥胖、痛风等，没有特别提到传染病。","page":47,"endPage":48,"category":"咨询与访视","sourceNote":""},{"id":"single-278","type":"single","number":278,"title":"健康访视人群按危险因素程度划分不包括","options":[{"key":"A","text":"低危险因素"},{"key":"B","text":"中危险因素"},{"key":"C","text":"极高危险因素"},{"key":"D","text":"无危险因素"}],"answer":["D"],"explanation":"健康访视人群按危险因素程度划分为低危险因素、中危险因素、高危险因素、极高危险因素，没有“无危险因素”这一分类。","page":48,"endPage":48,"category":"咨询与访视","sourceNote":""},{"id":"single-279","type":"single","number":279,"title":"健康访视人群按不同职业人群划分不包括","options":[{"key":"A","text":"教师"},{"key":"B","text":"公务员"},{"key":"C","text":"企业家"},{"key":"D","text":"农民工"}],"answer":["D"],"explanation":"健康访视人群按不同职业人群划分为教师、公务员、企业家、工程师、金融从业人员等，没有特别提到农民工。","page":48,"endPage":48,"category":"咨询与访视","sourceNote":""},{"id":"single-280","type":"single","number":280,"title":"健康访视人群按收费标准划分不包括","options":[{"key":"A","text":"自费"},{"key":"B","text":"公费医疗"},{"key":"C","text":"第三方支付"},{"key":"D","text":"政府全额资助"}],"answer":["D"],"explanation":"健康访视人群按收费标准划分为自费、公费（公费医疗、医保）、第三方支付，没有特别提到政府全额资助。","page":48,"endPage":48,"category":"咨询与访视","sourceNote":""},{"id":"single-281","type":"single","number":281,"title":"健康访视使用工具不包括","options":[{"key":"A","text":"问卷（纸质、电子）"},{"key":"B","text":"面谈（表格）"},{"key":"C","text":"电话"},{"key":"D","text":"手术器械"}],"answer":["D"],"explanation":"健康访视使用的工具包括问卷（纸质、电子）、面谈（表格）、电话、互联网（微信、电子问卷、视频访视、语音通话），手术器械不属于健康访视的工具。","page":48,"endPage":48,"category":"咨询与访视","sourceNote":""},{"id":"single-282","type":"single","number":282,"title":"健康访视的基本礼仪不包括","options":[{"key":"A","text":"事先预约"},{"key":"B","text":"按照约定时间到访"},{"key":"C","text":"穿着得体"},{"key":"D","text":"无需关心受访者"}],"answer":["D"],"explanation":"健康访视的基本礼仪包括事先预约、按照约定时间到访、穿着得体、态度友善、关心和尊重受访者等，不能忽视受访者的感受。","page":48,"endPage":48,"category":"咨询与访视","sourceNote":""},{"id":"single-283","type":"single","number":283,"title":"健康访视前准备的内容不包括","options":[{"key":"A","text":"了解服务对象基本信息"},{"key":"B","text":"确定沟通目的"},{"key":"C","text":"确定信息发送方法"},{"key":"D","text":"无需准备任何资料"}],"answer":["D"],"explanation":"健康访视前需要准备的内容包括了服务对象的基本信息、病情或沟通内容进展情况、确定沟通目的、确定信息发送方法（如电话、微信、面谈）等。","page":48,"endPage":49,"category":"咨询与访视","sourceNote":""},{"id":"single-284","type":"single","number":284,"title":"健康访视沟通技巧中的语言技巧不包括","options":[{"key":"A","text":"使用听者熟悉、易懂的语言"},{"key":"B","text":"语气和蔼可亲"},{"key":"C","text":"讲话速度过快"},{"key":"D","text":"发音吐字清晰"}],"answer":["C"],"explanation":"好的语言表达要遵循的要点包括使用听者熟悉、易懂的语言；语气和蔼可亲；讲话速度适中，避免过快和过慢；发音吐字清晰等。讲话速度过快不利于有效沟通。","page":49,"endPage":49,"category":"咨询与访视","sourceNote":""},{"id":"single-285","type":"single","number":285,"title":"健康访视沟通技巧中的倾听技巧不包括","options":[{"key":"A","text":"尽可能多听、留意听"},{"key":"B","text":"不轻易打断对方讲话"},{"key":"C","text":"保持友好和礼貌的态度"},{"key":"D","text":"频繁打断对方讲话"}],"answer":["D"],"explanation":"好的倾听技巧包括尽可能多听、留意听；不轻易打断对方讲话；保持友好和礼貌的态度；有眼神交流，点头或简单应","page":49,"endPage":49,"category":"咨询与访视","sourceNote":"原 PDF 的解析在“点头或简单应”处结束，原文不完整。"},{"id":"single-286","type":"single","number":286,"title":"健康访视沟通技巧中的提问技巧不包括","options":[{"key":"A","text":"提出封闭性问题"},{"key":"B","text":"提出开放性问题"},{"key":"C","text":"提出复合型问题"},{"key":"D","text":"提出探究性问题"}],"answer":["C"],"explanation":"好的提问技巧包括提出封闭性问题、开放性问题、试探性问题、探究性问题等，但复合型问题容易造成回","page":49,"endPage":49,"category":"咨询与访视","sourceNote":"原 PDF 的解析在“容易造成回”处结束，原文不完整。"},{"id":"single-287","type":"single","number":287,"title":"健康访视沟通技巧中的反馈技巧不包括","options":[{"key":"A","text":"积极性反馈"},{"key":"B","text":"消极性反馈"},{"key":"C","text":"模糊性反馈"},{"key":"D","text":"直接批评"}],"answer":["D"],"explanation":"反馈技巧包括积极性反馈、消极性反馈、模糊性反馈。直接批评不符合健康访视的沟通原则，应该采用和缓、委婉的方式纠正对方的错误观点和行为。","page":49,"endPage":49,"category":"咨询与访视","sourceNote":""},{"id":"single-288","type":"single","number":288,"title":"健康访视沟通技巧中的非语言传播技巧不包括","options":[{"key":"A","text":"动态体语"},{"key":"B","text":"静态体语"},{"key":"C","text":"类语言"},{"key":"D","text":"无声传播"}],"answer":["D"],"explanation":"非语言传播技巧包括动态体语（如点头、摇头、微笑、握手）、静态体语（如服饰整洁、仪表端庄）、类语言（如改变声调节奏、合理运用笑声）、时间语（如提前到达、准时赴约）、空间语（如安静整洁的环境、有利于交流的空间位置和距离）。无声传播不属于非语言传播技巧。","page":49,"endPage":50,"category":"咨询与访视","sourceNote":""},{"id":"single-289","type":"single","number":289,"title":"健康访视程序的第一阶段是","options":[{"key":"A","text":"访视中阶段"},{"key":"B","text":"访视后阶段"},{"key":"C","text":"访视前阶段"},{"key":"D","text":"无需准备阶段"}],"answer":["C"],"explanation":"健康访视程序分为三个阶段：访视前阶段、访视中阶段、访视后阶段。访视前阶段包括确定访视对象、目的、时间和内容，制定访视计划，与被访者取得联系，准备访视用品。","page":50,"endPage":50,"category":"咨询与访视","sourceNote":""},{"id":"single-290","type":"single","number":290,"title":"健康访视记录的内容不包括","options":[{"key":"A","text":"访视对象个人资料"},{"key":"B","text":"参加访视人员的姓名、职务"},{"key":"C","text":"访视时间"},{"key":"D","text":"无关的私人信息"}],"answer":["D"],"explanation":"健康访视记录的内容包括访视对象个人资料（如姓名、性别、年龄、现住址、联系方式）、参加访视人员的姓名、职务、访视时间、访视内容（如目前身体状况、既往史、家族史、治疗及用药情况、双方协商的内容和注意事项等），不应包含无关的私人信息。","page":50,"endPage":50,"category":"咨询与访视","sourceNote":""},{"id":"single-291","type":"single","number":291,"title":"健康访视结果总结时，对于首次访视的重点是","options":[{"key":"A","text":"分析存在健康问题中，那些能够通过改变生活方式得到改善，并提出相应的改进对策"},{"key":"B","text":"对比目前情况和既往情况，找出改进的地方"},{"key":"C","text":"无需总结，直接制定下次访视计划"},{"key":"D","text":"只记录访视对象的个人资料"}],"answer":["A"],"explanation":"首次访视的结果总结应分析存在的健康问题中，哪些可以通过改变生活方式得到改善，并提出相应的改进对策。这有助于为后续的健康管理提供方向。","page":50,"endPage":50,"category":"咨询与访视","sourceNote":""},{"id":"single-292","type":"single","number":292,"title":"健康访视结果总结时，对于非首次访视的重点是","options":[{"key":"A","text":"只记录访视对象的个人资料"},{"key":"B","text":"对比目前情况和既往情况，找出改进的地方"},{"key":"C","text":"无需总结，直接制定下次访视计划"},{"key":"D","text":"重新进行全面的身体检查"}],"answer":["B"],"explanation":"非首次访视的结果总结应对比目前情况和既往情况，找出改进的地方，肯定患者的进步，鼓励其继续保持良好的生活习惯；如果健康状况没有好转或恶化，应找出原因，更新改进对策，必要时提醒患者去医院就诊。","page":50,"endPage":50,"category":"咨询与访视","sourceNote":""},{"id":"single-293","type":"single","number":293,"title":"在健康访视过程中，以下哪项不是好的语言表达","options":[{"key":"A","text":"使用听者熟悉、易懂的语言"},{"key":"B","text":"语气和蔼可亲"},{"key":"C","text":"讲话速度过快"},{"key":"D","text":"发音吐字清晰"}],"answer":["C"],"explanation":"好的语言表达应使用听者熟悉、易懂的语言，语气和蔼可亲，讲话速度适中，避免过快和过慢，发音吐字清晰。讲话速度过快会影响沟通效果。","page":50,"endPage":51,"category":"咨询与访视","sourceNote":""},{"id":"single-294","type":"single","number":294,"title":"健康访视结束后，下列哪项属于访视后需要做的工作","options":[{"key":"A","text":"对访视内容进行整理、进行完整记录"},{"key":"B","text":"询问访视对象的目前身体状况"},{"key":"C","text":"制定访视计划"},{"key":"D","text":"与被访者取得联系"}],"answer":["A"],"explanation":"访视结束后，需要对访视内容进行整理并进行完整记录，重现检查、更改护理计划，制定下次访视计划。询问访视对象的目前身体状况、制定访视计划、与被访者取得联系属于访视前的工作。","page":51,"endPage":51,"category":"咨询与访视","sourceNote":""},{"id":"single-295","type":"single","number":295,"title":"健康访视沟通技巧中的观察技巧不包括","options":[{"key":"A","text":"要细心，全面和敏锐"},{"key":"B","text":"捕捉细微的变化"},{"key":"C","text":"透过表面现象发现深层的内心活动"},{"key":"D","text":"把细心的观察变成窥视"}],"answer":["D"],"explanation":"好的观察技巧包括要细心、全面和敏锐，善于捕捉细微的变化，能够透过表面现象发现深层的内心活动和被掩盖的事实。把细心的观察变成窥视会引起对方的反感，导致交流无法进行。","page":51,"endPage":51,"category":"咨询与访视","sourceNote":""},{"id":"single-296","type":"single","number":296,"title":"健康访视的概念是指为了什么而对访视对象及其家庭成员提供服务的活动","options":[{"key":"A","text":"治疗疾病"},{"key":"B","text":"维持和促进个人、家庭与社区的健康"},{"key":"C","text":"进行医学检查"},{"key":"D","text":"提供心理咨询"}],"answer":["B"],"explanation":"健康访视是为了维持和促进个人、家庭与社区的健康而提供的服务活动，包括评估、连续照顾和急诊性访视等多种形式。","page":51,"endPage":51,"category":"咨询与访视","sourceNote":""},{"id":"single-297","type":"single","number":297,"title":"在医院中，导诊人员在帮助患者挂号时，应该优先考虑的是：","options":[{"key":"A","text":"挂号费的高低"},{"key":"B","text":"患者的舒适度和便利性"},{"key":"C","text":"挂号窗口的排队人数"},{"key":"D","text":"挂号人员的亲和力"}],"answer":["B"],"explanation":"导诊人员在帮助患者挂号时，应优先考虑患者的舒适度和便利性，确保患者能够尽快得到合适的医疗服务。","page":51,"endPage":51,"category":"陪诊与导诊","sourceNote":""},{"id":"single-298","type":"single","number":298,"title":"如果患者在就诊过程中出现情绪激动或焦虑，导诊人员应该怎么做","options":[{"key":"A","text":"忽略患者的情绪，继续工作"},{"key":"B","text":"尽量安抚患者，提供必要的心理支持"},{"key":"C","text":"让患者自己冷静下来"},{"key":"D","text":"建议患者离开医院"}],"answer":["B"],"explanation":"导诊人员在面对情绪激动或焦虑的患者时，应尽量安抚患者，提供必要的心理支持，帮助患者保持冷静，以便更好地接受治疗。","page":51,"endPage":52,"category":"陪诊与导诊","sourceNote":""},{"id":"single-299","type":"single","number":299,"title":"陪诊人员在帮助患者预约医生时，以下哪项是最重要的","options":[{"key":"A","text":"预约最早的时间"},{"key":"B","text":"预约最便宜的医生"},{"key":"C","text":"预约最适合患者病情的医生"},{"key":"D","text":"预约最知名的医生"}],"answer":["C"],"explanation":"在帮助患者预约医生时，最重要的是选择最适合患者病情的医生，以确保患者得到恰当的治疗和关怀。","page":52,"endPage":52,"category":"陪诊与导诊","sourceNote":""},{"id":"single-300","type":"single","number":300,"title":"如果患者在就诊过程中出现紧急情况，陪诊人员应该","options":[{"key":"A","text":"保持冷静并寻求紧急医疗帮助"},{"key":"B","text":"立即离开医院"},{"key":"C","text":"让患者自行处理"},{"key":"D","text":"等待医生来处理"}],"answer":["A"],"explanation":"陪诊人员应该保持冷静并寻求紧急医疗帮助，确保患者得到及时的救治。","page":52,"endPage":52,"category":"陪诊与导诊","sourceNote":""},{"id":"multiple-1","type":"multiple","number":1,"title":"职业道德的基本要素有哪些","options":[{"key":"A","text":"职业理想"},{"key":"B","text":"职业态度"},{"key":"C","text":"职业娱乐"},{"key":"D","text":"职业纪律"}],"answer":["A","B","D"],"explanation":"职业道德的基本要素包括职业理想、职业态度、职业义务、职业纪律、职业良心、职业荣誉和职业作风。","page":52,"endPage":52,"category":"职业道德","sourceNote":""},{"id":"multiple-2","type":"multiple","number":2,"title":"以下哪些是职业纪律的内容","options":[{"key":"A","text":"规章"},{"key":"B","text":"制度"},{"key":"C","text":"条例"},{"key":"D","text":"个人兴趣"}],"answer":["A","B","C"],"explanation":"职业纪律涉及从业者必须遵守的规章、制度和条例等。","page":52,"endPage":52,"category":"职业道德","sourceNote":""},{"id":"multiple-3","type":"multiple","number":3,"title":"职业良心的作用有哪些","options":[{"key":"A","text":"提升职业技能"},{"key":"B","text":"强化职业责任意识"},{"key":"C","text":"促进自我评价"},{"key":"D","text":"增加收入"}],"answer":["B","C"],"explanation":"职业良心有助于强化职业责任意识和促进自我评价。","page":52,"endPage":52,"category":"职业道德","sourceNote":""},{"id":"multiple-4","type":"multiple","number":4,"title":"职业作风可以表现为哪些特质","options":[{"key":"A","text":"尽职尽责"},{"key":"B","text":"诚实守信"},{"key":"C","text":"奋力拼搏"},{"key":"D","text":"消极怠工"}],"answer":["A","B","C"],"explanation":"职业作风可以表现为尽职尽责、诚实守信、奋力拼搏等积极特质。","page":52,"endPage":53,"category":"职业道德","sourceNote":""},{"id":"multiple-5","type":"multiple","number":5,"title":"康复治疗团队成员包括","options":[{"key":"A","text":"康复医师"},{"key":"B","text":"物理治疗师"},{"key":"C","text":"作业治疗师"},{"key":"D","text":"言语治疗师"}],"answer":["A","B","C","D"],"explanation":"康复治疗团队包括多专业成员，共同协作。","page":53,"endPage":53,"category":"康复与中医","sourceNote":""},{"id":"multiple-6","type":"multiple","number":6,"title":"中医康复“治未病”包括哪些内容","options":[{"key":"A","text":"未病先防"},{"key":"B","text":"既病防变"},{"key":"C","text":"瘥后防复"},{"key":"D","text":"病中治疗"}],"answer":["A","B","C"],"explanation":"“治未病”强调预防和防变，不包括病中治疗。","page":53,"endPage":53,"category":"康复与中医","sourceNote":""},{"id":"multiple-7","type":"multiple","number":7,"title":"康复治疗手段包括","options":[{"key":"A","text":"物理治疗"},{"key":"B","text":"作业治疗"},{"key":"C","text":"言语治疗"},{"key":"D","text":"心理治疗"}],"answer":["A","B","C","D"],"explanation":"康复治疗手段多样，涵盖多方面功能恢复。","page":53,"endPage":53,"category":"康复与中医","sourceNote":""},{"id":"multiple-8","type":"multiple","number":8,"title":"中医康复“整体观”包括哪些方面","options":[{"key":"A","text":"人与自然一体"},{"key":"B","text":"人与社会一体"},{"key":"C","text":"形神一体"},{"key":"D","text":"医患一体"}],"answer":["A","B","C"],"explanation":"整体观包括自然、社会、形神三个方面。","page":53,"endPage":53,"category":"康复与中医","sourceNote":""},{"id":"multiple-9","type":"multiple","number":9,"title":"下列哪些是康复工程的内容","options":[{"key":"A","text":"假肢制作"},{"key":"B","text":"矫形器设计"},{"key":"C","text":"无障碍改造"},{"key":"D","text":"心理评估"}],"answer":["A","B","C"],"explanation":"康复工程注重“工程”手段（如设计、制造、改造），而非心理或医学评估。","page":53,"endPage":53,"category":"康复与中医","sourceNote":""},{"id":"multiple-10","type":"multiple","number":10,"title":"以下哪些属于非处方药遴选的原则","options":[{"key":"A","text":"应用安全"},{"key":"B","text":"疗效确切"},{"key":"C","text":"质量稳定"},{"key":"D","text":"使用方便"}],"answer":["A","B","C","D"],"explanation":"非处方药遴选的原则包括应用安全、疗效确切、质量稳定和使用方便。","page":53,"endPage":54,"category":"药品与器械","sourceNote":""},{"id":"multiple-11","type":"multiple","number":11,"title":"多层次医疗保障体系包括哪些组成部分","options":[{"key":"A","text":"基本医疗保险"},{"key":"B","text":"补充医疗保险"},{"key":"C","text":"医疗救助"},{"key":"D","text":"商业健康保险"}],"answer":["A","B","C","D"],"explanation":"多层次医疗保障体系包括基本医疗保险、补充医疗保险、医疗救助、商业健康保险、慈善捐赠、医疗互助。","page":54,"endPage":54,"category":"医疗保障","sourceNote":""},{"id":"multiple-12","type":"multiple","number":12,"title":"定点医疗机构应当具备哪些条件","options":[{"key":"A","text":"正式运营至少3 个月"},{"key":"B","text":"至少有1 名取得医师执业证书的医师"},{"key":"C","text":"主要负责人负责医保工作"},{"key":"D","text":"具备符合医保协议管理要求的信息系统"}],"answer":["A","B","D"],"explanation":"定点医疗机构应当正式运营至少3 个月，至少有1 名取得医师执业证书、乡村医生执业证书或中医(专长)医师资格证书且第一注册地在该医疗机构的医师，并具有符合医保协议管理要求的信息系统。","page":54,"endPage":54,"category":"医疗保障","sourceNote":""},{"id":"multiple-13","type":"multiple","number":13,"title":"新生儿期预防保健包括哪些内容","options":[{"key":"A","text":"注意保暖"},{"key":"B","text":"母乳喂养为主"},{"key":"C","text":"按时接种疫苗"},{"key":"D","text":"预防感染"}],"answer":["A","B","C"],"explanation":"新生儿期预防保健主要包括注意保暖、母乳喂养为主、按时接种疫苗等内容。","page":54,"endPage":54,"category":"预防保健","sourceNote":""},{"id":"multiple-14","type":"multiple","number":14,"title":"青春期女性预防保健包括哪些内容","options":[{"key":"A","text":"培养良好的生活和卫生习惯"},{"key":"B","text":"合理营养"},{"key":"C","text":"心理卫生辅导"},{"key":"D","text":"经期卫生辅导"}],"answer":["A","B","C","D"],"explanation":"青春期女性预防保健包括培养良好的生活和卫生习惯、合理营养、心理卫生辅导、经期卫生辅导和性教育。","page":54,"endPage":54,"category":"预防保健","sourceNote":""},{"id":"multiple-15","type":"multiple","number":15,"title":"老年人预防保健包括哪些内容","options":[{"key":"A","text":"合理营养"},{"key":"B","text":"健康教育"},{"key":"C","text":"心理辅导"},{"key":"D","text":"体育锻炼"}],"answer":["A","B","C","D"],"explanation":"老年人预防保健包括合理营养、健康教育、心理辅导、体育锻炼和定期体检。","page":54,"endPage":54,"category":"预防保健","sourceNote":""},{"id":"multiple-16","type":"multiple","number":16,"title":"现场急救的原则包括哪些","options":[{"key":"A","text":"评估现场环境安全"},{"key":"B","text":"判断伤病情况"},{"key":"C","text":"启动急救反应系统"},{"key":"D","text":"立即进行手术"}],"answer":["A","B","C"],"explanation":"现场急救的原则包括评估现场环境安全、判断伤病情况、启动急救反应系统。","page":54,"endPage":55,"category":"现场急救","sourceNote":""},{"id":"multiple-17","type":"multiple","number":17,"title":"心肺复苏的基本步骤包括哪些","options":[{"key":"A","text":"判断意识"},{"key":"B","text":"呼叫急救"},{"key":"C","text":"胸外按压"},{"key":"D","text":"开放气道"}],"answer":["A","B","C","D"],"explanation":"心肺复苏的基本步骤包括判断意识、呼叫急救、胸外按压、开放气道、人工呼吸和除颤。","page":55,"endPage":55,"category":"现场急救","sourceNote":""},{"id":"multiple-18","type":"multiple","number":18,"title":"呼吸道异物阻塞的急救措施有哪些","options":[{"key":"A","text":"上腹部冲击法"},{"key":"B","text":"胸部冲击法"},{"key":"C","text":"拍背法"},{"key":"D","text":"立即进行心肺复苏"}],"answer":["A","B","C"],"explanation":"呼吸道异物阻塞的急救措施包括上腹部冲击法、胸部冲击法和拍背法。","page":55,"endPage":55,"category":"现场急救","sourceNote":""},{"id":"multiple-19","type":"multiple","number":19,"title":"提升健康素养的意义有哪些","options":[{"key":"A","text":"有效减少健康不公平"},{"key":"B","text":"显著降低社会成本"},{"key":"C","text":"改变慢性病患者的健康结局"},{"key":"D","text":"促进人民群众健康生活方式的形成"}],"answer":["A","B","C","D"],"explanation":"提升健康素养可以有效减少健康不公平，显著降低社会成本，改变慢性病患者的健康结局，并促进健康生活方式的形成，因此所有选项都是正确的。","page":55,"endPage":55,"category":"健康素养","sourceNote":""},{"id":"multiple-20","type":"multiple","number":20,"title":"健康生活方式包括哪些方面","options":[{"key":"A","text":"合理膳食"},{"key":"B","text":"适量运动"},{"key":"C","text":"戒烟限酒"},{"key":"D","text":"心理平衡"}],"answer":["A","B","C","D"],"explanation":"健康生活方式主要包括合理膳食、适量运动、戒烟限酒和心理平衡四个方面。","page":55,"endPage":55,"category":"健康素养","sourceNote":""},{"id":"multiple-21","type":"multiple","number":21,"title":"公民的健康权益包括哪些","options":[{"key":"A","text":"公共卫生服务权"},{"key":"B","text":"医疗服务权"},{"key":"C","text":"健康促进服务权"},{"key":"D","text":"健康社会保障权"}],"answer":["A","B","C","D"],"explanation":"公民健康权益包括公共卫生服务权、医疗服务权、健康促进服务权、健康社会保障权和救济权五项具体权利。","page":55,"endPage":55,"category":"健康素养","sourceNote":""},{"id":"multiple-22","type":"multiple","number":22,"title":"细胞的主要组成部分有哪些","options":[{"key":"A","text":"细胞膜"},{"key":"B","text":"细胞质"},{"key":"C","text":"细胞核"},{"key":"D","text":"细胞壁"}],"answer":["A","B","C"],"explanation":"细胞的主要组成部分包括细胞膜、细胞质和细胞核，而细胞壁主要存在于植物细胞中，不属于人体细胞的组成部分。","page":55,"endPage":56,"category":"医学基础","sourceNote":""},{"id":"multiple-23","type":"multiple","number":23,"title":"下列哪些组织属于人体的四大类组织","options":[{"key":"A","text":"神经组织"},{"key":"B","text":"肌肉组织"},{"key":"C","text":"上皮组织"},{"key":"D","text":"结缔组织"}],"answer":["A","B","C","D"],"explanation":"人体的四大类组织包括神经组织、肌肉组织、上皮组织和结缔组织，因此所有选项都是正确的。","page":56,"endPage":56,"category":"医学基础","sourceNote":""},{"id":"multiple-24","type":"multiple","number":24,"title":"下列哪些系统属于人体的九大系统","options":[{"key":"A","text":"神经系统"},{"key":"B","text":"运动系统"},{"key":"C","text":"内分泌系统"},{"key":"D","text":"循环系统"}],"answer":["A","B","C","D"],"explanation":"人体的九大系统包括神经系统、运动系统、内分泌系统、循环系统等，因此所有选项都是正确的。","page":56,"endPage":56,"category":"医学基础","sourceNote":""},{"id":"multiple-25","type":"multiple","number":25,"title":"下列哪些是药物的分类依据","options":[{"key":"A","text":"是否需要医生开具处方"},{"key":"B","text":"药物成分与制作工艺"},{"key":"C","text":"药物的颜色"},{"key":"D","text":"药物作用途径"}],"answer":["A","B","D"],"explanation":"药物的分类依据包括是否需要医生开具处方、药物成分与制作工艺、药物作用途径等，而药物的颜色不是分类依据，因此正确选项是A、B、D。","page":56,"endPage":56,"category":"医学基础","sourceNote":""},{"id":"multiple-26","type":"multiple","number":26,"title":"下列哪些是慢性病的主要特点","options":[{"key":"A","text":"病因复杂"},{"key":"B","text":"起病隐匿"},{"key":"C","text":"病程较长"},{"key":"D","text":"容易治愈"}],"answer":["A","B","C"],"explanation":"慢性病的主要特点包括病因复杂、起病隐匿、病程较长、难以治愈，因此容易治愈不符合慢性病的特点，正确选项是A、B、C。","page":56,"endPage":56,"category":"医学基础","sourceNote":""},{"id":"multiple-27","type":"multiple","number":27,"title":"下列哪些是高血压的危险因素","options":[{"key":"A","text":"超重或肥胖"},{"key":"B","text":"高盐饮食"},{"key":"C","text":"长期过量饮酒"},{"key":"D","text":"规律运动"}],"answer":["A","B","C"],"explanation":"高血压的危险因素包括超重或肥胖、高盐饮食、长期过量饮酒等，而规律运动有助于预防高血压，因此正确选项是A、B、C。","page":56,"endPage":57,"category":"医学基础","sourceNote":""},{"id":"multiple-28","type":"multiple","number":28,"title":"下列哪些是糖尿病的分类","options":[{"key":"A","text":"1 型糖尿病"},{"key":"B","text":"2 型糖尿病"},{"key":"C","text":"妊娠期糖尿病"},{"key":"D","text":"急性糖尿病"}],"answer":["A","B","C"],"explanation":"糖尿病的分类包括1 型糖尿病、2 型糖尿病、妊娠期糖尿病和其他特殊类型糖尿病，而急性糖尿病并不是标准分类，因此正确选项是A、B、C。","page":57,"endPage":57,"category":"医学基础","sourceNote":""},{"id":"multiple-29","type":"multiple","number":29,"title":"下列哪些是流行病学的特征","options":[{"key":"A","text":"群体特征"},{"key":"B","text":"对比的特征"},{"key":"C","text":"概率论与数理统计学的特征"},{"key":"D","text":"个体特征"}],"answer":["A","B","C"],"explanation":"流行病学的特征包括群体特征、对比的特征、概率论与数理统计学的特征等，而个体特征不是流行病学的主要特征，因此正确选项是A、B、C。","page":57,"endPage":57,"category":"医学基础","sourceNote":""},{"id":"multiple-30","type":"multiple","number":30,"title":"在选择医疗陪诊服务时，以下哪些因素是重要的","options":[{"key":"A","text":"陪诊人员的专业资质"},{"key":"B","text":"陪诊人员的工作经验"},{"key":"C","text":"陪诊人员的性别"},{"key":"D","text":"陪诊人员的个人卫生情况"}],"answer":["A","B","D"],"explanation":"选择医疗陪诊服务时，专业资质和工作经验是重要的考量因素，因为这关系到陪诊人员能否提供专业和有效的帮助。个人卫生情况也非常重要，因为这直接关系到患者健康。陪诊人员的性别通常不是决定性因素，除非患者有特别的性别偏好或需求。","page":57,"endPage":57,"category":"陪诊与导诊","sourceNote":""},{"id":"multiple-31","type":"multiple","number":31,"title":"医疗陪诊服务可能包括哪些内容","options":[{"key":"A","text":"协助患者完成挂号、缴费等行政手续"},{"key":"B","text":"在检查或治疗过程中提供心理支持"},{"key":"C","text":"帮助患者记录医生的诊断和医嘱"},{"key":"D","text":"代替患者家属签署所有医疗文件"}],"answer":["A","B","C"],"explanation":"医疗陪诊服务通常包括协助患者完成医院的行政手续、在检查或治疗过程中提供心理支持以及帮助患者记录医生的诊断和医嘱。陪诊人员不能代替患者家属签署所有医疗文件，因为某些文件需要患者或其法定代理人签字。","page":57,"endPage":57,"category":"陪诊与导诊","sourceNote":""},{"id":"multiple-32","type":"multiple","number":32,"title":"以下哪些情况下，患者可能需要特别关注医疗陪诊人员的选择","options":[{"key":"A","text":"患者有特殊疾病需要专业陪诊"},{"key":"B","text":"患者有语言沟通障碍"},{"key":"C","text":"患者对医疗服务有特殊要求"},{"key":"D","text":"患者只是进行常规体检"}],"answer":["A","B","C"],"explanation":"当患者有特殊疾病、语言沟通障碍或对医疗服务有特殊要求时，需要特别关注医疗陪诊人员的选择，以确保他们能够提供相应的专业支持和帮助。常规体检的患者通常不需要特别关注陪诊人员的选择。","page":57,"endPage":58,"category":"陪诊与导诊","sourceNote":""},{"id":"multiple-33","type":"multiple","number":33,"title":"医疗陪诊人员在陪同患者就医时，应该注意哪些事项","options":[{"key":"A","text":"保持与患者的沟通，了解患者的需求和感受"},{"key":"B","text":"确保患者理解医生的诊断和治疗方案"},{"key":"C","text":"代替患者做出医疗决策"},{"key":"D","text":"协助患者记录重要的医疗信息"}],"answer":["A","B","D"],"explanation":"医疗陪诊人员在陪同患者就医时，应该保持与患者的沟通，确保患者理","page":58,"endPage":58,"category":"陪诊与导诊","sourceNote":"原 PDF 的解析在“确保患者理”处结束，原文不完整。"},{"id":"multiple-34","type":"multiple","number":34,"title":"导诊服务的目的是什么","options":[{"key":"A","text":"提高患者就医效率"},{"key":"B","text":"提升医院形象"},{"key":"C","text":"增加医生工作量"},{"key":"D","text":"提高患者满意度"}],"answer":["A","B","D"],"explanation":"导诊服务的目的是提高患者就医效率、提升医院形象及提高患者满意度，增加医生工作量不属于导诊服务范畴内。","page":58,"endPage":58,"category":"陪诊与导诊","sourceNote":""},{"id":"multiple-35","type":"multiple","number":35,"title":"康复医学的基本原则包括","options":[{"key":"A","text":"功能训练"},{"key":"B","text":"早期同步"},{"key":"C","text":"主动参与"},{"key":"D","text":"全面康复"}],"answer":["A","B","C","D"],"explanation":"康复医学的基本原则包括功能训练、早期同步、主动参与、全面康复、团结协作、回归社会。","page":58,"endPage":58,"category":"康复与中医","sourceNote":""},{"id":"multiple-36","type":"multiple","number":36,"title":"中医康复学的核心思想包括","options":[{"key":"A","text":"整体观"},{"key":"B","text":"辨证观"},{"key":"C","text":"功能观"},{"key":"D","text":"正气观"}],"answer":["A","B","C","D"],"explanation":"中医康复学的核心思想包括整体观、辨证观、功能观、正气观、治未病观等。","page":58,"endPage":58,"category":"康复与中医","sourceNote":""},{"id":"multiple-37","type":"multiple","number":37,"title":"康复评定包括哪些阶段","options":[{"key":"A","text":"初期评定"},{"key":"B","text":"中期评定"},{"key":"C","text":"末期评定"},{"key":"D","text":"随机评定"}],"answer":["A","B","C"],"explanation":"康复评定应贯穿治疗全过程，包括初、中、末期评定。","page":58,"endPage":58,"category":"康复与中医","sourceNote":""},{"id":"multiple-38","type":"multiple","number":38,"title":"下列哪些属于中医康复常用方法","options":[{"key":"A","text":"针灸"},{"key":"B","text":"推拿"},{"key":"C","text":"中药"},{"key":"D","text":"气功"}],"answer":["A","B","C","D"],"explanation":"中医康复常用方法包括针灸、推拿、中药、气功、食疗、情志调摄等，这些方法通过调节气血、平衡阴阳、疏通经络达到康复目的。","page":58,"endPage":59,"category":"康复与中医","sourceNote":""},{"id":"multiple-39","type":"multiple","number":39,"title":"残疾分类包括哪些层面","options":[{"key":"A","text":"残损"},{"key":"B","text":"残疾"},{"key":"C","text":"残障"},{"key":"D","text":"残废"}],"answer":["A","B","C"],"explanation":"残疾分类包括残损（器官层面）、残疾（个体层面）、残障（社会层面）。","page":59,"endPage":59,"category":"康复与中医","sourceNote":""},{"id":"multiple-40","type":"multiple","number":40,"title":"中医康复处方制定原则包括","options":[{"key":"A","text":"因病选药"},{"key":"B","text":"因证配伍"},{"key":"C","text":"因症用药"},{"key":"D","text":"因年龄用药"}],"answer":["A","B","C"],"explanation":"中医处方强调病、证、症结合，年龄和性别不是核心依据。","page":59,"endPage":59,"category":"康复与中医","sourceNote":""},{"id":"multiple-41","type":"multiple","number":41,"title":"康复评定的内容包括","options":[{"key":"A","text":"运动功能"},{"key":"B","text":"心理功能"},{"key":"C","text":"社会功能"},{"key":"D","text":"血常规"}],"answer":["A","B","C"],"explanation":"血常规和尿常规属于临床检验，不属于康复评定。","page":59,"endPage":59,"category":"康复与中医","sourceNote":""},{"id":"multiple-42","type":"multiple","number":42,"title":"中医康复“杂合以治”包括哪些结合","options":[{"key":"A","text":"标本结合"},{"key":"B","text":"内外结合"},{"key":"C","text":"医疗与自疗结合"},{"key":"D","text":"治疗与调养结合"}],"answer":["A","B","C","D"],"explanation":"“杂合以治”强调多种方法的综合应用。","page":59,"endPage":59,"category":"康复与中医","sourceNote":""},{"id":"multiple-43","type":"multiple","number":43,"title":"下列哪些属于“残障”的表现","options":[{"key":"A","text":"社会交往障碍"},{"key":"B","text":"工作能力丧失"},{"key":"C","text":"学习能力受限"},{"key":"D","text":"关节活动受限"}],"answer":["A","B","C"],"explanation":"关节活动受限和肌肉萎缩属于残损层面。","page":59,"endPage":59,"category":"康复与中医","sourceNote":""},{"id":"multiple-44","type":"multiple","number":44,"title":"康复医学的服务对象包括","options":[{"key":"A","text":"残疾人"},{"key":"B","text":"老年人"},{"key":"C","text":"慢性病患者"},{"key":"D","text":"急性传染病患者"}],"answer":["A","B","C"],"explanation":"康复医学主要服务于残疾人、老年人和慢性病患者等功能障碍者。","page":59,"endPage":59,"category":"康复与中医","sourceNote":""},{"id":"multiple-45","type":"multiple","number":45,"title":"以下哪些症状可能是食物中毒的表现","options":[{"key":"A","text":"恶心和呕吐"},{"key":"B","text":"腹泻"},{"key":"C","text":"发热"},{"key":"D","text":"头痛"}],"answer":["A","B","C","D"],"explanation":"恶心和呕吐、腹泻、发热和头痛都可能是食物中毒的表现。食物中毒是由于摄入了被细菌、病毒或毒素污染的食物而引起的。","page":59,"endPage":60,"category":"医学基础","sourceNote":""},{"id":"multiple-46","type":"multiple","number":46,"title":"以下哪些症状可能是甲状腺功能亢进的表现","options":[{"key":"A","text":"心悸"},{"key":"B","text":"体重减轻"},{"key":"C","text":"持续的疲劳感"},{"key":"D","text":"感到寒冷"}],"answer":["A","B","C"],"explanation":"心悸、体重减轻和持续的疲劳感可能是甲状腺功能亢进的表现。甲状腺功能亢进会导致新陈代谢加快，而感到寒冷通常与甲状腺功能减退有关。","page":60,"endPage":60,"category":"医学基础","sourceNote":""},{"id":"multiple-47","type":"multiple","number":47,"title":"以下哪些症状可能是焦虑症的表现","options":[{"key":"A","text":"持续的担忧和紧张"},{"key":"B","text":"睡眠困难"},{"key":"C","text":"心跳加速"},{"key":"D","text":"感到寒冷"}],"answer":["A","B","C"],"explanation":"持续的担忧和紧张、睡眠困难和心跳加速可能是焦虑症的表现。感到寒冷通常与体温调节有关，而不是焦虑症的直接症状。","page":60,"endPage":60,"category":"心理健康","sourceNote":""},{"id":"multiple-48","type":"multiple","number":48,"title":"以下哪些症状可能是肾结石的表现","options":[{"key":"A","text":"腰部或腹部剧烈疼痛"},{"key":"B","text":"血尿"},{"key":"C","text":"恶心和呕吐"},{"key":"D","text":"发热和寒战"}],"answer":["A","B","C"],"explanation":"腰部或腹部剧烈疼痛、血尿和恶心和呕吐可能是肾结石的表现。发热和寒战通常与感染有关，可能是肾结石并发症的表现，如肾盂肾炎。","page":60,"endPage":60,"category":"医学基础","sourceNote":""},{"id":"multiple-49","type":"multiple","number":49,"title":"以下哪些症状可能是肺炎的表现","options":[{"key":"A","text":"咳嗽"},{"key":"B","text":"呼吸困难"},{"key":"C","text":"发热和寒战"},{"key":"D","text":"头痛"}],"answer":["A","B","C"],"explanation":"咳嗽、呼吸困难和发热和寒战可能是肺炎的表现。肺炎是一种肺部感染，通常由细菌、病毒或真菌引起。头痛可能是肺炎的症状之一，但也可能是其他健康问题的迹象。","page":60,"endPage":60,"category":"医学基础","sourceNote":""},{"id":"multiple-50","type":"multiple","number":50,"title":"以下哪些症状可能是糖尿病并发症的表现","options":[{"key":"A","text":"视力模糊"},{"key":"B","text":"慢性伤口愈合不良"},{"key":"C","text":"多饮多尿"},{"key":"D","text":"头痛"}],"answer":["A","B","C"],"explanation":"视力模糊、慢性伤口愈合不良和多饮多尿可能是糖尿病并发症的表现。糖尿病可以导致多种并发症，包括视网膜病变、神经损伤和肾脏问题。头痛可能是糖尿病的迹象之一，但也可能是其他健康问题的迹象。","page":60,"endPage":61,"category":"医学基础","sourceNote":""},{"id":"multiple-51","type":"multiple","number":51,"title":"以下哪些症状可能是慢性阻塞性肺疾病（COPD）的表现","options":[{"key":"A","text":"呼吸困难"},{"key":"B","text":"持续的咳嗽"},{"key":"C","text":"胸闷"},{"key":"D","text":"头痛"}],"answer":["A","B","C"],"explanation":"呼吸困难、持续的咳嗽和胸闷可能是慢性阻塞性肺疾病（COPD）的表现。COPD 是一种慢性炎症性肺病，通常与长期吸烟有关。头痛可能是COPD 的迹象之一，但也可能是其他健康问题的迹象。","page":61,"endPage":61,"category":"医学基础","sourceNote":""},{"id":"multiple-52","type":"multiple","number":52,"title":"以下哪些症状可能是胃溃疡的表现","options":[{"key":"A","text":"上腹痛"},{"key":"B","text":"食欲减退"},{"key":"C","text":"恶心和呕吐"},{"key":"D","text":"头痛"}],"answer":["A","B","C"],"explanation":"上腹痛、食欲减退和恶心和呕吐可能是胃溃疡的表现。胃溃疡是胃黏膜的缺损，通常与幽门螺杆菌感染或长期使用非甾体抗炎药有关。头痛可能是胃溃疡的迹象之一，但也可能是其他健康问题的迹象。","page":61,"endPage":61,"category":"医学基础","sourceNote":""},{"id":"multiple-53","type":"multiple","number":53,"title":"以下哪些症状可能是乳腺癌的表现","options":[{"key":"A","text":"乳房肿块"},{"key":"B","text":"乳房皮肤改变"},{"key":"C","text":"乳头凹陷"},{"key":"D","text":"持续的背痛"}],"answer":["A","B","C"],"explanation":"乳房肿块、乳房皮肤改变和乳头凹陷可能是乳腺癌的表现。乳腺癌是女性中最常见的癌症之一，早期发现和治疗对预后至关重要。持续的背痛通常与乳腺癌的转移有关，但不是早期表现。","page":61,"endPage":61,"category":"医学基础","sourceNote":""},{"id":"multiple-54","type":"multiple","number":54,"title":"以下哪些症状可能是抑郁症的迹象","options":[{"key":"A","text":"持续的悲伤情绪"},{"key":"B","text":"对日常活动失去兴趣"},{"key":"C","text":"睡眠过多或失眠"},{"key":"D","text":"持续的背痛"}],"answer":["A","B","C"],"explanation":"持续的悲伤情绪、对日常活动失去兴趣和睡眠过多或失眠都是抑郁症的可能症状。持续的背痛可能是抑郁症的迹象之一，但也可能是其他健康问题的迹象。","page":61,"endPage":61,"category":"心理健康","sourceNote":""},{"id":"multiple-55","type":"multiple","number":55,"title":"在选择医疗陪诊服务时，以下哪些信息是患者或家属应该了解的","options":[{"key":"A","text":"陪诊服务的费用结构"},{"key":"B","text":"陪诊人员的工作时间"},{"key":"C","text":"陪诊人员的教育背景"},{"key":"D","text":"陪诊人员的个人兴趣爱好"}],"answer":["A","B","C"],"explanation":"在选择医疗陪诊服务时，患者或家属应该了","page":61,"endPage":62,"category":"陪诊与导诊","sourceNote":"原 PDF 的解析在“应该了”处结束，原文不完整。"},{"id":"multiple-56","type":"multiple","number":56,"title":"以下哪些属于导诊服务的范围","options":[{"key":"A","text":"根据患者症状，建议就诊科室"},{"key":"B","text":"诊前病历资料的准备"},{"key":"C","text":"协助患者挂号"},{"key":"D","text":"代替医生进行诊断"}],"answer":["A","B","C"],"explanation":"导诊服务的范围包括根据患者症状建议就诊科室、诊前病历资料的准备、协助患者挂号等，代替医生进行诊断不属于导诊服务范围。","page":62,"endPage":62,"category":"陪诊与导诊","sourceNote":""},{"id":"multiple-57","type":"multiple","number":57,"title":"健康访视的主要目的是什么","options":[{"key":"A","text":"了解患者病情"},{"key":"B","text":"提供健康指导"},{"key":"C","text":"推销医疗产品"},{"key":"D","text":"增进医患关系"}],"answer":["A","B","D"],"explanation":"健康访视的主要目的是了","page":62,"endPage":62,"category":"咨询与访视","sourceNote":"原 PDF 的解析在“目的是了”处结束，原文不完整。"},{"id":"multiple-58","type":"multiple","number":58,"title":"在进行健康访视时，以下哪些行为是合适的","options":[{"key":"A","text":"提前与患者预约访视时间"},{"key":"B","text":"未经允许进入患者家中"},{"key":"C","text":"尊重患者隐私"},{"key":"D","text":"向患者推销个人产品"}],"answer":["A","C"],"explanation":"在进行健康访视时，需提前与患者预约访视时间，尊重患者隐私。","page":62,"endPage":62,"category":"咨询与访视","sourceNote":""},{"id":"multiple-59","type":"multiple","number":59,"title":"导诊员在工作中应具备哪些素质","options":[{"key":"A","text":"良好的沟通能力"},{"key":"B","text":"专业的医学知识"},{"key":"C","text":"热情的服务态度"},{"key":"D","text":"冷静应对紧急情况的能力"}],"answer":["A","C","D"],"explanation":"导诊员在工作中，需具备良好的沟通能力、热情的服务态度及冷静应对紧急情况的能力。","page":62,"endPage":62,"category":"陪诊与导诊","sourceNote":""},{"id":"multiple-60","type":"multiple","number":60,"title":"以下哪些属于导诊服务的禁忌行为","options":[{"key":"A","text":"对患者冷漠无情"},{"key":"B","text":"随意泄露患者隐私"},{"key":"C","text":"私自接受患者红包"},{"key":"D","text":"与患者发生争执"}],"answer":["A","B","C","D"],"explanation":"导诊服务过程中，不可随意泄露患者隐私，私自接受患者红包，禁止与患者发生争执或漠视患者需求。","page":62,"endPage":62,"category":"陪诊与导诊","sourceNote":""},{"id":"multiple-61","type":"multiple","number":61,"title":"健康访视中，如何确保患者的隐私安全","options":[{"key":"A","text":"遵守医院隐私保护政策"},{"key":"B","text":"在公共场合大声讨论患者病情"},{"key":"C","text":"确保访视环境私密"},{"key":"D","text":"随意透露患者个人信息"}],"answer":["A","C"],"explanation":"在健康访视中，需确保访视环境私密，遵守医院隐私保护政策。","page":62,"endPage":63,"category":"咨询与访视","sourceNote":""},{"id":"multiple-62","type":"multiple","number":62,"title":"导诊员在引导患者时应注意哪些事项","options":[{"key":"A","text":"熟悉医院科室布局"},{"key":"B","text":"快速安排患者就医流程"},{"key":"C","text":"确保患者安全"},{"key":"D","text":"忽视患者需求"}],"answer":["A","B","C"],"explanation":"导诊员在引导患者时，要确保患者安全，快速安排患者就医流程，熟悉医院科室布局。","page":63,"endPage":63,"category":"陪诊与导诊","sourceNote":""},{"id":"multiple-63","type":"multiple","number":63,"title":"健康访视的频率应该如何确定","options":[{"key":"A","text":"根据患者病情需要"},{"key":"B","text":"固定每周一次"},{"key":"C","text":"遵循医院规定"},{"key":"D","text":"随意安排时间"}],"answer":["A","C"],"explanation":"健康访视的频率需遵循医院规定，根据患者病情需要进行安排。","page":63,"endPage":63,"category":"咨询与访视","sourceNote":""},{"id":"multiple-64","type":"multiple","number":64,"title":"以下哪些情况下，导诊员需要向医生报告","options":[{"key":"A","text":"患者病情严重"},{"key":"B","text":"患者要求加号"},{"key":"C","text":"患者情绪激动"},{"key":"D","text":"患者对服务满意"}],"answer":["A","B","C"],"explanation":"当患者病情严重且情绪激动时，需要向医生报告，或者患者有加号需求时也需要向医生报告。","page":63,"endPage":63,"category":"陪诊与导诊","sourceNote":""},{"id":"multiple-65","type":"multiple","number":65,"title":"在健康访视中，哪些信息是需要特别关注的","options":[{"key":"A","text":"患者病情变化"},{"key":"B","text":"患者心理状态"},{"key":"C","text":"患者家庭状况"},{"key":"D","text":"患者饮食习惯"}],"answer":["A","B"],"explanation":"当进行健康访视时，需要特别关注患者的病情变化、心理状态。","page":63,"endPage":63,"category":"咨询与访视","sourceNote":""},{"id":"multiple-66","type":"multiple","number":66,"title":"导诊员在提供服务时，如何确保服务质量","options":[{"key":"A","text":"定期接受培训"},{"key":"B","text":"遵循服务流程"},{"key":"C","text":"随意更改服务内容"},{"key":"D","text":"关注患者反馈"}],"answer":["A","B","D"],"explanation":"导诊员需要定期接受培训、遵循服务流程，并时刻关注患者反馈。","page":63,"endPage":63,"category":"陪诊与导诊","sourceNote":""},{"id":"multiple-67","type":"multiple","number":67,"title":"健康访视中可以提供哪些帮助","options":[{"key":"A","text":"提供健康教育资料"},{"key":"B","text":"为患者预约检查"},{"key":"C","text":"为患者购买药品"},{"key":"D","text":"提供心理支持"}],"answer":["A","B","D"],"explanation":"在健康访视中，可以为患者提供相关的健康教育资料、心理支持及提前预约检查时间等。","page":63,"endPage":64,"category":"咨询与访视","sourceNote":""},{"id":"multiple-68","type":"multiple","number":68,"title":"导诊员在工作中应如何维护自己的职业形象","options":[{"key":"A","text":"穿着整洁"},{"key":"B","text":"态度热情"},{"key":"C","text":"语言文明"},{"key":"D","text":"随意散漫"}],"answer":["A","B","C"],"explanation":"导诊员在工作中需要保持穿着整洁、语言文明、态度热情。","page":64,"endPage":64,"category":"陪诊与导诊","sourceNote":""},{"id":"multiple-69","type":"multiple","number":69,"title":"下列哪些是宏量营养素","options":[{"key":"A","text":"碳水化合物"},{"key":"B","text":"蛋白质"},{"key":"C","text":"脂肪"},{"key":"D","text":"维生素"}],"answer":["A","B","C"],"explanation":"宏量营养素包括碳水化合物、蛋白质和脂肪，它们是人体所需能量的主要来源。","page":64,"endPage":64,"category":"营养与食品","sourceNote":""},{"id":"multiple-70","type":"multiple","number":70,"title":"下列哪些食物富含钙","options":[{"key":"A","text":"奶类及奶制品"},{"key":"B","text":"豆类及豆制品"},{"key":"C","text":"鱼虾"},{"key":"D","text":"干果"},{"key":"E","text":"绿叶蔬菜"}],"answer":["A","B","C","E"],"explanation":"奶类及奶制品、豆类及豆制品、鱼虾和绿叶蔬菜都是钙的良好来源，尤其是奶类和绿叶蔬菜。","page":64,"endPage":64,"category":"营养与食品","sourceNote":""},{"id":"boolean-1","type":"boolean","number":1,"title":"道德是依靠专门的机构来制定和强制执行的","options":[{"key":"T","text":"正确"},{"key":"F","text":"错误"}],"answer":["F"],"explanation":"道德不是由专门的机构来制定和强制执行的，而是依赖于社会舆论和个人内心信念","page":64,"endPage":64,"category":"职业道德","sourceNote":""},{"id":"boolean-2","type":"boolean","number":2,"title":"职业道德仅限于调节从业人员与服务对象之间的关系","options":[{"key":"T","text":"正确"},{"key":"F","text":"错误"}],"answer":["F"],"explanation":"职业道德可以调节从业人员与服务对象、从业人员之间以及从业人员与职业之间的关系","page":64,"endPage":64,"category":"职业道德","sourceNote":""},{"id":"boolean-3","type":"boolean","number":3,"title":"职业理想是从业者实现职业目标的精神动力","options":[{"key":"T","text":"正确"},{"key":"F","text":"错误"}],"answer":["T"],"explanation":"职业理想确实是对职业活动目标的追求和向往，是实现职业目标的精神动力","page":64,"endPage":64,"category":"职业道德","sourceNote":""},{"id":"boolean-4","type":"boolean","number":4,"title":"“残障”是指器官或系统功能异常","options":[{"key":"T","text":"正确"},{"key":"F","text":"错误"}],"answer":["F"],"explanation":"“残障”是社会层面的障碍，而非器官层面","page":64,"endPage":64,"category":"康复与中医","sourceNote":""},{"id":"boolean-5","type":"boolean","number":5,"title":"中医康复“治未病”包括病中治疗","options":[{"key":"T","text":"正确"},{"key":"F","text":"错误"}],"answer":["F"],"explanation":"“治未病”强调预防和防变，不包括病中治疗","page":64,"endPage":65,"category":"康复与中医","sourceNote":""},{"id":"boolean-6","type":"boolean","number":6,"title":"康复治疗团队以护士为核心","options":[{"key":"T","text":"正确"},{"key":"F","text":"错误"}],"answer":["F"],"explanation":"康复治疗团队以康复医师为核心","page":65,"endPage":65,"category":"康复与中医","sourceNote":""},{"id":"boolean-7","type":"boolean","number":7,"title":"非处方药可以由消费者自主选择，但必须按照标签和说明书所示内容合理使用","options":[{"key":"T","text":"正确"},{"key":"F","text":"错误"}],"answer":["T"],"explanation":"非处方药虽然可以由消费者自主选择，但仍需按标签和说明书所示内容合理使用","page":65,"endPage":65,"category":"药品与器械","sourceNote":""},{"id":"boolean-8","type":"boolean","number":8,"title":"“双跨”药品不能在大众媒体上发布广告","options":[{"key":"T","text":"正确"},{"key":"F","text":"错误"}],"answer":["F"],"explanation":"“双跨”药品作为“非处方药”时可以在大众媒体上进行广告宣传，但内容不得超出其非处方药适应证范围","page":65,"endPage":65,"category":"药品与器械","sourceNote":""},{"id":"boolean-9","type":"boolean","number":9,"title":"婴儿期预防保健中，婴儿需要大量的营养物质以满足其生长需要，但胃肠道功能还未完善，容易出现消化不良","options":[{"key":"T","text":"正确"},{"key":"F","text":"错误"}],"answer":["T"],"explanation":"婴儿期需要大量营养物质，但胃肠道功能未完善，容易出现消化不良","page":65,"endPage":65,"category":"预防保健","sourceNote":""},{"id":"boolean-10","type":"boolean","number":10,"title":"更年期女性应尽量减少性生活，以避免心理上的压力","options":[{"key":"T","text":"正确"},{"key":"F","text":"错误"}],"answer":["F"],"explanation":"更年期女性应合理进行性生活，指导其正视性生活问题，消除心理上的压力","page":65,"endPage":65,"category":"预防保健","sourceNote":""},{"id":"boolean-11","type":"boolean","number":11,"title":"在现场急救中，救护者应在确保自己及伤员安全的情况下，尽早开展科学规范的现场急救","options":[{"key":"T","text":"正确"},{"key":"F","text":"错误"}],"answer":["T"],"explanation":"现场急救的原则是救护者在评估现场环境，确保自己及伤员安全的情况下，尽早开展科学规范的现场急救","page":65,"endPage":65,"category":"现场急救","sourceNote":""},{"id":"boolean-12","type":"boolean","number":12,"title":"对于溺水者，如果在水中进行口对口人工呼吸，给予人工呼吸越早，溺水者生存的可能性越大","options":[{"key":"T","text":"正确"},{"key":"F","text":"错误"}],"answer":["T"],"explanation":"如果溺水者意识丧失，应及时给予人工呼吸，可以在水中进行口对口人工呼吸，给予人工呼吸越早，溺水者生存的可能性越大","page":65,"endPage":65,"category":"现场急救","sourceNote":""},{"id":"boolean-13","type":"boolean","number":13,"title":"每个人都有维护自身和他人健康的责任","options":[{"key":"T","text":"正确"},{"key":"F","text":"错误"}],"answer":["T"],"explanation":"每个人都应该承担起维护自身和他人健康的责任，因此该判断是正确的","page":65,"endPage":65,"category":"健康素养","sourceNote":""},{"id":"boolean-14","type":"boolean","number":14,"title":"保健食品可以替代药品来治疗疾病","options":[{"key":"T","text":"正确"},{"key":"F","text":"错误"}],"answer":["F"],"explanation":"保健食品不是药品，不能替代药品来治疗疾病，因此该判断是错误的","page":65,"endPage":65,"category":"健康素养","sourceNote":""},{"id":"boolean-15","type":"boolean","number":15,"title":"细胞是人体形态、结构、生理功能与生长发育的基本单位","options":[{"key":"T","text":"正确"},{"key":"F","text":"错误"}],"answer":["T"],"explanation":"细胞是人体形态、结构、生理功能与生长发育的基本单位，因此该判断是正确的","page":65,"endPage":65,"category":"医学基础","sourceNote":""},{"id":"boolean-16","type":"boolean","number":16,"title":"神经组织主要负责将外部的信息传递给大脑，并将大脑的命令传递给身体各个部位","options":[{"key":"T","text":"正确"},{"key":"F","text":"错误"}],"answer":["T"],"explanation":"神经组织负责将外部的信息传递给大脑，并将大脑的命令传递给身体各个部位，因此该判断是正确的","page":65,"endPage":65,"category":"医学基础","sourceNote":""},{"id":"boolean-17","type":"boolean","number":17,"title":"维生素C 可以促进铁的吸收","options":[{"key":"T","text":"正确"},{"key":"F","text":"错误"}],"answer":["T"],"explanation":"维生素C 能够将非血红素铁还原为更易吸收的形式，从而促进铁的吸收","page":65,"endPage":65,"category":"营养与食品","sourceNote":""},{"id":"boolean-18","type":"boolean","number":18,"title":"摄入过多的钠会导致血压升高","options":[{"key":"T","text":"正确"},{"key":"F","text":"错误"}],"answer":["T"],"explanation":"过量摄入钠会增加体内的水分潴留，导致血压升高，增加心血管疾病的风险","page":65,"endPage":66,"category":"营养与食品","sourceNote":""},{"id":"boolean-19","type":"boolean","number":19,"title":"膳食纤维摄入过多会降低某些营养素的吸收","options":[{"key":"T","text":"正确"},{"key":"F","text":"错误"}],"answer":["T"],"explanation":"过量摄入膳食纤维可能会减少某些矿物质（如锌、铜）的吸收，因此应适量摄入","page":66,"endPage":66,"category":"营养与食品","sourceNote":""},{"id":"boolean-20","type":"boolean","number":20,"title":"所有植物性食物都不含维生素B12","options":[{"key":"T","text":"正确"},{"key":"F","text":"错误"}],"answer":["F"],"explanation":"虽然大多数植物性食物不含维生素B12，但某些发酵食品（如发酵豆制品）和藻类中可能含有少量维生素B12","page":66,"endPage":66,"category":"营养与食品","sourceNote":""},{"id":"boolean-21","type":"boolean","number":21,"title":"鱼类中的脂肪主要是饱和脂肪酸","options":[{"key":"T","text":"正确"},{"key":"F","text":"错误"}],"answer":["F"],"explanation":"鱼类中的脂肪主要是不饱和脂肪酸，尤其是多不饱和脂肪酸，有助于心血管健康","page":66,"endPage":66,"category":"营养与食品","sourceNote":""},{"id":"boolean-22","type":"boolean","number":22,"title":"劳动法的主要作用是保护劳动者合法权益，因此在任何情况下都优先保护劳动者的权益，而不会考虑用人单位的利益","options":[{"key":"T","text":"正确"},{"key":"F","text":"错误"}],"answer":["F"],"explanation":"虽然劳动法侧重于保护劳动者的权益，但这并不意味着完全忽视用人单位的利益劳动法的制定是为了建立稳定和谐的劳动关系，为了保护用人单位的利益，也规定了劳动者的许多义务；资本者或经营者的利益可以通过其他的法律得到保护","page":66,"endPage":66,"category":"劳动法律","sourceNote":""},{"id":"boolean-23","type":"boolean","number":23,"title":"劳动合同可以仅通过口头形式订立，无需书面形式","options":[{"key":"T","text":"正确"},{"key":"F","text":"错误"}],"answer":["F"],"explanation":"劳动合同应以书面形式订立，并必须具备一定的条款，如劳动合同期限、工作内容等口头形式不能提供足够的证据来保障双方的权利和义务，因此不是合法的形式","page":66,"endPage":66,"category":"劳动法律","sourceNote":""},{"id":"boolean-24","type":"boolean","number":24,"title":"劳动者在法定休假日工作的，用人单位应当支付不低于工资的百分之三百的工资报酬","options":[{"key":"T","text":"正确"},{"key":"F","text":"错误"}],"answer":["T"],"explanation":"法定休假日安排劳动者工作的，确实需要支付不低于工资的百分之三百的工资报酬这是对劳动者在特殊时期工作的补偿，也是劳动法规定的非正常工作时间工资报酬的特殊规定之一","page":66,"endPage":66,"category":"劳动法律","sourceNote":""},{"id":"boolean-25","type":"boolean","number":25,"title":"健康档案中的健康基本信息对伤病诊疗和疾病预防具有重要意义","options":[{"key":"T","text":"正确"},{"key":"F","text":"错误"}],"answer":["T"],"explanation":"健康档案中的健康基本信息（如血型、药物过敏史、既往史、家族史、生活环境信息等）对伤病诊疗和疾病预防具有重要意义，能够为医生提供重要的参考依据","page":66,"endPage":66,"category":"健康档案","sourceNote":""},{"id":"boolean-26","type":"boolean","number":26,"title":"健康档案使用时可以随意借出档案，无需履行任何手续","options":[{"key":"T","text":"正确"},{"key":"F","text":"错误"}],"answer":["F"],"explanation":"健康档案使用时必须经过授权管理人员同意，填写调取单/相关登记手续，并检查档案的完整性，不能随意借出档案","page":66,"endPage":66,"category":"健康档案","sourceNote":""},{"id":"boolean-27","type":"boolean","number":27,"title":"健康档案维护的私密性要求尊重个人隐私权，严格执行管理制度","options":[{"key":"T","text":"正确"},{"key":"F","text":"错误"}],"answer":["T"],"explanation":"健康档案维护的私密性要求尊重个人隐私权，严格执行管理制度，确保档案信息的安全和保密","page":66,"endPage":66,"category":"健康档案","sourceNote":""},{"id":"boolean-28","type":"boolean","number":28,"title":"吃得均衡是指每天摄入相同量的各种营养素","options":[{"key":"T","text":"正确"},{"key":"F","text":"错误"}],"answer":["F"],"explanation":"均衡饮食指的是饮食中所含的营养素种类齐全，比例适当，保持平衡","page":66,"endPage":66,"category":"营养与食品","sourceNote":""},{"id":"boolean-29","type":"boolean","number":29,"title":"神经性厌食症患者会通过节食等手段无意识造成并维持体重明显低于正常标准","options":[{"key":"T","text":"正确"},{"key":"F","text":"错误"}],"answer":["F"],"explanation":"神经性厌食是指有意节制饮食，导致体重明显低于正常标准的一种进食阻碍","page":66,"endPage":67,"category":"心理健康","sourceNote":""},{"id":"boolean-30","type":"boolean","number":30,"title":"抑郁症患者的心境低落总是与他们的处境相称","options":[{"key":"T","text":"正确"},{"key":"F","text":"错误"}],"answer":["F"],"explanation":"抑郁症患者的心境低落总是与他们的处境不相称","page":67,"endPage":67,"category":"心理健康","sourceNote":""},{"id":"boolean-31","type":"boolean","number":31,"title":"在中医养生中，“乐娱养生”意味着通过参与各种娱乐活动来保持身心健康","options":[{"key":"T","text":"正确"},{"key":"F","text":"错误"}],"answer":["T"],"explanation":"在中医养生中，“乐娱养生”意味着通过参与各种娱乐活动来保持身心健康","page":67,"endPage":67,"category":"康复与中医","sourceNote":""},{"id":"boolean-32","type":"boolean","number":32,"title":"牙龈肿痛时，应避免吃冷热刺激性食物，以减少对牙龈的刺激","options":[{"key":"T","text":"正确"},{"key":"F","text":"错误"}],"answer":["T"],"explanation":"牙龈肿痛时，应避免吃冷热刺激性食物，以减少对牙龈的刺激","page":67,"endPage":67,"category":"健康素养","sourceNote":""},{"id":"boolean-33","type":"boolean","number":33,"title":"健康咨询师在咨询过程中与来访者保持双重或多重关系是可以接受的，只要咨询师能够妥善管理这些关系","options":[{"key":"T","text":"正确"},{"key":"F","text":"错误"}],"answer":["F"],"explanation":"健康咨询师不可与来访者保持双重关系","page":67,"endPage":67,"category":"咨询与访视","sourceNote":""},{"id":"boolean-34","type":"boolean","number":34,"title":"在咨询过程中，如果咨询者表现出自残自杀倾向，咨询师应立即采取干预措施并报告，即使咨询者不同意报告","options":[{"key":"T","text":"正确"},{"key":"F","text":"错误"}],"answer":["T"],"explanation":"在咨询过程中，如果咨询者表现出自残自杀倾向，咨询师应立即采取干预措施并报告","page":67,"endPage":67,"category":"咨询与访视","sourceNote":""},{"id":"boolean-35","type":"boolean","number":35,"title":"健康咨询主要是为咨询者提供疾病的诊断和治疗","options":[{"key":"T","text":"正确"},{"key":"F","text":"错误"}],"answer":["F"],"explanation":"健康咨询内容包括身体的疾病和保养、心理健康问题、儿童问题、老年行为问题、家庭行为问题等","page":67,"endPage":67,"category":"咨询与访视","sourceNote":""},{"id":"boolean-36","type":"boolean","number":36,"title":"健康咨询服务提供者可以解读所有类型的医学检验报告，并提供相应的医疗建议","options":[{"key":"T","text":"正确"},{"key":"F","text":"错误"}],"answer":["F"],"explanation":"健康咨询的目的是引导患者正确就医，而不是确诊疾病或治疗","page":67,"endPage":67,"category":"咨询与访视","sourceNote":""},{"id":"boolean-37","type":"boolean","number":37,"title":"中医养生可以通过调整生活方式来达到预防疾病的目的","options":[{"key":"T","text":"正确"},{"key":"F","text":"错误"}],"answer":["F"],"explanation":"中医养生是指通过各种方法颐养生命、增强体质、预防疾病，从而达到延年益寿的一种医事活动","page":67,"endPage":67,"category":"康复与中医","sourceNote":"原答案为“错误”，但原解析包含“预防疾病”，与题干表述存在不一致。"},{"id":"boolean-38","type":"boolean","number":38,"title":"医疗陪诊服务仅限于老年人使用","options":[{"key":"T","text":"正确"},{"key":"F","text":"错误"}],"answer":["F"],"explanation":"医疗陪诊服务面向所有需要帮助的患者，包括老年人、行动不便者、语言沟通有障碍者等，并不仅限于老年人","page":67,"endPage":67,"category":"陪诊与导诊","sourceNote":""},{"id":"boolean-39","type":"boolean","number":39,"title":"陪诊人员可以代替医生进行诊断和治疗","options":[{"key":"T","text":"正确"},{"key":"F","text":"错误"}],"answer":["F"],"explanation":"陪诊人员的主要职责是协助患者在医院的就诊过程，如挂号、取药、陪同检查等，并不能代替医生进行诊断和治疗","page":67,"endPage":67,"category":"陪诊与导诊","sourceNote":""},{"id":"boolean-40","type":"boolean","number":40,"title":"陪诊人员需要具备一定的医疗知识","options":[{"key":"T","text":"正确"},{"key":"F","text":"错误"}],"answer":["T"],"explanation":"陪诊人员在协助患者过程中可能会遇到一些基本的医疗问题，因此需要具备一定的医疗知识以便更好地服务患者","page":67,"endPage":67,"category":"陪诊与导诊","sourceNote":""},{"id":"boolean-41","type":"boolean","number":41,"title":"医疗陪诊服务可以完全消除患者在医院就诊时的焦虑","options":[{"key":"T","text":"正确"},{"key":"F","text":"错误"}],"answer":["F"],"explanation":"虽然陪诊服务可以提供很多帮助，减轻患者的焦虑，但无法完全消除，因为焦虑可能来源于疾病本身、治疗结果等多方面因素","page":67,"endPage":68,"category":"陪诊与导诊","sourceNote":""},{"id":"boolean-42","type":"boolean","number":42,"title":"陪诊人员可以为患者提供法律咨询","options":[{"key":"T","text":"正确"},{"key":"F","text":"错误"}],"answer":["F"],"explanation":"陪诊人员的职责主要是医疗协助，不包括提供法律咨询患者如需法律咨询，应寻求专业法律人士的帮助","page":68,"endPage":68,"category":"咨询与访视","sourceNote":""},{"id":"boolean-43","type":"boolean","number":43,"title":"陪诊服务可以包括帮助患者理解医嘱和治疗方案","options":[{"key":"T","text":"正确"},{"key":"F","text":"错误"}],"answer":["T"],"explanation":"陪诊人员可以帮助患者理解医生的医嘱和治疗方案，确保患者能够正确执行医嘱，提高治疗效果。","page":68,"endPage":68,"category":"陪诊与导诊","sourceNote":""},{"id":"boolean-44","type":"boolean","number":44,"title":"医疗陪诊服务是所有医院的标配服务","options":[{"key":"T","text":"正确"},{"key":"F","text":"错误"}],"answer":["F"],"explanation":"医疗陪诊服务并非所有医院的标配，它可能由医院提供，也可能由第三方机构提供，或者由患者家属自行安排","page":68,"endPage":68,"category":"陪诊与导诊","sourceNote":""},{"id":"boolean-45","type":"boolean","number":45,"title":"陪诊人员可以为患者提供心理咨询","options":[{"key":"T","text":"正确"},{"key":"F","text":"错误"}],"answer":["F"],"explanation":"陪诊人员主要提供的是医疗协助服务，心理咨询通常需要专业的心理咨询师来进行","page":68,"endPage":68,"category":"咨询与访视","sourceNote":""},{"id":"boolean-46","type":"boolean","number":46,"title":"陪诊服务可以为患者提供家庭护理指导","options":[{"key":"T","text":"正确"},{"key":"F","text":"错误"}],"answer":["T"],"explanation":"陪诊人员在必要时可以为患者提供家庭护理的指导，帮助患者在家中更好地进行康复和护理","page":68,"endPage":68,"category":"陪诊与导诊","sourceNote":""},{"id":"boolean-47","type":"boolean","number":47,"title":"陪诊服务的费用通常由医疗保险全额覆盖","options":[{"key":"T","text":"正确"},{"key":"F","text":"错误"}],"answer":["F"],"explanation":"陪诊服务的费用是否由医疗保险覆盖取决于具体的保险政策，很多情况下，陪诊服务可能需要患者自费","page":68,"endPage":68,"category":"陪诊与导诊","sourceNote":""},{"id":"boolean-48","type":"boolean","number":48,"title":"陪诊人员可以协助患者进行医疗决策","options":[{"key":"T","text":"正确"},{"key":"F","text":"错误"}],"answer":["T"],"explanation":"陪诊人员可以帮助患者理解各种治疗方案的利弊，但最终的医疗决策应由患者本人或其法定代理人做出。","page":68,"endPage":68,"category":"陪诊与导诊","sourceNote":""},{"id":"boolean-49","type":"boolean","number":49,"title":"陪诊服务可以完全替代家属在医院的陪伴","options":[{"key":"T","text":"正确"},{"key":"F","text":"错误"}],"answer":["F"],"explanation":"陪诊服务虽然可以在一定程度上替代家属的陪伴，但家属的陪伴对于患者的情感支持是无法替代的","page":68,"endPage":68,"category":"陪诊与导诊","sourceNote":""},{"id":"boolean-50","type":"boolean","number":50,"title":"陪诊人员可以为患者提供药物管理服务","options":[{"key":"T","text":"正确"},{"key":"F","text":"错误"}],"answer":["T"],"explanation":"陪诊人员可以帮助患者管理药物，包括提醒用药时间、协助记录药物反应等","page":68,"endPage":68,"category":"陪诊与导诊","sourceNote":""},{"id":"boolean-51","type":"boolean","number":51,"title":"陪诊服务仅限于医院内部","options":[{"key":"T","text":"正确"},{"key":"F","text":"错误"}],"answer":["F"],"explanation":"陪诊服务不仅限于医院内部，还可以包括帮助患者预约挂号、安排交通、提供出院后的跟踪服务等","page":68,"endPage":68,"category":"陪诊与导诊","sourceNote":""},{"id":"boolean-52","type":"boolean","number":52,"title":"陪诊人员可以为患者提供紧急医疗救助","options":[{"key":"T","text":"正确"},{"key":"F","text":"错误"}],"answer":["F"],"explanation":"陪诊人员不具有提供紧急医疗救助的资质和能力，紧急情况下应立即联系专业医疗人员或拨打急救电话","page":68,"endPage":68,"category":"陪诊与导诊","sourceNote":""},{"id":"boolean-53","type":"boolean","number":53,"title":"陪诊服务可以为患者提供营养餐食建议","options":[{"key":"T","text":"正确"},{"key":"F","text":"错误"}],"answer":["T"],"explanation":"陪诊人员可以帮助患者了解适合其病情的营养餐食建议，以促进患者的康复。","page":68,"endPage":69,"category":"陪诊与导诊","sourceNote":""},{"id":"boolean-54","type":"boolean","number":54,"title":"陪诊服务可以为患者提供预约专家门诊的服务","options":[{"key":"T","text":"正确"},{"key":"F","text":"错误"}],"answer":["T"],"explanation":"陪诊人员可以帮助患者预约专家门诊，尤其是对于不熟悉医院流程的患者来说，这项服务非常有帮助","page":69,"endPage":69,"category":"陪诊与导诊","sourceNote":""},{"id":"boolean-55","type":"boolean","number":55,"title":"陪诊人员可以为患者提供医疗费用的报销服务","options":[{"key":"T","text":"正确"},{"key":"F","text":"错误"}],"answer":["F"],"explanation":"陪诊人员的职责不包括医疗费用的报销，患者需要根据自己的医疗保险政策自行办理相关报销手续","page":69,"endPage":69,"category":"陪诊与导诊","sourceNote":""},{"id":"boolean-56","type":"boolean","number":56,"title":"陪诊服务可以为患者提供术后康复指导","options":[{"key":"T","text":"正确"},{"key":"F","text":"错误"}],"answer":["T"],"explanation":"陪诊人员可以为患者提供术后康复的指导和建议，帮助患者更好地恢复健康","page":69,"endPage":69,"category":"康复与中医","sourceNote":""},{"id":"boolean-57","type":"boolean","number":57,"title":"陪诊服务可以为患者提供心理支持和情绪疏导","options":[{"key":"T","text":"正确"},{"key":"F","text":"错误"}],"answer":["T"],"explanation":"陪诊人员在与患者的接触中，可以提供心理支持和情绪疏导，帮助患者保持良好的心理状态，促进身心健康","pa planation":"功能观的核心是恢复功能，而非治愈疾病。","page":70,"endPage":71,"category":"康复与中医","sourceNote":""},{"id":"boolean-82","type":"boolean","number":82,"title":"中医康复的整体观包括医患一体。","options":[{"key":"T","text":"正确"},{"key":"F","text":"错误"}],"answer":["F"],"explanation":"整体观包括自然、社会、形神一体，不包括医患一体。","page":71,"endPage":71,"category":"康复与中医","sourceNote":""},{"id":"boolean-83","type":"boolean","number":83,"title":"康复医学在1910 年以前确立为独立学科。","options":[{"key":"T","text":"正确"},{"key":"F","text":"错误"}],"answer":["F"],"explanation":"康复医学在1946–1970 年间确立为独立学科。","page":71,"endPage":71,"category":"康复与中医","sourceNote":""},{"id":"boolean-84","type":"boolean","number":84,"title":"中医康复“杂合以治”体现为单一疗法。","options":[{"key":"T","text":"正确"},{"key":"F","text":"错误"}],"answer":["F"],"explanation":"“杂合以治”强调多种治疗方法的综合应用。","page":71,"endPage":71,"category":"康复与中医","sourceNote":""},{"id":"boolean-85","type":"boolean","number":85,"title":"心理评估属于康复工程的内容。","options":[{"key":"T","text":"正确"},{"key":"F","text":"错误"}],"answer":["F"],"explanation":"心理评估属于心理治疗范畴，不属于康复工程。","page":71,"endPage":71,"category":"康复与中医","sourceNote":""},{"id":"boolean-86","type":"boolean","number":86,"title":"中医康复“辨证施治”的基础是患者年龄。","options":[{"key":"T","text":"正确"},{"key":"F","text":"错误"}],"answer":["F"],"explanation":"辨证施治需根据病因、病机、病位等进行。","page":71,"endPage":71,"category":"康复与中医","sourceNote":""},{"id":"boolean-87","type":"boolean","number":87,"title":"中医康复“杂合以治”强调只用药剂。","options":[{"key":"T","text":"正确"},{"key":"F","text":"错误"}],"answer":["F"],"explanation":"“杂合以治”强调多种方法的综合应用，不局限于药剂。","page":71,"endPage":71,"category":"康复与中医","sourceNote":""},{"id":"boolean-88","type":"boolean","number":88,"title":"假肢设计属于康复工程的内容。","options":[{"key":"T","text":"正确"},{"key":"F","text":"错误"}],"answer":["T"],"explanation":"康复工程包括假肢、矫形器等辅助器具的设计与制作。","page":71,"endPage":71,"category":"康复与中医","sourceNote":""},{"id":"boolean-89","type":"boolean","number":89,"title":"中医“治未病”与西医的“对症治疗”概念相符。","options":[{"key":"T","text":"正确"},{"key":"F","text":"错误"}],"answer":["F"],"expla
