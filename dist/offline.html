  <script>window.QUESTION_BANK = {"title":"医疗陪诊顾问-题库202512","edition":"2025.12","sourceFile":"医疗陪诊顾问-题库202512.pdf","pageCount":72,"sourceSha256":"bd249f3670dd7a87d1d17a9f7f5c467d87260f4b36408d2095660beaf6043dc4","questions":[{"id":"single-1","type":"single","number":1,"title":"道德是由什么决定的","options":[{"key":"A","text":"个人兴趣"},{"key":"B","text":"社会经济关系"},{"key":"C","text":"法律法规"},{"key":"D","text":"政府政策"}],"answer":["B"],"explanation":"道德是人类社会特有的行为规范，由社会经济关系决定。","page":1,"endPage":1,"category":"职业道德","sourceNote":""},{"id":"single-2","type":"single","number":2,"title":"下列哪项不是道德的调节方式","options":[{"key":"A","text":"内心信念"},{"key":"B","text":"社会舆论"},{"key":"C","text":"传统习俗"},{"key":"D","text":"专门机构强制执行"}],"answer":["D"],"explanation":"道德不是由专门机构来制定和强制执行的，而是通过其他非正式手段进行调整。","page":1,"endPage":1,"category":"职业道德","sourceNote":""},{"id":"single-3","type":"single","number":3,"title":"职业道德主要调节哪些关系","options":[{"key":"A","text":"从业人员与服务对象之间"},{"key":"B","text":"从业人员之间"},{"key":"C","text":"从业人员与职业之间"},{"key":"D","text":"以上都是"}],"answer":["D"],"explanation":"职业道德可以调节上述所有提到的关系。","page":1,"endPage":1,"category":"职业道德","sourceNote":""},{"id":"single-4","type":"single","number":4,"title":"职业理想反映了什么","options":[{"key":"A","text":"对职业活动目标的追求和向往"},{"key":"B","text":"对休闲活动的喜好"},{"key":"C","text":"对家庭生活的期待"},{"key":"D","text":"对社会地位的渴望"}],"answer":["A"],"explanation":"职业理想是对职业活动目标的追求和向往，体现了个人的价值观。","page":1,"endPage":1,"category":"职业道德","sourceNote":""},{"id":"single-5","type":"single","number":5,"title":"职业态度指的是什么","options":[{"key":"A","text":"对工作的随意性"},{"key":"B","text":"对岗位工作的一种相对稳定的劳动态度"},{"key":"C","text":"对同事的友好程度"},{"key":"D","text":"对上司的尊重"}],"answer":["B"],"explanation":"职业态度是在一定社会环境影响下形成的对岗位工作的稳定态度。","page":1,"endPage":1,"category":"职业道德","sourceNote":""},{"id":"single-6","type":"single","number":6,"title":"职业义务是什么","options":[{"key":"A","text":"从业者为他人和社会尽的责任"},{"key":"B","text":"从业者在工作中的个人利益"},{"key":"C","text":"从业者的假期安排"},{"key":"D","text":"从业者的薪资待遇"}],"answer":["A"],"explanatio ],"answer":["D"],"explanation":"整体观包括自然、社会、形神三个方面。","page":5,"endPage":5,"category":"康复与中医","sourceNote":""},{"id":"single-27","type":"single","number":27,"title":"康复治疗团队的核心是","options":[{"key":"A","text":"康复医师"},{"key":"B","text":"护士"},{"key":"C","text":"社会工作者"},{"key":"D","text":"患者家属"}],"answer":["A"],"explanation":"康复医师是康复治疗团队的领导和协调者。","page":5,"endPage":5,"category":"康复与中医","sourceNote":""},{"id":"single-28","type":"single","number":28,"title":"下列哪项不是中医康复常用技术","options":[{"key":"A","text":"针灸"},{"key":"B","text":"推拿"},{"key":"C","text":"放疗"},{"key":"D","text":"气功"}],"answer":["C"],"explanation":"放疗属于西医治疗手段。","page":5,"endPage":5,"category":"康复与中医","sourceNote":""},{"id":"single-29","type":"single","number":29,"title":"“循证医学”的核心是","options":[{"key":"A","text":"传统经验"},{"key":"B","text":"患者偏好"},{"key":"C","text":"最佳证据"},{"key":"D","text":"医生直觉"}],"answer":["C"],"explanation":"循证医学强调依据最佳研究证据进行临床决策。","page":5,"endPage":5,"category":"康复与中医","sourceNote":""},{"id":"single-30","type":"single","number":30,"title":"中医康复“辨证观”强调","options":[{"key":"A","text":"统一治疗"},{"key":"B","text":"个体化治疗"},{"key":"C","text":"标准化治疗"},{"key":"D","text":"随机治疗"}],"answer":["B"],"explanation":"辨证观强调因时、因地、因人制宜的个体化治疗。","page":5,"endPage":5,"category":"康复与中医","sourceNote":""},{"id":"single-31","type":"single","number":31,"title":"下列哪项不属于康复治疗手段","options":[{"key":"A","text":"物理治疗"},{"key":"B","text":"作业治疗"},{"key":"C","text":"手术治疗"},{"key":"D","text":"言语治疗"}],"answer":["C"],"explanation":"手术治疗属于临床医学范畴，不是康复治疗手段。","page":5,"endPage":5,"category":"康复与中医","sourceNote":""},{"id":"single-32","type":"single","number":32,"title":"中医康复“正气观”主要针对","options":[{"key":"A","text":"外邪侵袭"},{"key":"B","text":"正气不足"},{"key":"C","text":"情绪波动"},{"key":"D","text":"环境变化"}],"answer":["B"],"explanation":"正气观强调扶助正气，增强机体抗病能力。","page":5,"endPage":6,"category":"康复与中医","sourceNote":""},{"id":"single-33","type":"single","number":33,"title":"康复评定的频率通常包括","options":[{"key":"A","text":"只有初期评定"},{"key":"B","text":"初期、中期、末期"},{"key":"C","text":"只有末期评定"},{"key":"D","text":"随机评定"}],"answer":["B"],"explanation":"康复评定应贯穿治疗全过程，包括初、中、末期。","page":6,"endPage":6,"category":"康复与中医","sourceNote":""},{"id":"single-34","type":"single","number":34,"title":"下列哪项是“残障”的表现","options":[{"key":"A","text":"肌肉萎缩"},{"key":"B","text":"无法工作"},{"key":"C","text":"关节疼痛"},{"key":"D","text":"视力下降"}],"answer":["B"],"explanation":"无法工作属于社会层面的障碍，即残障。","page":6,"endPage":6,"category":"康复与中医","sourceNote":""},{"id":"single-35","type":"single","number":35,"title":"非处方药是指哪种药品","options":[{"key":"A","text":"需要凭执业医师或执业助理医师处方购买的药品"},{"key":"B","text":"消费者可以自行判断、购买和使用的药品"},{"key":"C","text":"仅限医院内使用的药品"},{"key":"D","text":"必须经过特殊检查和试验才能使用的药品"}],"answer":["B"],"explanation":"非处方药是不需要凭执业医师或执业助理医师处方，消费者可以自行判断、购买和使用的药品。","page":6,"endPage":6,"category":"药品与器械","sourceNote":""},{"id":"single-36","type":"single","number":36,"title":"下列哪项不是非处方药遴选的原则","options":[{"key":"A","text":"应用安全"},{"key":"B","text":"疗效确切"},{"key":"C","text":"质量稳定"},{"key":"D","text":"使用复杂"}],"answer":["D"],"explanation":"非处方药遴选的原则包括应用安全、疗效确切、质量稳定和使用方便。因此，“使用复杂”不符合非处方药的特点。","page":6,"endPage":6,"category":"药品与器械","sourceNote":""},{"id":"single-37","type":"single","number":37,"title":"“双跨”药品指的是什么","options":[{"key":"A","text":"既可以在药店销售也可以在超市销售的药品"},{"key":"B","text":"既可以作为处方药又可以作为非处方药的药品"},{"key":"C","text":"既可以用于成人也可以用于儿童的药品"},{"key":"D","text":"既可以口服也可以注射的药品"}],"answer":["B"],"explanation":"“双跨”药品是指那些根据其适应证、剂量和疗程的不同，既可以作为处方药，又可以作为非处方药的药品。","page":6,"endPage":7,"category":"药品与器械","sourceNote":""},{"id":"single-38","type":"single","number":38,"title":"甲类非处方药的专有标识颜色是什么","options":[{"key":"A","text":"红色"},{"key":"B","text":"绿色"},{"key":"C","text":"蓝色"},{"key":"D","text":"橙色"}],"answer":["A"],"explanation":"我国非处方药专有标识图案为椭圆形背景下的OTC 三个英文字母的组合，红色标识用于甲类非处方药。","page":7,"endPage":7,"category":"药品与器械","sourceNote":""},{"id":"single-39","type":"single","number":39,"title":"基本医疗保障制度的主要目的是什么","options":[{"key":"A","text":"提高医疗服务价格"},{"key":"B","text":"限制医疗机构数量"},{"key":"C","text":"确保人们获得必要的医疗服务"},{"key":"D","text":"增加医生收入"}],"answer":["C"],"explanation":"基本医疗保障制度是为了确保人们在生病或者受到伤害后能够获得必要的医疗服务。","page":7,"endPage":7,"category":"医疗保障","sourceNote":""},{"id":"single-40","type":"single","number":40,"title":"“1+4+2”的医疗保障制度总体改革框架中的“1”代表什么","options":[{"key":"A","text":"一个统一的医保信息系统"},{"key":"B","text":"一种医疗保险类型"},{"key":"C","text":"到2030 年全面建成多层次医疗保障制度体系"},{"key":"D","text":"一项医疗救助政策"}],"answer":["C"],"explanation":"“1”是指到2030 年，全面建成以基本医疗保险为主体，医疗救助为托底，补充医疗保险、商业健康保险、慈善捐赠、医疗互助共同发展的多层次医疗保障制度体系。","page":7,"endPage":7,"category":"医疗保障","sourceNote":""},{"id":"single-41","type":"single","number":41,"title":"下列哪个不是多层次医疗保障体系的一部分","options":[{"key":"A","text":"基本医疗保险"},{"key":"B","text":"补充医疗保险"},{"key":"C","text":"商业健康保险"},{"key":"D","text":"国家直接补贴"}],"answer":["D"],"explanation":"多层次医疗保障体系包括基本医疗保险、补充医疗保险、医疗救助、商业健康保险、慈善捐赠、医疗互助，但不包括国家直接补贴。","page":7,"endPage":7,"category":"医疗保障","sourceNote":""},{"id":"single-42","type":"single","number":42,"title":"定点医疗机构至少需要运营多久才能申请成为定点","options":[{"key":"A","text":"1 个月"},{"key":"B","text":"3 个月"},{"key":"C","text":"6 个月"},{"key":"D","text":"1 年"}],"answer":["B"],"explanation":"申请医保定点的医疗机构应当正式运营至少3 个月。","page":7,"endPage":7,"category":"医疗保障","sourceNote":""},{"id":"single-43","type":"single","number":43,"title":"中国医疗保障官方标志的颜色是什么","options":[{"key":"A","text":"红色"},{"key":"B","text":"绿色"},{"key":"C","text":"蓝色"},{"key":"D","text":"橙色"}],"answer":["C"],"explanation":"中国医疗保障官方标志的颜色为蓝色，寓意保障、稳定和发展。","page":7,"endPage":8,"category":"医疗保障","sourceNote":""},{"id":"single-44","type":"single","number":44,"title":"下列哪项不是定点零售药店必须满足的基本条件","options":[{"key":"A","text":"正式运营至少3 个月"},{"key":"B","text":"至少有1 名取得医师执业证书的医师"},{"key":"C","text":"具备符合医保协议管理要求的信息系统"},{"key":"D","text":"符合法律法规规定的其他条件"}],"answer":["B"],"explanation":"定点零售药店至少需要有1 名取得医师执业证书、乡村医生执业证书或中医(专长)医师资格证书且第一注册地在该医疗机构的医师，但这个条件适用于定点医疗机构，而非定点零售药店。","page":8,"endPage":8,"category":"医疗保障","sourceNote":"原解析前半句将“医师”条件写成药店条件，后半句又说明该条件适用于医疗机构，原文表述存在矛盾。"},{"id":"single-45","type":"single","number":45,"title":"新生儿期是指婴儿出生后脐带结扎到出生后的哪段时间","options":[{"key":"A","text":"0-7 天"},{"key":"B","text":"0-14 天"},{"key":"C","text":"0-28 天"},{"key":"D","text":"0-60 天"}],"answer":["C"],"explanation":"新生儿期定义为婴儿出生后脐带结扎到出生后28 天内。","page":8,"endPage":8,"category":"预防保健","sourceNote":""},{"id":"single-46","type":"single","number":46,"title":"母乳喂养对新生儿有哪些益处","options":[{"key":"A","text":"提高新生儿抵抗力"},{"key":"B","text":"促进母亲产后恢复"},{"key":"C","text":"增进母婴感情"},{"key":"D","text":"以上都是"}],"answer":["D"],"explanation":"母乳喂养可以提高新生儿抵抗力，促进母亲产后恢复，同时增进母婴感情。","page":8,"endPage":8,"category":"预防保健","sourceNote":""},{"id":"single-47","type":"single","number":47,"title":"新生儿应在出生后多少小时内接种卡介苗和乙肝疫苗","options":[{"key":"A","text":"6 小时"},{"key":"B","text":"12 小时"},{"key":"C","text":"24 小时"},{"key":"D","text":"48 小时"}],"answer":["C"],"explanation":"新生儿应在出生后24 小时内接种卡介苗和乙肝疫苗。","page":8,"endPage":8,"category":"预防保健","sourceNote":""},{"id":"single-48","type":"single","number":48,"title":"婴儿期预防保健中，婴儿的营养状况与什么时期及成年后的健康状况密切相关","options":[{"key":"A","text":"幼儿期"},{"key":"B","text":"学龄前期"},{"key":"C","text":"儿童期"},{"key":"D","text":"成年期"}],"answer":["C"],"explanation":"婴儿期的营养状况与儿童期及成年后的健康状况密切相关。","page":8,"endPage":8,"category":"预防保健","sourceNote":""},{"id":"single-49","type":"single","number":49,"title":"婴儿期预防保健中，推荐出生半年内的婴儿每1-2 个月进行一次什么","options":[{"key":"A","text":"疫苗接种"},{"key":"B","text":"体检"},{"key":"C","text":"家庭访视"},{"key":"D","text":"口腔检查"}],"answer":["B"],"explanation":"推荐出生半年内的婴儿每1-2 个月进行一次健康体检。","page":8,"endPage":9,"category":"预防保健","sourceNote":""},{"id":"single-50","type":"single","number":50,"title":"幼儿期预防保健中，为了预防意外伤害的发生，应注意什么","options":[{"key":"A","text":"合理膳食"},{"key":"B","text":"语言发育"},{"key":"C","text":"运动能力发展"},{"key":"D","text":"环境中的潜在不安全因素"}],"answer":["D"],"explanation":"幼儿期预防保健中，应注意消除环境中潜在的不安全因素，以预防意外伤害的发生。","page":9,"endPage":9,"category":"预防保健","sourceNote":""},{"id":"single-51","type":"single","number":51,"title":"学龄前期预防保健中，为了使儿童入学后能够快速适应校园生活，应进行什么","options":[{"key":"A","text":"合理膳食"},{"key":"B","text":"预防接种"},{"key":"C","text":"入学前准备"},{"key":"D","text":"体育锻炼"}],"answer":["C"],"explanation":"为了使儿童入学后能够快速适应校园生活，应对学龄前期儿童进行学前教育，做好入学前准备。","page":9,"endPage":9,"category":"预防保健","sourceNote":""},{"id":"single-52","type":"single","number":52,"title":"青春期女性预防保健中，应该培养良好的什么习惯","options":[{"key":"A","text":"生活和卫生习惯"},{"key":"B","text":"饮食习惯"},{"key":"C","text":"运动习惯"},{"key":"D","text":"学习习惯"}],"answer":["A"],"explanation":"青春期女性预防保健中，应培养良好的生活和卫生习惯。","page":9,"endPage":9,"category":"预防保健","sourceNote":""},{"id":"single-53","type":"single","number":53,"title":"妊娠期预防保健中，妊娠早期应避免接触什么","options":[{"key":"A","text":"有害物质"},{"key":"B","text":"社交活动"},{"key":"C","text":"体力劳动"},{"key":"D","text":"心理压力"}],"answer":["A"],"explanation":"妊娠早期应避免接触有害物质，保护胚胎。","page":9,"endPage":9,"category":"预防保健","sourceNote":""},{"id":"single-54","type":"single","number":54,"title":"产褥期预防保健中，建议产妇在夏季保证屋内温度适宜，避免什么","options":[{"key":"A","text":"中暑"},{"key":"B","text":"冷风"},{"key":"C","text":"潮湿"},{"key":"D","text":"干燥"}],"answer":["A"],"explanation":"产褥期预防保健中，建议产妇在夏季保证屋内温度适宜，避免中暑。","page":9,"endPage":9,"category":"预防保健","sourceNote":""},{"id":"single-55","type":"single","number":55,"title":"更年期预防保健中，为了减少骨质疏松的发生，更年期女性应多食用什么","options":[{"key":"A","text":"蛋白质和钙的食物"},{"key":"B","text":"维生素C"},{"key":"C","text":"纤维素"},{"key":"D","text":"糖类"}],"answer":["A"],"explanation":"更年期预防保健中，更年期女性应多食用富含蛋白质和钙的食物，减少骨质疏松的发生。","page":9,"endPage":10,"category":"预防保健","sourceNote":""},{"id":"single-56","type":"single","number":56,"title":"老年人预防保健中，为了维持和促进老年人健康，应提倡什么样的饮食习惯","options":[{"key":"A","text":"多油多盐"},{"key":"B","text":"辛辣刺激"},{"key":"C","text":"少食多餐"},{"key":"D","text":"高糖高脂"}],"answer":["C"],"explanation":"老年人预防保健中，提倡少食多餐，以易消化吸收、少油少盐、忌辛辣的食物为主。","page":10,"endPage":10,"category":"预防保健","sourceNote":""},{"id":"single-57","type":"single","number":57,"title":"高血压一级预防的主要对象是什么人群","options":[{"key":"A","text":"高血压患者"},{"key":"B","text":"高危人群"},{"key":"C","text":"健康人群"},{"key":"D","text":"慢性病患者"}],"answer":["C"],"explanation":"高血压一级预防的主要对象是健康人群，目的是避免和控制高血压相关危险因素。","page":10,"endPage":10,"category":"预防保健","sourceNote":""},{"id":"single-58","type":"single","number":58,"title":"冠心病二级预防的主要措施是什么","options":[{"key":"A","text":"健康教育"},{"key":"B","text":"早发现、早诊断、早治疗"},{"key":"C","text":"控制病情、缓解症状"},{"key":"D","text":"康复治疗"}],"answer":["B"],"explanation":"冠心病二级预防的主要措施是早发现、早诊断和早治疗，目的是降低患者的猝死率。","page":10,"endPage":10,"category":"预防保健","sourceNote":""},{"id":"single-59","type":"single","number":59,"title":"2 型糖尿病三级预防的主要目标是什么","options":[{"key":"A","text":"防止动脉粥样硬化的发生和发展"},{"key":"B","text":"降低糖尿病微血管和大血管病变的发生"},{"key":"C","text":"控制病情发展，预防并发症导致的残疾或早亡"},{"key":"D","text":"提高患者的生活质量"}],"answer":["C"],"explanation":"2 型糖尿病三级预防的主要目标是全面控制糖尿病，并预防其并发症导致的残疾或早亡。","page":10,"endPage":10,"category":"预防保健","sourceNote":""},{"id":"single-60","type":"single","number":60,"title":"现场急救的主要目的是什么","options":[{"key":"A","text":"立即治疗疾病"},{"key":"B","text":"争取时间，挽救生命"},{"key":"C","text":"提供长期护理"},{"key":"D","text":"进行手术准备"}],"answer":["B"],"explanation":"现场急救的目的是在疾病或意外伤害发生时，能够争取时间，挽救生命，同时减少伤残。","page":10,"endPage":10,"category":"现场急救","sourceNote":""},{"id":"single-61","type":"single","number":61,"title":"我国规定的统一医疗急救电话号码是","options":[{"key":"A","text":"911"},{"key":"B","text":"110"},{"key":"C","text":"120"},{"key":"D","text":"119"}],"answer":["C"],"explanation":"我国规定的统一医疗急救电话号码是“120”。","page":10,"endPage":11,"category":"现场急救","sourceNote":""},{"id":"single-62","type":"single","number":62,"title":"动脉出血的特点是什么","options":[{"key":"A","text":"血色暗红，血流较缓慢"},{"key":"B","text":"血色鲜红，呈持续性流出"},{"key":"C","text":"血色鲜红，呈搏动性喷射状"},{"key":"D","text":"血色淡红，容易自动凝固"}],"answer":["C"],"explanation":"动脉出血的特点是血色鲜红，呈与动脉搏动同步的搏动性喷射状，出血速度快，危险性大。","page":11,"endPage":11,"category":"现场急救","sourceNote":""},{"id":"single-63","type":"single","number":63,"title":"心肺复苏中最重要的步骤是什么","options":[{"key":"A","text":"开放气道"},{"key":"B","text":"胸外按压"},{"key":"C","text":"人工呼吸"},{"key":"D","text":"除颤"}],"answer":["B"],"explanation":"心肺复苏中，胸外按压最为重要，因为人脑细胞对缺氧最为敏感，胸外按压可以保证心脏、脑等重要器官的供血。","page":11,"endPage":11,"category":"现场急救","sourceNote":""},{"id":"single-64","type":"single","number":64,"title":"中风的简易检查方法FAST 实验中的“S”代表什么","options":[{"key":"A","text":"面部（Face）"},{"key":"B","text":"双手（Arm）"},{"key":"C","text":"言语（Speech）"},{"key":"D","text":"时间（Time）"}],"answer":["C"],"explanation":"FAST 实验中的“S”代表言语（Speech），让病人说话，此时病人的吐字会含糊不清或不能言语。","page":11,"endPage":11,"category":"现场急救","sourceNote":""},{"id":"single-65","type":"single","number":65,"title":"急性冠脉综合征的主要表现是什么","options":[{"key":"A","text":"头痛、头晕"},{"key":"B","text":"呼吸困难"},{"key":"C","text":"胸骨后压榨性疼痛"},{"key":"D","text":"恶心呕吐"}],"answer":["C"],"explanation":"急性冠脉综合征的主要表现是胸骨后压榨性疼痛，疼痛程度较严重，常常难以忍受。","page":11,"endPage":11,"category":"现场急救","sourceNote":""},{"id":"single-66","type":"single","number":66,"title":"呼吸道异物阻塞时，清醒的成年病人最可能采取的手势是什么","options":[{"key":"A","text":"握拳"},{"key":"B","text":"手呈“V”字形状"},{"key":"C","text":"双手抱头"},{"key":"D","text":"双手捂住腹部"}],"answer":["B"],"explanation":"清醒的病人会用手紧握喉部，手呈“V”字形状，这是呼吸道异物阻塞的典型手势。","page":11,"endPage":11,"category":"现场急救","sourceNote":""},{"id":"single-67","type":"single","number":67,"title":"溺水者被救上岸后，如果发现其没有意识和呼吸，应立即进行什么操作","options":[{"key":"A","text":"立即送医院"},{"key":"B","text":"立即实施心肺复苏"},{"key":"C","text":"立即进行人工呼吸"},{"key":"D","text":"立即拨打急救电话"}],"answer":["B"],"explanation":"如果溺水者没有意识和呼吸，应立即实施心肺复苏，以挽救生命。","page":11,"endPage":12,"category":"现场急救","sourceNote":""},{"id":"single-68","type":"single","number":68,"title":"自动体外除颤器（AED）的主要功能是什么","options":[{"key":"A","text":"测量血压"},{"key":"B","text":"监测心律并自动除颤"},{"key":"C","text":"提供氧气"},{"key":"D","text":"记录病人心跳"}],"answer":["B"],"explanation":"AED 的主要功能是监测病人的心律并自动除颤，终止心脏所有不规则、紊乱的心电活动。","page":12,"endPage":12,"category":"现场急救","sourceNote":""},{"id":"single-69","type":"single","number":69,"title":"对于疑似中风的患者，应该采取什么措施","options":[{"key":"A","text":"观察等待"},{"key":"B","text":"立即拨打急救电话"},{"key":"C","text":"给病人服用降压药"},{"key":"D","text":"让病人自行前往医院"}],"answer":["B"],"explanation":"对于疑似中风的患者，应立即拨打急救电话，不要观察等待，以免错过最佳治疗时间。","page":12,"endPage":12,"category":"现场急救","sourceNote":""},{"id":"single-70","type":"single","number":70,"title":"健康的内涵除了没有疾病外，还包含哪些方面","options":[{"key":"A","text":"仅身体的健康"},{"key":"B","text":"身体、心理和社会适应性的整体健康"},{"key":"C","text":"只是心理健康"},{"key":"D","text":"社会适应良好和有道德"}],"answer":["B"],"explanation":"现代的健康观认为健康不仅是躯体没有疾病，还包括心理健康、社会适应良好和有道德。因此，正确选项是B。","page":12,"endPage":12,"category":"健康素养","sourceNote":""},{"id":"single-71","type":"single","number":71,"title":"下列哪一项不是影响健康素养的因素","options":[{"key":"A","text":"教育水平"},{"key":"B","text":"经济水平"},{"key":"C","text":"天气变化"},{"key":"D","text":"文化程度"}],"answer":["C"],"explanation":"影响健康素养的因素主要包括教育水平、经济水平、文化程度等，而天气变化并非直接的影响因素，故正确选项是C。","page":12,"endPage":12,"category":"健康素养","sourceNote":""},{"id":"single-72","type":"single","number":72,"title":"成年人的正常血压范围是多少","options":[{"key":"A","text":"收缩压≥90mmHg 且<140mmHg,舒张压≥60mmHg 且<90mmHg"},{"key":"B","text":"收缩压≥80mmHg 且<130mmHg,舒张压≥50mmHg 且<80mmHg"},{"key":"C","text":"收缩压≥100mmHg 且<150mmHg,舒张压≥70mmHg 且<100mmHg"},{"key":"D","text":"收缩压≥110mmHg 且<160mmHg,舒张压≥80mmHg 且<110mmHg"}],"answer":["A"],"explanation":"成年人的正常血压应为收缩压≥90mmHg 且<140mmHg,舒张压≥60mmHg 且<90mmHg，所以正确选项是A。","page":12,"endPage":12,"category":"健康素养","sourceNote":""},{"id":"single-73","type":"single","number":73,"title":"预防传染病最有效、最经济的措施是什么","options":[{"key":"A","text":"接种疫苗"},{"key":"B","text":"隔离病人"},{"key":"C","text":"增强免疫力"},{"key":"D","text":"使用抗生素"}],"answer":["A"],"explanation":"接种疫苗是预防一些传染病最有效、最经济的措施，因此正确选项是A。","page":12,"endPage":13,"category":"健康素养","sourceNote":""},{"id":"single-74","type":"single","number":74,"title":"以下哪种行为不属于健康生活方式","options":[{"key":"A","text":"合理膳食"},{"key":"B","text":"适量运动"},{"key":"C","text":"戒烟限酒"},{"key":"D","text":"每天睡眠少于5 小时"}],"answer":["D"],"explanation":"健康生活方式包括合理膳食、适量运动、戒烟限酒和保证充足的睡眠（通常建议7-8小时）。每天睡眠少于5 小时不符合健康生活方式的标准，所以正确选项是D。","page":13,"endPage":13,"category":"健康素养","sourceNote":""},{"id":"single-75","type":"single","number":75,"title":"关于艾滋病的传播途径，下列说法正确的是","options":[{"key":"A","text":"日常生活和工作接触可以传播"},{"key":"B","text":"可以通过血液、性接触和母婴三种途径传播"},{"key":"C","text":"可以通过空气传播"},{"key":"D","text":"可以通过食物传播"}],"answer":["B"],"explanation":"艾滋病主要通过血液、性接触和母婴三种途径传播，日常生活和工作接触不会传播，所以正确选项是B。","page":13,"endPage":13,"category":"健康素养","sourceNote":""},{"id":"single-76","type":"single","number":76,"title":"对于肺结核病人的治疗，下列说法正确的是","options":[{"key":"A","text":"规范治疗不能治愈大部分患者"},{"key":"B","text":"规范治疗可以治愈大部分患者，并能预防耐药结核的产生"},{"key":"C","text":"不需要规范治疗也可以自愈"},{"key":"D","text":"规范治疗只能缓解症状，无法治愈"}],"answer":["B"],"explanation":"坚持规范治疗，大部分肺结核病人能够治愈，并能有效预防耐药结核的产生，所以正确选项是B。","page":13,"endPage":13,"category":"健康素养","sourceNote":""},{"id":"single-77","type":"single","number":77,"title":"在流感流行季节前接种流感疫苗的主要作用是什么","options":[{"key":"A","text":"完全防止患流感"},{"key":"B","text":"减少患流感的机会或减轻患流感后的症状"},{"key":"C","text":"对所有类型的流感都有效"},{"key":"D","text":"只对儿童有效"}],"answer":["B"],"explanation":"在流感流行季节前接种流感疫苗可减少患流感的机会或减轻患流感后的症状，但并不能完全防止患流感，所以正确选项是B。","page":13,"endPage":13,"category":"健康素养","sourceNote":""},{"id":"single-78","type":"single","number":78,"title":"关于无偿献血的说法，下列哪项是正确的","options":[{"key":"A","text":"无偿献血只对他人有利，对自己无益"},{"key":"B","text":"无偿献血既助人又利己"},{"key":"C","text":"无偿献血可能会对健康造成伤害"},{"key":"D","text":"无偿献血应当限制次数"}],"answer":["B"],"explanation":"无偿献血是一项助人利己的行为，既能帮助需要输血的病人，也能促进自身血液循环，所以正确选项是B。","page":13,"endPage":14,"category":"健康素养","sourceNote":""},{"id":"single-79","type":"single","number":79,"title":"健康素养与人群的什么密切相关","options":[{"key":"A","text":"年龄"},{"key":"B","text":"性别"},{"key":"C","text":"健康水平和预期寿命"},{"key":"D","text":"居住地"}],"answer":["C"],"explanation":"健康素养与人群的健康水平和预期寿命密切相关，是预测人群健康状况的重要指标，所以正确选项是C。","page":14,"endPage":14,"category":"健康素养","sourceNote":""},{"id":"single-80","type":"single","number":80,"title":"人体结构的基本单位是什么","options":[{"key":"A","text":"组织"},{"key":"B","text":"器官"},{"key":"C","text":"系统"},{"key":"D","text":"细胞"}],"answer":["D"],"explanation":"细胞是人体形态、结构、生理功能与生长发育的基本单位，因此正确选项是D。","page":14,"endPage":14,"category":"医学基础","sourceNote":""},{"id":"single-81","type":"single","number":81,"title":"下列哪一项不是细胞的主要组成部分","options":[{"key":"A","text":"细胞膜"},{"key":"B","text":"细胞质"},{"key":"C","text":"细胞核"},{"key":"D","text":"细胞壁"}],"answer":["D"],"explanation":"细胞的主要组成部分包括细胞膜、细胞质和细胞核，而细胞壁主要存在于植物细胞中，不属于人体细胞的组成部分，因此正确选项是D。","page":14,"endPage":14,"category":"医学基础","sourceNote":""},{"id":"single-82","type":"single","number":82,"title":"神经组织的主要功能是什么","options":[{"key":"A","text":"产生肌肉收缩"},{"key":"B","text":"传递信息和调节生理活动"},{"key":"C","text":"分泌激素"},{"key":"D","text":"保护和支持"}],"answer":["B"],"explanation":"神经组织负责将外部的信息传递给大脑，并将大脑的命令传递给身体各个部位，因此其主要功能是传递信息和调节生理活动，正确选项是B。","page":14,"endPage":14,"category":"医学基础","sourceNote":""},{"id":"single-83","type":"single","number":83,"title":"下列哪种肌肉组织主要分布在消化器官和血管壁","options":[{"key":"A","text":"骨骼肌"},{"key":"B","text":"心肌"},{"key":"C","text":"平滑肌"},{"key":"D","text":"肌上皮"}],"answer":["C"],"explanation":"平滑肌主要分布在消化器官、血管壁等，参与反射性的收缩活动，因此正确选项是C。","page":14,"endPage":14,"category":"医学基础","sourceNote":""},{"id":"single-84","type":"single","number":84,"title":"皮肤的表层主要由哪种组织构成","options":[{"key":"A","text":"神经组织"},{"key":"B","text":"肌肉组织"},{"key":"C","text":"上皮组织"},{"key":"D","text":"结缔组织"}],"answer":["C"],"explanation":"皮肤的表皮是由上皮组织构成的，因此正确选项是C。","page":14,"endPage":15,"category":"医学基础","sourceNote":""},{"id":"single-85","type":"single","number":85,"title":"下列哪一项不是结缔组织的功能","options":[{"key":"A","text":"支持和填充"},{"key":"B","text":"连接和支架"},{"key":"C","text":"分泌消化液"},{"key":"D","text":"提供营养"}],"answer":["C"],"explanation":"结缔组织的主要功能包括支持和填充、连接和支架、提供营养等，而分泌消化液是上皮组织的功能，因此正确选项是C。","page":15,"endPage":15,"category":"医学基础","sourceNote":""},{"id":"single-86","type":"single","number":86,"title":"下列哪个系统负责气体交换","options":[{"key":"A","text":"消化系统"},{"key":"B","text":"循环系统"},{"key":"C","text":"呼吸系统"},{"key":"D","text":"泌尿系统"}],"answer":["C"],"explanation":"呼吸系统的主要功能是吸入新鲜空气并通过肺泡内的气体交换使血液得到氧气并排出二氧化碳，因此正确选项是C。","page":15,"endPage":15,"category":"医学基础","sourceNote":""},{"id":"single-87","type":"single","number":87,"title":"下列哪种疾病属于神经系统常见疾病","options":[{"key":"A","text":"冠心病"},{"key":"B","text":"脑梗死"},{"key":"C","text":"肺气肿"},{"key":"D","text":"糖尿病"}],"answer":["B"],"explanation":"脑梗死属于神经系统常见疾病，而冠心病属于心血管系统疾病，肺气肿属于呼吸系统疾病，糖尿病属于内分泌系统疾病，因此正确选项是B。","page":15,"endPage":15,"category":"医学基础","sourceNote":""},{"id":"single-88","type":"single","number":88,"title":"下列哪项不是药物的作用途径","options":[{"key":"A","text":"内服药"},{"key":"B","text":"外用药"},{"key":"C","text":"注射药"},{"key":"D","text":"吸入药"}],"answer":["D"],"explanation":"药物的作用途径包括内服药、外用药和注射药，而吸入药是药物的一种给药方式，不属于作用途径，因此正确选项是D。","page":15,"endPage":15,"category":"医学基础","sourceNote":""},{"id":"single-89","type":"single","number":89,"title":"下列哪项不是药物的不良反应","options":[{"key":"A","text":"副作用"},{"key":"B","text":"毒性反应"},{"key":"C","text":"治疗作用"},{"key":"D","text":"变态反应"}],"answer":["C"],"explanation":"药物的不良反应包括副作用、毒性反应、变态反应等，而治疗作用是药物的预期效果，因此正确选项是C。","page":15,"endPage":15,"category":"医学基础","sourceNote":""},{"id":"single-90","type":"single","number":90,"title":"慢性病的特点不包括以下哪一项","options":[{"key":"A","text":"病因复杂"},{"key":"B","text":"起病隐匿"},{"key":"C","text":"病程较长"},{"key":"D","text":"容易治愈"}],"answer":["D"],"explanation":"慢性病的特点包括病因复杂、起病隐匿、病程较长、难以治愈，因此容易治愈不符合慢性病的特点，正确选项是D。","page":15,"endPage":16,"category":"医学基础","sourceNote":""},{"id":"single-91","type":"single","number":91,"title":"下列哪项不是高血压的危险因素","options":[{"key":"A","text":"超重或肥胖"},{"key":"B","text":"高盐饮食"},{"key":"C","text":"长期过量饮酒"},{"key":"D","text":"规律运动"}],"answer":["D"],"explanation":"高血压的危险因素包括超重或肥胖、高盐饮食、长期过量饮酒等，而规律运动有助于预防高血压，因此正确选项是D。","page":16,"endPage":16,"category":"医学基础","sourceNote":""},{"id":"single-92","type":"single","number":92,"title":"下列哪项不是糖尿病的分类","options":[{"key":"A","text":"1 型糖尿病"},{"key":"B","text":"2 型糖尿病"},{"key":"C","text":"妊娠期糖尿病"},{"key":"D","text":"急性糖尿病"}],"answer":["D"],"explanation":"糖尿病的分类包括1 型糖尿病、2 型糖尿病、妊娠期糖尿病和其他特殊类型糖尿病，而急性糖尿病并不是标准分类，因此正确选项是D。","page":16,"endPage":16,"category":"医学基础","sourceNote":""},{"id":"single-93","type":"single","number":93,"title":"冠心病的主要危险因素不包括以下哪一项","options":[{"key":"A","text":"高血压"},{"key":"B","text":"血脂异常"},{"key":"C","text":"吸烟"},{"key":"D","text":"高纤维饮食"}],"answer":["D"],"explanation":"冠心病的主要危险因素包括高血压、血脂异常、吸烟等，而高纤维饮食有助于预防冠心病，因此正确选项是D。","page":16,"endPage":16,"category":"医学基础","sourceNote":""},{"id":"single-94","type":"single","number":94,"title":"脑卒中的主要危险因素不包括以下哪一项","options":[{"key":"A","text":"高血压"},{"key":"B","text":"心脏病"},{"key":"C","text":"糖尿病"},{"key":"D","text":"高蛋白饮食"}],"answer":["D"],"explanation":"脑卒中的主要危险因素包括高血压、心脏病、糖尿病等，而高蛋白饮食并不是主要危险因素，因此正确选项是D。","page":16,"endPage":16,"category":"医学基础","sourceNote":""},{"id":"single-95","type":"single","number":95,"title":"下列哪项不是慢性阻塞性肺疾病的危险因素","options":[{"key":"A","text":"吸烟"},{"key":"B","text":"职业性粉尘和化学物质"},{"key":"C","text":"空气污染"},{"key":"D","text":"高脂肪饮食"}],"answer":["D"],"explanation":"慢性阻塞性肺疾病的危险因素包括吸烟、职业性粉尘和化学物质、空气污染等，而高脂肪饮食并不是主要危险因素，因此正确选项是D。","page":16,"endPage":17,"category":"医学基础","sourceNote":""},{"id":"single-96","type":"single","number":96,"title":"恶性肿瘤的主要危险因素不包括以下哪一项","options":[{"key":"A","text":"吸烟"},{"key":"B","text":"乙型肝炎病毒感染"},{"key":"C","text":"不合理膳食"},{"key":"D","text":"高纤维饮食"}],"answer":["D"],"explanation":"恶性肿瘤的主要危险因素包括吸烟、乙型肝炎病毒感染、不合理膳食等，而高纤维饮食有助于预防某些恶性肿瘤，因此正确选项是D。","page":17,"endPage":17,"category":"医学基础","sourceNote":""},{"id":"single-97","type":"single","number":97,"title":"流行病学研究的对象是什么","options":[{"key":"A","text":"个体"},{"key":"B","text":"群体"},{"key":"C","text":"动物"},{"key":"D","text":"植物"}],"answer":["B"],"explanation":"流行病学的研究对象是人群，关注的是具有某种特征的人群，因此正确选项是B。","page":17,"endPage":17,"category":"医学基础","sourceNote":""},{"id":"single-98","type":"single","number":98,"title":"下列哪项不是流行病学的基本任务","options":[{"key":"A","text":"探索病因"},{"key":"B","text":"制定防制对策"},{"key":"C","text":"评价防治效果"},{"key":"D","text":"诊断疾病"}],"answer":["D"],"explanation":"流行病学的基本任务包括探索病因、制定防制对策、评价防治效果等，而诊断疾病是临床医学的任务，因此正确选项是D。","page":17,"endPage":17,"category":"医学基础","sourceNote":""},{"id":"single-99","type":"single","number":99,"title":"下列哪项不是流行病学的特征","options":[{"key":"A","text":"群体特征"},{"key":"B","text":"对比的特征"},{"key":"C","text":"概率论与数理统计学的特征"},{"key":"D","text":"个体特征"}],"answer":["D"],"explanation":"流行病学的特征包括群体特征、对比的特征、概率论与数理统计学的特征等，而个体特征不是流行病学的主要特征，因此正确选项是D。","page":17,"endPage":17,"category":"医学基础","sourceNote":""},{"id":"single-100","type":"single","number":100,"title":"下列哪项不是药物的分类依据","options":[{"key":"A","text":"是否需要医生开具处方"},{"key":"B","text":"药物成分与制作工艺"},{"key":"C","text":"药物的颜色"},{"key":"D","text":"药物作用途径"}],"answer":["C"],"explanation":"药物的分类依据包括是否需要医生开具处方、药物成分与制作工艺、药物作用途径等，而药物的颜色不是分类依据，因此正确选项是C。","page":17,"endPage":17,"category":"医学基础","sourceNote":""},{"id":"single-101","type":"single","number":101,"title":"下列哪项不是药物的基本作用","options":[{"key":"A","text":"兴奋作用"},{"key":"B","text":"抑制作用"},{"key":"C","text":"中和作用"},{"key":"D","text":"局部作用"}],"answer":["C"],"explanation":"药物的基本作用包括兴奋作用、抑制作用、局部作用等，而中和作用不是药物的基本作用，因此正确选项是C。","page":17,"endPage":18,"category":"医学基础","sourceNote":""},{"id":"single-102","type":"single","number":102,"title":"下列哪项不是慢性病的主要危害","options":[{"key":"A","text":"引起生理功能下降"},{"key":"B","text":"影响劳动能力和生活质量"},{"key":"C","text":"增加社会和家庭的经济负担"},{"key":"D","text":"提高免疫力"}],"answer":["D"],"explanation":"慢性病的主要危害包括引起生理功能下降、影响劳动能力和生活质量、增加社会和家庭的经济负担等，而提高免疫力不是慢性病的危害，因此正确选项是D。","page":18,"endPage":18,"category":"医学基础","sourceNote":""},{"id":"single-103","type":"single","number":103,"title":"下列哪项不是药物的不良反应","options":[{"key":"A","text":"副作用"},{"key":"B","text":"毒性反应"},{"key":"C","text":"后遗反应"},{"key":"D","text":"治疗作用"}],"answer":["D"],"explanation":"药物的不良反应包括副作用、毒性反应、后遗反应等，而治疗作用是药物的预期效果，因此正确选项是D。","page":18,"endPage":18,"category":"医学基础","sourceNote":""},{"id":"single-104","type":"single","number":104,"title":"下列哪项不是健康生活方式的组成部分","options":[{"key":"A","text":"合理膳食"},{"key":"B","text":"适量运动"},{"key":"C","text":"戒烟限酒"},{"key":"D","text":"长时间久坐"}],"answer":["D"],"explanation":"健康生活方式包括合理膳食、适量运动、戒烟限酒等，而长时间久坐不利于健康，因此正确选项是D。","page":18,"endPage":18,"category":"医学基础","sourceNote":""},{"id":"single-105","type":"single","number":105,"title":"职业性有害因素不包括以下哪一项","options":[{"key":"A","text":"化学因素"},{"key":"B","text":"物理因素"},{"key":"C","text":"生物因素"},{"key":"D","text":"社会因素"}],"answer":["D"],"explanation":"职业性有害因素包括化学、物理、生物因素，但不包含社会因素。","page":18,"endPage":18,"category":"职业健康","sourceNote":""},{"id":"single-106","type":"single","number":106,"title":"下列哪种气体不属于窒息性气体","options":[{"key":"A","text":"一氧化碳"},{"key":"B","text":"硫化氢"},{"key":"C","text":"氧气"},{"key":"D","text":"氰化氢"}],"answer":["C"],"explanation":"窒息性气体如一氧化碳、硫化氢、氰化氢等可以导致缺氧，而氧气是维持生命必需的，不是窒息性气体。","page":18,"endPage":18,"category":"职业健康","sourceNote":""},{"id":"single-107","type":"single","number":107,"title":"我国职业病分类和目录是在哪一年发布的","options":[{"key":"A","text":"2010 年"},{"key":"B","text":"2013 年"},{"key":"C","text":"2016 年"},{"key":"D","text":"2019 年"}],"answer":["B"],"explanation":"我国的职业病分类和目录是在2013 年发布的。","page":18,"endPage":19,"category":"职业健康","sourceNote":""},{"id":"single-108","type":"single","number":108,"title":"职业病的特点之一是病因明确，通常是因为接触了什么","options":[{"key":"A","text":"高温环境"},{"key":"B","text":"低气压环境"},{"key":"C","text":"职业性有害因素"},{"key":"D","text":"强噪声"}],"answer":["C"],"explanation":"职业病的主要特点是病因明确，通常是由于劳动者在职业活动中接触了粉尘、放射性物质和其他有毒、有害因素。","page":19,"endPage":19,"category":"职业健康","sourceNote":""},{"id":"single-109","type":"single","number":109,"title":"一般心理问题的情绪反应持续时间通常为多少","options":[{"key":"A","text":"未超过1 个月"},{"key":"B","text":"2-3 个月"},{"key":"C","text":"3-6 个月"},{"key":"D","text":"6 个月以上"}],"answer":["A"],"explanation":"一般心理问题的情绪反应持续时间通常不超过1 个月，或间断持续2 个月。","page":19,"endPage":19,"category":"心理健康","sourceNote":""},{"id":"single-110","type":"single","number":110,"title":"严重心理问题的情绪反应强度如何","options":[{"key":"A","text":"反应轻微"},{"key":"B","text":"反应较强，难以平息"},{"key":"C","text":"反应适中"},{"key":"D","text":"反应短暂"}],"answer":["B"],"explanation":"严重心理问题的情绪反应强烈，难以平息，痛苦体验较为深刻。","page":19,"endPage":19,"category":"心理健康","sourceNote":""},{"id":"single-111","type":"single","number":111,"title":"严重心理问题对当事人的社会功能有何影响","options":[{"key":"A","text":"没有影响"},{"key":"B","text":"有一定损害"},{"key":"C","text":"完全丧失"},{"key":"D","text":"提高社会功能"}],"answer":["B"],"explanation":"严重心理问题会对当事人的职业工作、人际关系等产生一定程度的损害，造成不良后果。","page":19,"endPage":19,"category":"心理健康","sourceNote":""},{"id":"single-112","type":"single","number":112,"title":"下列哪项不是工伤认定的情形","options":[{"key":"A","text":"在工作时间和工作场所内因工作原因受到事故伤害"},{"key":"B","text":"在上下班途中受到非本人主要责任的交通事故伤害"},{"key":"C","text":"故意犯罪导致的伤害"},{"key":"D","text":"因工外出期间由于工作原因受到伤害"}],"answer":["C"],"explanation":"根据《工伤保险条例》，故意犯罪导致的伤害不属于工伤认定范围。","page":19,"endPage":19,"category":"职业健康","sourceNote":""},{"id":"single-113","type":"single","number":113,"title":"心境障碍的主要表现是什么","options":[{"key":"A","text":"明显而持久的心境高涨或低落"},{"key":"B","text":"严重的身体疼痛"},{"key":"C","text":"认知功能下降"},{"key":"D","text":"运动协调障碍"}],"answer":["A"],"explanation":"心境障碍是以明显而持久的心境高涨或低落为主的精神障碍。","page":19,"endPage":20,"category":"心理健康","sourceNote":""},{"id":"single-114","type":"single","number":114,"title":"躁狂发作的典型症状不包括以下哪一项","options":[{"key":"A","text":"心境高涨"},{"key":"B","text":"思维奔逸"},{"key":"C","text":"行为莽撞"},{"key":"D","text":"语言迟缓"}],"answer":["D"],"explanation":"躁狂发作的典型症状包括心境高涨、思维奔逸、行为莽撞等，而不包括语言迟缓。","page":20,"endPage":20,"category":"心理健康","sourceNote":""},{"id":"single-115","type":"single","number":115,"title":"抑郁发作的典型症状不包括以下哪一项","options":[{"key":"A","text":"心境低落"},{"key":"B","text":"思维缓慢"},{"key":"C","text":"语言动作减少"},{"key":"D","text":"精力过剩"}],"answer":["D"],"explanation":"抑郁发作的典型症状包括心境低落、思维缓慢、语言动作减少等，而不包括精力过剩。","page":20,"endPage":20,"category":"心理健康","sourceNote":""},{"id":"single-116","type":"single","number":116,"title":"恐怖症的主要表现是什么","options":[{"key":"A","text":"内心紧张不安"},{"key":"B","text":"对外界客体或处境的过分和不合理惧怕"},{"key":"C","text":"强迫性思维"},{"key":"D","text":"幻觉"}],"answer":["B"],"explanation":"恐怖症的主要表现为对某些外界客体或处境的过分和不合理惧怕。","page":20,"endPage":20,"category":"心理健康","sourceNote":""},{"id":"single-117","type":"single","number":117,"title":"下列哪项不是认知疗法的特点","options":[{"key":"A","text":"救助者与咨询师是合作关系"},{"key":"B","text":"强调改变认知"},{"key":"C","text":"适用于所有心理问题"},{"key":"D","text":"强调家庭作业的作用"}],"answer":["C"],"explanation":"认知疗法并不适用于所有心理问题，而是针对具体和结构性目标问题的短期治疗。","page":20,"endPage":20,"category":"心理健康","sourceNote":""},{"id":"single-118","type":"single","number":118,"title":"正念疗法的核心是什么","options":[{"key":"A","text":"放松训练"},{"key":"B","text":"行为矫正"},{"key":"C","text":"有意识地觉察当下"},{"key":"D","text":"情绪调节"}],"answer":["C"],"explanation":"正念疗法的核心是有意识地觉察当下，强调不带评判地关注当下的体验。","page":20,"endPage":20,"category":"心理健康","sourceNote":""},{"id":"single-119","type":"single","number":119,"title":"下列哪项不是老年人心理健康维护的重点","options":[{"key":"A","text":"认识老年期"},{"key":"B","text":"培养兴趣"},{"key":"C","text":"鼓励社交活动"},{"key":"D","text":"增加体力劳动"}],"answer":["D"],"explanation":"增加体力劳动不是老年人心理健康维护的重点，反而应适度锻炼，避免过度劳累。","page":20,"endPage":21,"category":"心理健康","sourceNote":""},{"id":"single-120","type":"single","number":120,"title":"心理健康的标准之一是能够保持人格的什么","options":[{"key":"A","text":"多变性"},{"key":"B","text":"不稳定性"},{"key":"C","text":"完整性"},{"key":"D","text":"分裂性"}],"answer":["C"],"explanation":"心理健康的标准之一是能够保持人格的完整性。","page":21,"endPage":21,"category":"心理健康","sourceNote":""},{"id":"single-121","type":"single","number":121,"title":"家庭心理健康的核心是什么","options":[{"key":"A","text":"家庭成员的个人成就"},{"key":"B","text":"家庭成员的心理健康和和谐关系"},{"key":"C","text":"家庭的经济状况"},{"key":"D","text":"家庭的社会地位"}],"answer":["B"],"explanation":"家庭心理健康的核心是家庭成员的心理健康和家庭成员之间的和谐关系。","page":21,"endPage":21,"category":"心理健康","sourceNote":""},{"id":"single-122","type":"single","number":122,"title":"学校心理健康与心理卫生的目标是什么","options":[{"key":"A","text":"提高学生的考试成绩"},{"key":"B","text":"促进所有学生的心理健康水平"},{"key":"C","text":"增强学校的声誉"},{"key":"D","text":"减少学生的行为问题"}],"answer":["B"],"explanation":"学校心理健康与心理卫生的目标是促进所有学生的心理健康水平。","page":21,"endPage":21,"category":"心理健康","sourceNote":""},{"id":"single-123","type":"single","number":123,"title":"社区心理健康与心理卫生的主要人群不包括以下哪一类","options":[{"key":"A","text":"儿童"},{"key":"B","text":"青少年"},{"key":"C","text":"女性"},{"key":"D","text":"宠物"}],"answer":["D"],"explanation":"社区心理健康与心理卫生的主要人群包括儿童、青少年、女性、老年群体等，但不包括宠物。","page":21,"endPage":21,"category":"心理健康","sourceNote":""},{"id":"single-124","type":"single","number":124,"title":"营养学主要研究的是什么","options":[{"key":"A","text":"食品中的有害成分"},{"key":"B","text":"食品中的有益成分及其对人体的影响"},{"key":"C","text":"食品的加工过程"},{"key":"D","text":"食品的销售策略"}],"answer":["B"],"explanation":"营养学主要研究食物中有益成分及其对人体健康的影响。","page":21,"endPage":21,"category":"营养与食品","sourceNote":""},{"id":"single-125","type":"single","number":125,"title":"食品卫生学的主要研究方向是什么","options":[{"key":"A","text":"食品中的营养成分"},{"key":"B","text":"食品中的有害成分及其防控措施"},{"key":"C","text":"食品的营销策略"},{"key":"D","text":"食品的包装设计"}],"answer":["B"],"explanation":"食品卫生学主要研究食品中的有害成分及其防控措施，以提高食品安全水平。","page":21,"endPage":22,"category":"营养与食品","sourceNote":""},{"id":"single-126","type":"single","number":126,"title":"宏量营养素包括哪些","options":[{"key":"A","text":"维生素"},{"key":"B","text":"矿物质"},{"key":"C","text":"蛋白质、碳水化合物、脂类"},{"key":"D","text":"膳食纤维"}],"answer":["C"],"explanation":"宏量营养素包括蛋白质、碳水化合物和脂类，这些营养素可以提供能量。","page":22,"endPage":22,"category":"营养与食品","sourceNote":""},{"id":"single-127","type":"single","number":127,"title":"微量营养素包括哪些","options":[{"key":"A","text":"蛋白质"},{"key":"B","text":"碳水化合物"},{"key":"C","text":"矿物质和维生素"},{"key":"D","text":"脂类"}],"answer":["C"],"explanation":"微量营养素包括矿物质和维生素，人体对它们的需求量较少。","page":22,"endPage":22,"category":"营养与食品","sourceNote":""},{"id":"single-128","type":"single","number":128,"title":"常量元素是指在体内含量大于多少的矿物元素","options":[{"key":"A","text":"0.001%"},{"key":"B","text":"0.01%"},{"key":"C","text":"0.1%"},{"key":"D","text":"1%"}],"answer":["B"],"explanation":"常量元素是指在体内含量大于0.01%的矿物元素。","page":22,"endPage":22,"category":"营养与食品","sourceNote":""},{"id":"single-129","type":"single","number":129,"title":"微量元素是指在体内含量小于多少的矿物元素","options":[{"key":"A","text":"0.001%"},{"key":"B","text":"0.01%"},{"key":"C","text":"0.1%"},{"key":"D","text":"1%"}],"answer":["B"],"explanation":"微量元素是指在体内含量小于0.01%的矿物元素。","page":22,"endPage":22,"category":"营养与食品","sourceNote":""},{"id":"single-130","type":"single","number":130,"title":"脂溶性维生素包括哪些","options":[{"key":"A","text":"维生素A、D、E、K"},{"key":"B","text":"维生素B 族"},{"key":"C","text":"维生素C"},{"key":"D","text":"叶酸"}],"answer":["A"],"explanation":"脂溶性维生素包括维生素A、D、E、K，而维生素B 族和维生素C 是水溶性维生素。","page":22,"endPage":22,"category":"营养与食品","sourceNote":""},{"id":"single-131","type":"single","number":131,"title":"营养学主要研究的是什么","options":[{"key":"A","text":"食品中可能威胁人体健康的有害因素"},{"key":"B","text":"人体摄取和利用食物中的营养物质以维持、促进健康"},{"key":"C","text":"食品加工过程中的卫生控制管理"},{"key":"D","text":"食品中的污染物来源和基本控制措施"}],"answer":["B"],"explanation":"营养学是研究食物中对人体有益的成分及人体摄取和利用这些成分以维持、促进健康的规律和机制。","page":22,"endPage":23,"category":"营养与食品","sourceNote":""},{"id":"single-132","type":"single","number":132,"title":"下列哪一项不是微量营养素","options":[{"key":"A","text":"碳水化合物"},{"key":"B","text":"维生素C"},{"key":"C","text":"铁"},{"key":"D","text":"锌"}],"answer":["A"],"explanation":"碳水化合物属于宏量营养素，而维生素C、铁和锌都属于微量营养素。","page":23,"endPage":23,"category":"营养与食品","sourceNote":""},{"id":"single-133","type":"single","number":133,"title":"蛋白质在人体内的主要功能是什么","options":[{"key":"A","text":"提供能量"},{"key":"B","text":"构成细胞和组织"},{"key":"C","text":"帮助脂溶性维生素吸收"},{"key":"D","text":"提供饱腹感"}],"answer":["B"],"explanation":"蛋白质是构成细胞和组织的主要成分，参与人体的新陈代谢，维持正常生理功能。","page":23,"endPage":23,"category":"营养与食品","sourceNote":""},{"id":"single-134","type":"single","number":134,"title":"下列哪种矿物质被称为“智力元素”","options":[{"key":"A","text":"钙"},{"key":"B","text":"铁"},{"key":"C","text":"碘"},{"key":"D","text":"锌"}],"answer":["C"],"explanation":"碘通过甲状腺素对人体产生作用，甲状腺素对儿童的生长发育和智力发展至关重要，因此碘被称为“智力元素”。","page":23,"endPage":23,"category":"营养与食品","sourceNote":""},{"id":"single-135","type":"single","number":135,"title":"下列哪种维生素具有抗氧化作用并能促进胶原合成","options":[{"key":"A","text":"维生素A"},{"key":"B","text":"维生素C"},{"key":"C","text":"维生素D"},{"key":"D","text":"维生素E"}],"answer":["B"],"explanation":"维生素C 是一种具有抗氧化作用的维生素，能够促进胶原合成，增强机体抵抗力。","page":23,"endPage":23,"category":"营养与食品","sourceNote":""},{"id":"single-136","type":"single","number":136,"title":"下列哪种食物富含不饱和脂肪酸","options":[{"key":"A","text":"椰子油"},{"key":"B","text":"牛肉"},{"key":"C","text":"大豆油"},{"key":"D","text":"猪肉"}],"answer":["C"],"explanation":"大豆油主要由不饱和脂肪酸构成，有助于降低血脂，预防心血管疾病。","page":23,"endPage":23,"category":"营养与食品","sourceNote":""},{"id":"single-137","type":"single","number":137,"title":"下列哪种维生素缺乏会导致夜盲症","options":[{"key":"A","text":"维生素A"},{"key":"B","text":"维生素B1"},{"key":"C","text":"维生素C"},{"key":"D","text":"维生素D"}],"answer":["A"],"explanation":"维生素A 对于维持正常视力非常重要，缺乏维生素A 会导致夜盲症。","page":23,"endPage":24,"category":"营养与食品","sourceNote":""},{"id":"single-138","type":"single","number":138,"title":"下列哪种食物是膳食纤维的良好来源","options":[{"key":"A","text":"精白米"},{"key":"B","text":"苹果"},{"key":"C","text":"红烧肉"},{"key":"D","text":"鸡蛋"}],"answer":["B"],"explanation":"苹果含有丰富的膳食纤维，有助于促进肠道蠕动，预防便秘。","page":24,"endPage":24,"category":"营养与食品","sourceNote":""},{"id":"single-139","type":"single","number":139,"title":"下列哪种食物富含优质蛋白质","options":[{"key":"A","text":"白面包"},{"key":"B","text":"红薯"},{"key":"C","text":"鸡胸肉"},{"key":"D","text":"巧克力"}],"answer":["C"],"explanation":"鸡胸肉富含优质蛋白质，易于消化吸收，适合各类人群食用。","page":24,"endPage":24,"category":"营养与食品","sourceNote":""},{"id":"single-140","type":"single","number":140,"title":"心理健康的标准不包括以下哪一项","options":[{"key":"A","text":"认知合理"},{"key":"B","text":"情绪稳定"},{"key":"C","text":"行为恰当"},{"key":"D","text":"经济独立"}],"answer":["D"],"explanation":"心理健康的标准通常涵盖认知、情绪、行为和社会适应等方面。文档中提到的心理健康标准包括认知合理、情绪稳定、行为恰当、人际和谐、适应变化等。经济独立虽然对个人的自尊心和生活质量有影响，但并不是心理健康直接的标准之一。","page":24,"endPage":24,"category":"心理健康","sourceNote":""},{"id":"single-141","type":"single","number":141,"title":"下列哪一项不是营养学与食品卫生学的区别","options":[{"key":"A","text":"研究对象不同"},{"key":"B","text":"研究目的不同"},{"key":"C","text":"研究方法相同"},{"key":"D","text":"研究侧重点不同"}],"answer":["C"],"explanation":"营养学和食品卫生学的研究对象和目的是不同的。营养学主要研究食物中有益成分与健康的关系，目的是维持或促进健康；而食品卫生学则研究食物中有害成分与健康的关系，目的是防止对人体健康的危害。尽管两者都涉及食物与健康的关系，但它们的研究方法并不完全相同，营养学更侧重于营养成分的摄入和利用，而食品卫生学更关注食品安全和防控措施。","page":24,"endPage":24,"category":"营养与食品","sourceNote":""},{"id":"single-142","type":"single","number":142,"title":"室内空气污染的主要来源不包括以下哪一项","options":[{"key":"A","text":"室外大气污染"},{"key":"B","text":"建筑物自身污染"},{"key":"C","text":"室内燃烧或加热"},{"key":"D","text":"自然通风"}],"answer":["D"],"explanation":"室内空气污染的来源主要包括室外大气污染、建筑物自身污染（如装修材料释放的有害物质）、室内燃烧或加热活动、家用化学品的使用、宠物、以及家用电器等。自然通风是减少室内空气污染的有效措施，而不是污染源。","page":24,"endPage":25,"category":"职业健康","sourceNote":""},{"id":"single-143","type":"single","number":143,"title":"下列哪一项不属于职业病的诊断依据","options":[{"key":"A","text":"患者的职业史"},{"key":"B","text":"职业病危害因素接触史"},{"key":"C","text":"临床表现及实验室检查结果"},{"key":"D","text":"患者的家庭病史"}],"answer":["D"],"explanation":"职业病的诊断依据主要包括患者的职业史、职业病危害因素接触史、工作场所的职业病危害因素情况调查、临床表现以及实验室辅助检查结果等。患者的家庭病史虽然对某些遗传性疾病有参考价值，但并不是职业病诊断的直接依据。","page":25,"endPage":25,"category":"职业健康","sourceNote":""},{"id":"single-144","type":"single","number":144,"title":"工伤认定的情形不包括以下哪一项","options":[{"key":"A","text":"在工作时间和工作场所内因工作原因受到事故伤害"},{"key":"B","text":"在上下班途中受到非本人主要责任的交通事故伤害"},{"key":"C","text":"因个人原因在工作时间外发生的意外事故"},{"key":"D","text":"在抢险救灾等维护国家利益活动中受到伤害"}],"answer":["C"],"explanation":"根据《工伤保险条例》，工伤认定的情形包括在工作时间和工作场所内因工作原因受到事故伤害、在上下班途中受到非本人主要责任的交通事故伤害、在抢险救灾等维护国家利益活动中受到伤害等。因个人原因在工作时间外发生的意外事故不属于工伤认定的范围。","page":25,"endPage":25,"category":"职业健康","sourceNote":""},{"id":"single-145","type":"single","number":145,"title":"下列哪一项不是信息产业常见职业病的危害因素","options":[{"key":"A","text":"有机溶剂和酸碱物质"},{"key":"B","text":"焊接产生的锡及化合物"},{"key":"C","text":"噪声和非电离辐射"},{"key":"D","text":"长时间站立"}],"answer":["D"],"explanation":"信息产业常见职业病的危害因素主要包括化学因素（如有机溶剂、酸碱物质、焊接产生的锡及化合物等）、物理因素（如噪声、非电离辐射、电离辐射等）以及其他因素（如不良工作体位、单调重复作业等）。长时间站立虽然可能导致骨骼肌肉系统疾病，但它并不是信息产业特有的职业病危害因素。","page":25,"endPage":25,"category":"职业健康","sourceNote":""},{"id":"single-146","type":"single","number":146,"title":"下列哪一项不属于劳动防护用品的选用原则","options":[{"key":"A","text":"根据工作场所有害因素选择"},{"key":"B","text":"根据作业类别选择"},{"key":"C","text":"根据个人喜好选择"},{"key":"D","text":"根据有害物对人体作用部位选择"}],"answer":["C"],"explanation":"劳动防护用品的选用原则应基于工作场所有害因素、作业类别、有害物对人体作用的部位、工作场所有害因素的测定值以及人体尺寸等因素。个人喜好并不是选择劳动防护用品的科学依据，因为防护用品的选择必须确保能够有效保护劳动者免受职业危害。","page":25,"endPage":25,"category":"职业健康","sourceNote":""},{"id":"single-147","type":"single","number":147,"title":"劳动法的首要作用是什么","options":[{"key":"A","text":"调节市场供求"},{"key":"B","text":"保护劳动者合法权益"},{"key":"C","text":"提高企业利润"},{"key":"D","text":"规范企业内部管理"}],"answer":["B"],"explanation":"劳动法的首要作用是保护劳动者合法权益，调动劳动者的生产积极性和创造性。","page":25,"endPage":26,"category":"劳动法律","sourceNote":""},{"id":"single-148","type":"single","number":148,"title":"下列哪项不是劳动法的基本价值取向","options":[{"key":"A","text":"侧重保护劳动者"},{"key":"B","text":"侧重保护资本者"},{"key":"C","text":"强制性规范与任意性规范相结合"},{"key":"D","text":"实体法和程序法相统一"}],"answer":["B"],"explanation":"劳动法的基本价值取向侧重于保护劳动者，而非资本者。","page":26,"endPage":26,"category":"劳动法律","sourceNote":""},{"id":"single-149","type":"single","number":149,"title":"劳动合同应当以什么形式订立","options":[{"key":"A","text":"口头协议"},{"key":"B","text":"书面形式"},{"key":"C","text":"电子通讯"},{"key":"D","text":"第三方见证"}],"answer":["B"],"explanation":"劳动合同应以书面形式订立，并必须具备法定条款。","page":26,"endPage":26,"category":"劳动法律","sourceNote":""},{"id":"single-150","type":"single","number":150,"title":"劳动者在同一用人单位连续工作满多少年以上，可以要求签订无固定期限的劳动合同","options":[{"key":"A","text":"5 年"},{"key":"B","text":"8 年"},{"key":"C","text":"10 年"},{"key":"D","text":"15 年"}],"answer":["C"],"explanation":"连续工作满十年以上，如果劳动者提出订立无固定期限的劳动合同，应当订立。","page":26,"endPage":26,"category":"劳动法律","sourceNote":""},{"id":"single-151","type":"single","number":151,"title":"试用期最长不得超过几个月","options":[{"key":"A","text":"1 个月"},{"key":"B","text":"3 个月"},{"key":"C","text":"6 个月"},{"key":"D","text":"12 个月"}],"answer":["C"],"explanation":"试用期最长不得超过六个月。","page":26,"endPage":26,"category":"劳动法律","sourceNote":""},{"id":"single-152","type":"single","number":152,"title":"在哪些情况下，用人单位不得单方面解除劳动合同","options":[{"key":"A","text":"劳动者严重违反纪律"},{"key":"B","text":"劳动者被依法追究刑事责任"},{"key":"C","text":"女职工在孕期、产期、哺乳期内"},{"key":"D","text":"劳动者不能胜任工作"}],"answer":["C"],"explanation":"在女职工在孕期、产期、哺乳期内的情况下，用人单位不得单方面解除劳动合同。","page":26,"endPage":26,"category":"劳动法律","sourceNote":""},{"id":"single-153","type":"single","number":153,"title":"最低工资是指什么","options":[{"key":"A","text":"用人单位自主确定的最低报酬"},{"key":"B","text":"劳动者自己设定的最低期望值"},{"key":"C","text":"法律规定的最低劳动报酬"},{"key":"D","text":"行业协会建议的最低标准"}],"answer":["C"],"explanation":"最低工资是法律规定的最低劳动报酬。","page":26,"endPage":26,"category":"劳动法律","sourceNote":""},{"id":"single-154","type":"single","number":154,"title":"劳动者每日工作时间不得超过多少小时","options":[{"key":"A","text":"6 小时"},{"key":"B","text":"8 小时"},{"key":"C","text":"10 小时"},{"key":"D","text":"12 小时"}],"answer":["B"],"explanation":"劳动者每日工作时间不超过八小时。","page":26,"endPage":27,"category":"劳动法律","sourceNote":""},{"id":"single-155","type":"single","number":155,"title":"加班工资的支付比例为正常工资的多少倍","options":[{"key":"A","text":"1.5 倍"},{"key":"B","text":"2 倍"},{"key":"C","text":"3 倍"},{"key":"D","text":"4 倍"}],"answer":["C"],"explanation":"法定休假日安排劳动者工作的，支付不低于工资的百分之三百的工资报酬。","page":27,"endPage":27,"category":"劳动法律","sourceNote":"题干泛称“加班”，而原解析仅解释法定休假日工作的工资比例，适用情形表述不完整。"},{"id":"single-156","type":"single","number":156,"title":"劳动争议发生后，首先可以通过什么方式解决","options":[{"key":"A","text":"诉讼"},{"key":"B","text":"仲裁"},{"key":"C","text":"协商"},{"key":"D","text":"调解"}],"answer":["C"],"explanation":"劳动争议发生后，首先可以通过协商的方式解决。","page":27,"endPage":27,"category":"劳动法律","sourceNote":""},{"id":"single-157","type":"single","number":157,"title":"集体合同由谁代表职工与企业签订","options":[{"key":"A","text":"个人职工"},{"key":"B","text":"企业法定代表人"},{"key":"C","text":"工会"},{"key":"D","text":"政府部门"}],"answer":["C"],"explanation":"集体合同由工会代表职工与企业签订。","page":27,"endPage":27,"category":"劳动法律","sourceNote":""},{"id":"single-158","type":"single","number":158,"title":"劳动者享有休息和休假的权利，每周至少休息几天","options":[{"key":"A","text":"1 天"},{"key":"B","text":"2 天"},{"key":"C","text":"3 天"},{"key":"D","text":"4 天"}],"answer":["A"],"explanation":"每周至少休息一日。","page":27,"endPage":27,"category":"劳动法律","sourceNote":""},{"id":"single-159","type":"single","number":159,"title":"劳动者连续工作一年以上，享受哪种假期","options":[{"key":"A","text":"事假"},{"key":"B","text":"病假"},{"key":"C","text":"带薪年休假"},{"key":"D","text":"产假"}],"answer":["C"],"explanation":"劳动者连续工作一年以上，享受带薪年休假。","page":27,"endPage":27,"category":"劳动法律","sourceNote":""},{"id":"single-160","type":"single","number":160,"title":"下列哪项不是劳动者的权利","options":[{"key":"A","text":"平等就业权"},{"key":"B","text":"劳动报酬权"},{"key":"C","text":"企业经营决策权"},{"key":"D","text":"休息权"}],"answer":["C"],"explanation":"企业经营决策权不是劳动者的权利。","page":27,"endPage":28,"category":"劳动法律","sourceNote":""},{"id":"single-161","type":"single","number":161,"title":"劳动者患病或者非因工负伤，在医疗期内，用人单位有义务做什么","options":[{"key":"A","text":"解除劳动合同"},{"key":"B","text":"减少工资"},{"key":"C","text":"安排其他工作"},{"key":"D","text":"依法支付工资"}],"answer":["D"],"explanation":"用人单位有义务依法支付工资。","page":28,"endPage":28,"category":"劳动法律","sourceNote":""},{"id":"single-162","type":"single","number":162,"title":"劳动安全卫生管理制度的建立是由谁负责","options":[{"key":"A","text":"劳动者"},{"key":"B","text":"用人单位"},{"key":"C","text":"劳动行政部门"},{"key":"D","text":"工会"}],"answer":["B"],"explanation":"用人单位有义务建立、健全劳动安全卫生管理制度。","page":28,"endPage":28,"category":"劳动法律","sourceNote":""},{"id":"single-163","type":"single","number":163,"title":"劳动者死亡后，其遗属可以享受什么待遇","options":[{"key":"A","text":"继续原岗位工作"},{"key":"B","text":"重新就业帮助"},{"key":"C","text":"遗属津贴"},{"key":"D","text":"一次性补助"}],"answer":["C"],"explanation":"劳动者死亡后，其遗属可以享受遗属津贴。","page":28,"endPage":28,"category":"劳动法律","sourceNote":""},{"id":"single-164","type":"single","number":164,"title":"健康档案是指什么","options":[{"key":"A","text":"个人在全生命周期中形成的与自身健康相关的各种重要活动或事件的历史记录"},{"key":"B","text":"仅限于医院内的医疗记录"},{"key":"C","text":"社区居民的基本信息表"},{"key":"D","text":"家族病史的汇总"}],"answer":["A"],"explanation":"健康档案是个人在全生命周期中形成的与自身健康相关的各种重要活动或事件的历史记录，包括基本健康状况、过往疾病、治疗情况、家族史、生活环境等。","page":28,"endPage":28,"category":"健康档案","sourceNote":""},{"id":"single-165","type":"single","number":165,"title":"健康档案的主要用途不包括以下哪一项","options":[{"key":"A","text":"疾病诊治的参考"},{"key":"B","text":"健康管理的依据"},{"key":"C","text":"科学研究的素材"},{"key":"D","text":"个人财务记录"}],"answer":["D"],"explanation":"健康档案的主要用途包括疾病诊治的参考、健康管理的依据、科学研究的素材等，但不包括个人财务记录。","page":28,"endPage":28,"category":"健康档案","sourceNote":""},{"id":"single-166","type":"single","number":166,"title":"电子健康档案的特点是什么","options":[{"key":"A","text":"无法异地访问"},{"key":"B","text":"高共享度，可异地多端口访问"},{"key":"C","text":"只能由医生使用"},{"key":"D","text":"不能用于公共卫生预警"}],"answer":["B"],"explanation":"电子健康档案具有高共享度，可以异地多端口访问，方便不同医疗机构之间的信息共享，有助于提高医疗服务效率。","page":28,"endPage":29,"category":"健康档案","sourceNote":""},{"id":"single-167","type":"single","number":167,"title":"健康档案建立时必须遵循的原则是什么","options":[{"key":"A","text":"仅凭电话沟通"},{"key":"B","text":"与服务对象当面沟通，及时厘清不确定的问题"},{"key":"C","text":"不需要复核确认"},{"key":"D","text":"跨越逻辑采集信息"}],"answer":["B"],"explanation":"健康档案建立时必须与服务对象当面沟通，及时厘清不确定的问题，并设置复核、确认工作等环节，确保信息的客观性和完整性。","page":29,"endPage":29,"category":"健康档案","sourceNote":""},{"id":"single-168","type":"single","number":168,"title":"健康档案使用的专业性体现在哪里","options":[{"key":"A","text":"随意更改档案内容"},{"key":"B","text":"坚守“助理”职业定位，做好“配角”"},{"key":"C","text":"不学习卫生健康专业知识"},{"key":"D","text":"越位处理医疗问题"}],"answer":["B"],"explanation":"健康档案使用的专业性体现在坚守“助理”职业定位，做好“配角”，不越位处理医疗问题，同时积极学习卫生健康专业知识，拓展专业技能。","page":29,"endPage":29,"category":"健康档案","sourceNote":""},{"id":"single-169","type":"single","number":169,"title":"健康档案维护的私密性要求是什么","options":[{"key":"A","text":"公开所有信息"},{"key":"B","text":"尊重个人隐私权，严格执行管理制度"},{"key":"C","text":"随意分享档案内容"},{"key":"D","text":"不定期更新"}],"answer":["B"],"explanation":"健康档案维护的私密性要求尊重个人隐私权，严格执行管理制度，确保档案信息的安全和保密。","page":29,"endPage":29,"category":"健康档案","sourceNote":""},{"id":"single-170","type":"single","number":170,"title":"健康档案管理的基本要求之一是什么","options":[{"key":"A","text":"无需与职业医务人员分工合作"},{"key":"B","text":"不与社群人员保持有效沟通"},{"key":"C","text":"遵循医疗文书管理规章制度"},{"key":"D","text":"不保护信息系统数据安全"}],"answer":["C"],"explanation":"健康档案管理的基本要求之一是遵循医疗文书管理规章制度，确保档案的规范性和合法性。","page":29,"endPage":29,"category":"健康档案","sourceNote":""},{"id":"single-171","type":"single","number":171,"title":"健康档案的服务对象包括哪些人群","options":[{"key":"A","text":"仅限于0～6 岁儿童"},{"key":"B","text":"仅限于老年人"},{"key":"C","text":"辖区内常住居民（居住半年以上的户籍/非户籍）"},{"key":"D","text":"仅限于慢性病患者"}],"answer":["C"],"explanation":"健康档案的服务对象包括辖区内常住居民（居住半年以上的户籍/非户籍），涵盖各类人群，如0～6 岁儿童、孕产妇、老年人、慢性病患者等。","page":29,"endPage":30,"category":"健康档案","sourceNote":""},{"id":"single-172","type":"single","number":172,"title":"健康档案建立时需要采集哪些信息","options":[{"key":"A","text":"仅限于个人基本信息"},{"key":"B","text":"仅限于疾病史信息"},{"key":"C","text":"个人基本信息、疾病史信息、家族史信息、健康风险信息"},{"key":"D","text":"仅限于家族史信息"}],"answer":["C"],"explanation":"健康档案建立时需要采集个人基本信息、疾病史信息、家族史信息、健康风险信息等，确保档案内容的全面性和准确性。","page":30,"endPage":30,"category":"健康档案","sourceNote":""},{"id":"single-173","type":"single","number":173,"title":"健康档案管理系统的基本功能不包括以下哪一项","options":[{"key":"A","text":"用户注册"},{"key":"B","text":"检索社群成员身份信息"},{"key":"C","text":"浏览社群成员健康档案信息"},{"key":"D","text":"自动诊断疾病"}],"answer":["D"],"explanation":"健康档案管理系统的基本功能包括用户注册、检索社群成员身份信息、浏览社群成员健康档案信息等，但不包括自动诊断疾病。","page":30,"endPage":30,"category":"健康档案","sourceNote":""},{"id":"single-174","type":"single","number":174,"title":"健康档案使用的主要场景不包括以下哪一项","options":[{"key":"A","text":"就医协助"},{"key":"B","text":"健康探视"},{"key":"C","text":"社群健康评估"},{"key":"D","text":"自行修改档案内容"}],"answer":["D"],"explanation":"健康档案使用的主要场景包括就医协助、健康探视、社群健康评估等，但不允许自行修改档案内容。","page":30,"endPage":30,"category":"健康档案","sourceNote":""},{"id":"single-175","type":"single","number":175,"title":"健康档案使用时调取档案的流程是什么","options":[{"key":"A","text":"未经授权直接调取"},{"key":"B","text":"经授权管理人员同意，填写调取单/相关登记手续"},{"key":"C","text":"无需检查完整性"},{"key":"D","text":"随意借出档案"}],"answer":["B"],"explanation":"健康档案使用时调取档案的流程是经授权管理人员同意，填写调取单/相关登记手续，并检查档案的完整性。","page":30,"endPage":30,"category":"健康档案","sourceNote":""},{"id":"single-176","type":"single","number":176,"title":"健康档案中的健康基本信息包括哪些内容","options":[{"key":"A","text":"仅限于血型"},{"key":"B","text":"仅限于药物过敏史"},{"key":"C","text":"血型、药物过敏史、既往史、家族史、生活环境信息等"},{"key":"D","text":"仅限于生活环境信息"}],"answer":["C"],"explanation":"健康档案中的健康基本信息包括血型、药物过敏史、既往史、家族史、生活环境信息等，这些信息对伤病诊疗和疾病预防具有重要意义。","page":30,"endPage":30,"category":"健康档案","sourceNote":""},{"id":"single-177","type":"single","number":177,"title":"健康档案中的健康相关问题信息指的是什么","options":[{"key":"A","text":"仅限于药物过敏史"},{"key":"B","text":"仅限于家族史"},{"key":"C","text":"包括药物过敏史、家族史、慢性病史、不良生活方式等"},{"key":"D","text":"仅限于慢性病史"}],"answer":["C"],"explanation":"健康档案中的健康相关问题信息包括药物过敏史、家族史、慢性病史、不良生活方式等，这些信息有助于识别健康风险并制定健康管理策略。","page":30,"endPage":31,"category":"健康档案","sourceNote":""},{"id":"single-178","type":"single","number":178,"title":"健康档案整理的作用是什么","options":[{"key":"A","text":"使健康档案杂乱无章"},{"key":"B","text":"有助于健康档案的检索利用"},{"key":"C","text":"降低健康档案的质量水平"},{"key":"D","text":"无需规范化"}],"answer":["B"],"explanation":"健康档案整理的作用是使健康档案规范化、有序化，有助于健康档案的检索利用、保管和保护，提升档案质量水平。","page":31,"endPage":31,"category":"健康档案","sourceNote":""},{"id":"single-179","type":"single","number":179,"title":"健康档案资料补充与更新的时机是什么","options":[{"key":"A","text":"仅限于每年一次"},{"key":"B","text":"完成重要的健康体检服务之后"},{"key":"C","text":"从不更新"},{"key":"D","text":"每天更新"}],"answer":["B"],"explanation":"健康档案资料补充与更新的时机是在完成重要的健康体检服务之后，如门诊、转诊、复诊、健康体检、预防接种等，保持经常性联系，及时更新档案资料。","page":31,"endPage":31,"category":"健康档案","sourceNote":""},{"id":"single-180","type":"single","number":180,"title":"健康档案维护的基本要求是什么","options":[{"key":"A","text":"健康档案应整齐完整"},{"key":"B","text":"健康档案的材质不符合档案常规要求"},{"key":"C","text":"无需定期盘点"},{"key":"D","text":"不需要及时更新"}],"answer":["A"],"explanation":"健康档案维护的基本要求是健康档案应整齐完整，健康档案的材质应符合档案常规要求，定期盘点并及时更新。","page":31,"endPage":31,"category":"健康档案","sourceNote":""},{"id":"single-181","type":"single","number":181,"title":"健康咨询服务的主要对象不包括以下哪类人群","options":[{"key":"A","text":"健康人群"},{"key":"B","text":"亚健康人群"},{"key":"C","text":"患有严重精神疾病的人群"},{"key":"D","text":"特殊生理时期的人群"}],"answer":["C"],"explanation":"健康咨询服务的对象包括健康、亚健康、亚临床、疾病、特殊生理时期的人群，但不包括患有严重精神疾病的人群。","page":31,"endPage":31,"category":"咨询与访视","sourceNote":""},{"id":"single-182","type":"single","number":182,"title":"健康咨询的基本要求中，哪一项强调了咨询者必须自愿接受咨询","options":[{"key":"A","text":"保密原则"},{"key":"B","text":"自愿原则"},{"key":"C","text":"建立平等友好的信赖关系原则"},{"key":"D","text":"接触限制原则"}],"answer":["B"],"explanation":"自愿原则是健康咨询的基本要求之一，强调咨询者必须完全自愿地参与咨询。","page":31,"endPage":31,"category":"咨询与访视","sourceNote":""},{"id":"single-183","type":"single","number":183,"title":"赵先生的BMI 为31，属于以下哪种体型","options":[{"key":"A","text":"正常"},{"key":"B","text":"超重"},{"key":"C","text":"肥胖"},{"key":"D","text":"消瘦"}],"answer":["C"],"explanation":"BMI31 属于肥胖范围（BMI≥30 为肥胖）。","page":31,"endPage":32,"category":"咨询与访视","sourceNote":""},{"id":"single-184","type":"single","number":184,"title":"在健康访视的程序中，以下哪一项属于访视后阶段的工作","options":[{"key":"A","text":"确定访视的对象、目的、时间和内容"},{"key":"B","text":"按照访视计划实施访视"},{"key":"C","text":"对访视内容进行整理、进行完整记录"},{"key":"D","text":"与被访者取得联系"}],"answer":["C"],"explanation":"访视后阶段的工作包括对访视内容进行整理、记录，并总结访视结果，制定下次访视计划。其他选项属于访视前或访视中的工作。","page":32,"endPage":32,"category":"咨询与访视","sourceNote":""},{"id":"single-185","type":"single","number":185,"title":"健康访视记录的内容中，以下哪一项不属于首次访视的总结内容","options":[{"key":"A","text":"分析存在健康问题中哪些可以通过改变生活方式得到改善"},{"key":"B","text":"提出相应的改进对策"},{"key":"C","text":"对比目前情况和既往情况进行对比"},{"key":"D","text":"鼓励患者继续保持良好的生活习惯"}],"answer":["C"],"explanation":"首次访视的总结内容主要是分析当前健康问题，并提出改进对策。对比目前情况和既往情况属于非首次访视的总结内容。","page":32,"endPage":32,"category":"咨询与访视","sourceNote":""},{"id":"single-186","type":"single","number":186,"title":"康复医学的服务对象主要是","options":[{"key":"A","text":"急性传染病患者"},{"key":"B","text":"功能障碍者"},{"key":"C","text":"健康人群"},{"key":"D","text":"孕妇"}],"answer":["B"],"explanation":"康复医学以功能障碍者为服务对象，致力于功能恢复和能力提升。","page":32,"endPage":32,"category":"康复与中医","sourceNote":""},{"id":"single-187","type":"single","number":187,"title":"下列哪项不属于康复医学的基本原则","options":[{"key":"A","text":"功能训练"},{"key":"B","text":"早期同步"},{"key":"C","text":"以疾病为中心"},{"key":"D","text":"全面康复"}],"answer":["C"],"explanation":"康复医学强调以患者为中心，而非以疾病为中心。","page":32,"endPage":32,"category":"康复与中医","sourceNote":""},{"id":"single-188","type":"single","number":188,"title":"中医康复学的核心思想不包括","options":[{"key":"A","text":"整体康复"},{"key":"B","text":"辨证康复"},{"key":"C","text":"以药为主"},{"key":"D","text":"未病先防"}],"answer":["C"],"explanation":"中医康复强调多种方法的综合应用，而非单纯依赖药物。","page":32,"endPage":32,"category":"康复与中医","sourceNote":""},{"id":"single-189","type":"single","number":189,"title":"“天人相应”观体现了中医康复的哪一原则","options":[{"key":"A","text":"整体观"},{"key":"B","text":"功能观"},{"key":"C","text":"正气观"},{"key":"D","text":"辩证观"}],"answer":["A"],"explanation":"“天人相应”强调人与自然的一体性，属于整体观的范畴。","page":32,"endPage":33,"category":"康复与中医","sourceNote":""},{"id":"single-190","type":"single","number":190,"title":"下列哪项不属于中医康复常用方法","options":[{"key":"A","text":"针灸"},{"key":"B","text":"推拿"},{"key":"C","text":"化疗"},{"key":"D","text":"气功"}],"answer":["C"],"explanation":"化疗属于西医治疗手段，不属于中医康复方法。","page":33,"endPage":33,"category":"康复与中医","sourceNote":""},{"id":"single-191","type":"single","number":191,"title":"康复评定的作用不包括","options":[{"key":"A","text":"制定治疗计划"},{"key":"B","text":"评价治疗效果"},{"key":"C","text":"替代临床诊断"},{"key":"D","text":"指导康复治疗"}],"answer":["C"],"explanation":"康复评定是康复治疗的基础，但不能替代临床诊断。","page":33,"endPage":33,"category":"康复与中医","sourceNote":""},{"id":"single-192","type":"single","number":192,"title":"下列哪项是物理治疗的内容","options":[{"key":"A","text":"言语训练"},{"key":"B","text":"作业活动"},{"key":"C","text":"运动疗法"},{"key":"D","text":"心理辅导"}],"answer":["C"],"explanation":"运动疗法属于物理治疗的范畴。","page":33,"endPage":33,"category":"康复与中医","sourceNote":""},{"id":"single-193","type":"single","number":193,"title":"中医康复“治未病”不包括以下哪项","options":[{"key":"A","text":"未病先防"},{"key":"B","text":"既病防变"},{"key":"C","text":"瘥后防复"},{"key":"D","text":"病中治疗"}],"answer":["D"],"explanation":"“治未病”强调预防和防变，不包括病中治疗。","page":33,"endPage":33,"category":"康复与中医","sourceNote":""},{"id":"single-194","type":"single","number":194,"title":"下列哪项不属于残疾分类中的“残障”","options":[{"key":"A","text":"社会交往障碍"},{"key":"B","text":"工作能力丧失"},{"key":"C","text":"器官功能异常"},{"key":"D","text":"学习能力受限"}],"answer":["C"],"explanation":"器官功能异常属于“残损”层面，而非“残障”。","page":33,"endPage":33,"category":"康复与中医","sourceNote":""},{"id":"single-195","type":"single","number":195,"title":"中医康复处方的制定原则不包括","options":[{"key":"A","text":"因病选药"},{"key":"B","text":"因证配伍"},{"key":"C","text":"因症用药"},{"key":"D","text":"因年龄用药"}],"answer":["D"],"explanation":"中医处方强调病、证、症结合，年龄不是核心依据。","page":33,"endPage":34,"category":"康复与中医","sourceNote":""},{"id":"single-196","type":"single","number":196,"title":"下列哪项不是康复治疗团队成员","options":[{"key":"A","text":"康复医师"},{"key":"B","text":"物理治疗师"},{"key":"C","text":"药剂师"},{"key":"D","text":"作业治疗师"}],"answer":["C"],"explanation":"药剂师不属于康复治疗核心团队成员。","page":34,"endPage":34,"category":"康复与中医","sourceNote":""},{"id":"single-197","type":"single","number":197,"title":"“功能观”强调康复的最终目标是","options":[{"key":"A","text":"治愈疾病"},{"key":"B","text":"恢复功能"},{"key":"C","text":"延长生命"},{"key":"D","text":"减轻疼痛"}],"answer":["B"],"explanation":"功能观的核心是恢复患者的日常生活和职业能力。","page":34,"endPage":34,"category":"康复与中医","sourceNote":""},{"id":"single-198","type":"single","number":198,"title":"下列哪项不属于中医康复的整体观内容","options":[{"key":"A","text":"人与自然一体"},{"key":"B","text":"人与社会一体"},{"key":"C","text":"形神一体"},{"key":"D","text":"医患一体"}],"answer":["D"],"explanation":"整体观包括自然、社会、形神三个方面，不包括医患关系。","page":34,"endPage":34,"category":"康复与中医","sourceNote":""},{"id":"single-199","type":"single","number":199,"title":"康复医学的发展确立期是在","options":[{"key":"A","text":"1910 年以前"},{"key":"B","text":"1910–1946 年"},{"key":"C","text":"1946–1970 年"},{"key":"D","text":"1970 年以后"}],"answer":["C"],"explanation":"康复医学在1946–1970 年间确立为独立学科。","page":34,"endPage":34,"category":"康复与中医","sourceNote":""},{"id":"single-200","type":"single","number":200,"title":"下列哪项是中医康复“杂合以治”的体现","options":[{"key":"A","text":"单一疗法"},{"key":"B","text":"多种疗法协同"},{"key":"C","text":"只用药剂"},{"key":"D","text":"只用手法"}],"answer":["B"],"explanation":"“杂合以治”强调多种治疗方法的综合应用。","page":34,"endPage":34,"category":"康复与中医","sourceNote":""},{"id":"single-201","type":"single","number":201,"title":"下列哪项不属于康复工程的内容","options":[{"key":"A","text":"假肢制作"},{"key":"B","text":"矫形器设计"},{"key":"C","text":"心理评估"},{"key":"D","text":"无障碍改造"}],"answer":["C"],"explanation":"心理评估属于心理治疗范畴，不属于康复工程。","page":34,"endPage":35,"category":"康复与中医","sourceNote":""},{"id":"single-202","type":"single","number":202,"title":"中医康复“辨证施治”的基础是","options":[{"key":"A","text":"病因病机"},{"key":"B","text":"患者年龄"},{"key":"C","text":"治疗费用"},{"key":"D","text":"医院条件"}],"answer":["A"],"explanation":"辨证施治需根据病因、病机、病位等进行。","page":35,"endPage":35,"category":"康复与中医","sourceNote":""},{"id":"single-203","type":"single","number":203,"title":"中医康复“杂合以治”不包括","options":[{"key":"A","text":"标本结合"},{"key":"B","text":"内外结合"},{"key":"C","text":"医疗与自疗结合"},{"key":"D","text":"只用药剂"}],"answer":["D"],"explanation":"“杂合以治”强调多种方法的综合应用。","page":35,"endPage":35,"category":"康复与中医","sourceNote":""},{"id":"single-204","type":"single","number":204,"title":"下列哪项是康复工程的内容","options":[{"key":"A","text":"心理辅导"},{"key":"B","text":"假肢设计"},{"key":"C","text":"言语训练"},{"key":"D","text":"运动疗法"}],"answer":["B"],"explanation":"康复工程包括假肢、矫形器等辅助器具的设计与制作。","page":35,"endPage":35,"category":"康复与中医","sourceNote":""},{"id":"single-205","type":"single","number":205,"title":"中医康复“治未病”与西医哪一概念相符","options":[{"key":"A","text":"三级预防"},{"key":"B","text":"对症治疗"},{"key":"C","text":"手术干预"},{"key":"D","text":"药物治疗"}],"answer":["A"],"explanation":"中医“治未病”与西医“三级预防”理念相符。","page":35,"endPage":35,"category":"康复与中医","sourceNote":""},{"id":"single-206","type":"single","number":206,"title":"下列哪项不是康复治疗的目标","options":[{"key":"A","text":"恢复功能"},{"key":"B","text":"回归社会"},{"key":"C","text":"治愈所有疾病"},{"key":"D","text":"提高生活质量"}],"answer":["C"],"explanation":"康复治疗旨在最大程度恢复功能，但不一定治愈所有疾病。","page":35,"endPage":35,"category":"康复与中医","sourceNote":""},{"id":"single-207","type":"single","number":207,"title":"中医康复“功能观”强调","options":[{"key":"A","text":"器官修复"},{"key":"B","text":"功能恢复"},{"key":"C","text":"生命延长"},{"key":"D","text":"症状控制"}],"answer":["B"],"explanation":"功能观的核心是恢复患者的日常生活和职业能力。","page":35,"endPage":36,"category":"康复与中医","sourceNote":""},{"id":"single-208","type":"single","number":208,"title":"下列哪项是“残疾”的表现","options":[{"key":"A","text":"社会排斥"},{"key":"B","text":"日常活动受限"},{"key":"C","text":"器官损伤"},{"key":"D","text":"心理障碍"}],"answer":["B"],"explanation":"日常活动受限属于个体层面的障碍，即残疾。","page":36,"endPage":36,"category":"康复与中医","sourceNote":""},{"id":"single-209","type":"single","number":209,"title":"康复治疗中“文体疗法”是指","options":[{"key":"A","text":"文化娱乐活动"},{"key":"B","text":"药物治疗"},{"key":"C","text":"手术治疗"},{"key":"D","text":"心理治疗"}],"answer":["A"],"explanation":"文体疗法通过文娱体育活动促进患者康复。","page":36,"endPage":36,"category":"康复与中医","sourceNote":""},{"id":"single-210","type":"single","number":210,"title":"中医康复“整体观”中“形神一体”指","options":[{"key":"A","text":"身体与精神统一"},{"key":"B","text":"医生与患者统一"},{"key":"C","text":"药物与针灸统一"},{"key":"D","text":"内治与外治统一"}],"answer":["A"],"explanation":"形神一体强调身体与精神的统一性。","page":36,"endPage":36,"category":"康复与中医","sourceNote":""},{"id":"single-211","type":"single","number":211,"title":"下列哪项不属于康复评定内容","options":[{"key":"A","text":"运动功能"},{"key":"B","text":"心理功能"},{"key":"C","text":"血常规"},{"key":"D","text":"社会功能"}],"answer":["C"],"explanation":"血常规属于临床检验，不属于康复评定。","page":36,"endPage":36,"category":"康复与中医","sourceNote":""},{"id":"single-212","type":"single","number":212,"title":"中医康复“辨证观”的基础是","options":[{"key":"A","text":"八纲辨证"},{"key":"B","text":"患者年龄"},{"key":"C","text":"治疗设备"},{"key":"D","text":"医院等级"}],"answer":["A"],"explanation":"辨证观以中医辨证体系（如八纲辨证）为基础。","page":36,"endPage":36,"category":"康复与中医","sourceNote":""},{"id":"single-213","type":"single","number":213,"title":"下列哪项是“残损”的表现","options":[{"key":"A","text":"无法工作"},{"key":"B","text":"社会适应困难"},{"key":"C","text":"肌肉无力"},{"key":"D","text":"学习障碍"}],"answer":["C"],"explanation":"肌肉无力属于器官层面的功能障碍，即残损。","page":36,"endPage":36,"category":"康复与中医","sourceNote":""},{"id":"single-214","type":"single","number":214,"title":"康复治疗团队不包括","options":[{"key":"A","text":"康复医师"},{"key":"B","text":"物理治疗师"},{"key":"C","text":"厨师"},{"key":"D","text":"作业治疗师"}],"answer":["C"],"explanation":"厨师不属于康复治疗团队成员。","page":36,"endPage":37,"category":"康复与中医","sourceNote":""},{"id":"single-215","type":"single","number":215,"title":"中医康复“循证治疗”强调","options":[{"key":"A","text":"传统经验"},{"key":"B","text":"科学证据"},{"key":"C","text":"患者偏好"},{"key":"D","text":"医生经验"}],"answer":["B"],"explanation":"循证治疗强调依据最佳科学证据进行决策。","page":37,"endPage":37,"category":"康复与中医","sourceNote":""},{"id":"single-216","type":"single","number":216,"title":"下列哪项是康复医学的基本原则","options":[{"key":"A","text":"以疾病为中心"},{"key":"B","text":"功能训练"},{"key":"C","text":"单一治疗"},{"key":"D","text":"晚期干预"}],"answer":["B"],"explanation":"功能训练是康复医学的基本原则之一。","page":37,"endPage":37,"category":"康复与中医","sourceNote":""},{"id":"single-217","type":"single","number":217,"title":"中医康复“正气观”主要适用于","options":[{"key":"A","text":"外感病"},{"key":"B","text":"正气不足者"},{"key":"C","text":"急性病"},{"key":"D","text":"传染病"}],"answer":["B"],"explanation":"正气观强调扶助正气，适用于正气不足的患者。","page":37,"endPage":37,"category":"康复与中医","sourceNote":""},{"id":"single-218","type":"single","number":218,"title":"下列哪项不属于中医康复方法","options":[{"key":"A","text":"针灸"},{"key":"B","text":"推拿"},{"key":"C","text":"化疗"},{"key":"D","text":"气功"}],"answer":["C"],"explanation":"化疗属于西医治疗手段。","page":37,"endPage":37,"category":"康复与中医","sourceNote":""},{"id":"single-219","type":"single","number":219,"title":"转院的基本流程中，以下哪项不是必需的步骤","options":[{"key":"A","text":"经治医生上报科主任，组织讨论是否符合转院条件"},{"key":"B","text":"与家属协商并获得同意"},{"key":"C","text":"复印并带走病历资料"},{"key":"D","text":"危重患者自行前往上级医院"}],"answer":["D"],"explanation":"危重患者在转院途中必须有陪护人员（如急救车）陪同，不能自行前往上级医院。其他选项都是转院流程中的必要步骤。","page":37,"endPage":37,"category":"陪诊与导诊","sourceNote":""},{"id":"single-220","type":"single","number":220,"title":"陪诊员协助患者完成诊疗活动时，以下哪项做法不合适","options":[{"key":"A","text":"协助患者就诊前的准备：挂号、整理病历"},{"key":"B","text":"在患者进入诊室后，助理员在诊室外等候"},{"key":"C","text":"协助预约检验检查和取结果"},{"key":"D","text":"向患者转述医生的诊疗建议"}],"answer":["B"],"explanation":"陪诊员应在患者进入诊室后，帮助陈述患者病情，协助医生和患者之间的沟通，而不是简单地在诊室外等候。","page":37,"endPage":38,"category":"陪诊与导诊","sourceNote":""},{"id":"single-221","type":"single","number":221,"title":"对于体检患者，以下哪项准备工作是不合适的","options":[{"key":"A","text":"协助患者联系体检机构，预约体检日期"},{"key":"B","text":"提醒患者体检前的注意事项（饮食、睡眠）"},{"key":"C","text":"体检当日提醒患者空腹，准备中段尿"},{"key":"D","text":"体检后让患者立即进行剧烈运动"}],"answer":["D"],"explanation":"体检后应避免立即进行剧烈运动，尤其是空腹状态下。体检后应尽快进食，避免低血糖，并遵循医生的建议进行后续的健康管理。","page":38,"endPage":38,"category":"陪诊与导诊","sourceNote":""},{"id":"single-222","type":"single","number":222,"title":"健康访视的分类中，哪种访视通常是一次性的，适用于社区中老年体弱患者家庭的考察","options":[{"key":"A","text":"评估性访视"},{"key":"B","text":"连续照顾性访视"},{"key":"C","text":"急诊性访视"},{"key":"D","text":"定期访视"}],"answer":["A"],"explanation":"评估性访视通常是针对特定需求的一次性访视，例如对社区中老年体弱患者的家庭进行营养、皮肤或跌倒危险因素的评估。","page":38,"endPage":38,"category":"陪诊与导诊","sourceNote":""},{"id":"single-223","type":"single","number":223,"title":"连续照顾性访视主要适用于哪类患者","options":[{"key":"A","text":"患有急性病的患者"},{"key":"B","text":"患有慢性病或行动受限的卧床患者"},{"key":"C","text":"临时发生紧急情况的患者"},{"key":"D","text":"健康人群"}],"answer":["B"],"explanation":"连续照顾性访视是定期进行的，适用于患有慢性病或行动受限的卧床患者，提供持续的护理和支持。","page":38,"endPage":38,"category":"陪诊与导诊","sourceNote":""},{"id":"single-224","type":"single","number":224,"title":"急诊性访视的特点是什么","options":[{"key":"A","text":"随机性，适用于临时发生的紧急情况"},{"key":"B","text":"定期进行，适用于慢性病患者"},{"key":"C","text":"一次性的，适用于社区考察"},{"key":"D","text":"适用于健康人群的预防性检查"}],"answer":["A"],"explanation":"急诊性访视是随机性的，适用于临时发生的紧急情况，如突发疾病或意外伤害。","page":38,"endPage":38,"category":"陪诊与导诊","sourceNote":""},{"id":"single-225","type":"single","number":225,"title":"健康访视对象的分类中，以下哪一项不属于按健康状态划分的类别","options":[{"key":"A","text":"健康"},{"key":"B","text":"亚健康"},{"key":"C","text":"亚临床"},{"key":"D","text":"职业人群"}],"answer":["D"],"explanation":"按健康状态划分的类别包括健康、亚健康、亚临床、疾病和特殊生理时期状态。职业人群属于按不同职业人群划分的类别。","page":38,"endPage":39,"category":"陪诊与导诊","sourceNote":""},{"id":"single-226","type":"single","number":226,"title":"出行路线设计的原则不包括以下哪一项","options":[{"key":"A","text":"顺畅、省时、节省路费"},{"key":"B","text":"选择最省时、最通畅的路线"},{"key":"C","text":"尽量选择乘坐公共交通工具"},{"key":"D","text":"优先选择上班高峰时段出行"}],"answer":["D"],"explanation":"出行路线设计应尽量避开拥堵路段和上班高峰时段，以确保顺畅、省时。因此，优先选择上班高峰时段出行是不符合原则的。","page":39,"endPage":39,"category":"陪诊与导诊","sourceNote":""},{"id":"single-227","type":"single","number":227,"title":"在前往就诊机构时，以下哪项做法不合适","options":[{"key":"A","text":"按照预约短信提醒的就诊时间到达医院"},{"key":"B","text":"对于需要长时间等候取药的，选择邮寄药物或第二天取药"},{"key":"C","text":"直接前往医院，无需提前查询路线"},{"key":"D","text":"尽量选择乘坐公共交通工具"}],"answer":["C"],"explanation":"出行前应先查询路线，选择最省时、最通畅的路线，以减少不必要的延误。直接前往医院而忽略路线规划可能会导致时间和精力的浪费。","page":39,"endPage":39,"category":"陪诊与导诊","sourceNote":""},{"id":"single-228","type":"single","number":228,"title":"门诊医疗的基本流程中，首诊医生通常不会做以下哪项工作","options":[{"key":"A","text":"询问患者病史"},{"key":"B","text":"进行物理检查和化验"},{"key":"C","text":"书写门急诊病历"},{"key":"D","text":"安排患者出院"}],"answer":["D"],"explanation":"首诊医生的主要任务是询问病史、进行检查、初步诊断并给出治疗方案，书写病历。安排患者出院属于住院期间的工作，不在门诊首诊的范围内。","page":39,"endPage":39,"category":"陪诊与导诊","sourceNote":""},{"id":"single-229","type":"single","number":229,"title":"入院患者管理中，危重症患者入院后会立即进行什么处理","options":[{"key":"A","text":"等待常规检查结果"},{"key":"B","text":"进行急救处理"},{"key":"C","text":"安排普通病房"},{"key":"D","text":"进行健康宣教"}],"answer":["B"],"explanation":"危重症患者入院后会立即进行急救处理，确保患者的生命安全。常规检查和其他护理措施会在急救处理之后进行。","page":39,"endPage":39,"category":"陪诊与导诊","sourceNote":""},{"id":"single-230","type":"single","number":230,"title":"在选择私立医院时，以下哪一项不是考虑因素","options":[{"key":"A","text":"观察广告"},{"key":"B","text":"询问价格"},{"key":"C","text":"参考口碑"},{"key":"D","text":"医院的地理位置"}],"answer":["D"],"explanation":"选择私立医院时，应考虑观察广告、询问价格、咨询医生亲友和参考口碑，但未提及地理位置作为选择标准。","page":39,"endPage":39,"category":"陪诊与导诊","sourceNote":""},{"id":"single-231","type":"single","number":231,"title":"以下哪项不属于就诊前常规准备工作的一部分","options":[{"key":"A","text":"准备医保卡、身份证、就诊卡"},{"key":"B","text":"准备既往病历、化验单、检查报告单"},{"key":"C","text":"准备拐杖"},{"key":"D","text":"列出咨询大纲"}],"answer":["C"],"explanation":"拐杖并不是必须准备的物品，除非患者本身有行动不便的情况。其他选项都是就诊前常规准备工作的组成部分。","page":39,"endPage":40,"category":"陪诊与导诊","sourceNote":""},{"id":"single-232","type":"single","number":232,"title":"对于有明确诊断的慢性疾病的维持治疗，以下哪项做法不被推荐","options":[{"key":"A","text":"首选社区医院或就近医院"},{"key":"B","text":"定期到级别高的医院复查和指导治疗"},{"key":"C","text":"直接选择三甲医院进行所有治疗"},{"key":"D","text":"使用社区医院与上级医院之间的转诊绿色通道"}],"answer":["C"],"explanation":"对于慢性病的维持治疗，首选社区医院或就近医院，定期到级别高的医院复查和指导治疗，并利用转诊绿色通道，而不是直接选择三甲医院进行所有治疗。","page":40,"endPage":40,"category":"陪诊与导诊","sourceNote":""},{"id":"single-233","type":"single","number":233,"title":"在医院选择方面，以下哪一项不是推荐的选择标准","options":[{"key":"A","text":"有明确诊断的慢性疾病维持治疗时首选社区医院"},{"key":"B","text":"初次就诊建议上二级及以上的医院"},{"key":"C","text":"大病优先选择有资质的三甲医院"},{"key":"D","text":"选择医院时仅凭医院的广告宣传"}],"answer":["D"],"explanation":"选择医院时不应仅凭广告宣传，还应考虑医院的资质、口碑、专业特长等因素。广告宣传只是参考之一，不能作为唯一选择标准。","page":40,"endPage":40,"category":"陪诊与导诊","sourceNote":""},{"id":"single-234","type":"single","number":234,"title":"陪诊服务主要目的是什么","options":[{"key":"A","text":"代替医生看病"},{"key":"B","text":"协助患者就医过程"},{"key":"C","text":"提供医疗咨询"},{"key":"D","text":"进行医疗研究"}],"answer":["B"],"explanation":"陪诊服务的主要目的是协助患者在就医过程中的各种需求，如挂号、陪同检查、取药等，以减轻患者及其家属的压力。","page":40,"endPage":40,"category":"陪诊与导诊","sourceNote":""},{"id":"single-235","type":"single","number":235,"title":"陪诊人员在医院中可以代替患者做哪些事情","options":[{"key":"A","text":"做医疗决策"},{"key":"B","text":"与医生沟通病情"},{"key":"C","text":"代替患者签字"},{"key":"D","text":"选择治疗方案"}],"answer":["B"],"explanation":"陪诊人员可以协助患者与医生沟通病情，但不能代替患者做医疗决策、签字或选择治疗方案。","page":40,"endPage":40,"category":"陪诊与导诊","sourceNote":""},{"id":"single-236","type":"single","number":236,"title":"陪诊人员在陪同患者检查时，应该注意什么","options":[{"key":"A","text":"确保患者安全"},{"key":"B","text":"代替医生操作检查设备"},{"key":"C","text":"为患者提供医疗建议"},{"key":"D","text":"与医生讨论检查结果"}],"answer":["A"],"explanation":"陪诊人员在陪同患者检查时，应确保患者的安全，并在必要时提供帮助，但不能代替医生操作检查设备或提供医疗建议。","page":40,"endPage":41,"category":"陪诊与导诊","sourceNote":""},{"id":"single-237","type":"single","number":237,"title":"导诊服务的主要目的是什么","options":[{"key":"A","text":"提供医院内部的旅游向导"},{"key":"B","text":"引导患者到相关医院、相关科室就医"},{"key":"C","text":"为患者提供心理咨询服务"},{"key":"D","text":"协助医生进行手术"}],"answer":["B"],"explanation":"导诊服务是指引导患者到正确的医院和科室就医的服务，以确保患者能够得到及时和正确的治疗。","page":41,"endPage":41,"category":"陪诊与导诊","sourceNote":""},{"id":"single-238","type":"single","number":238,"title":"如果一位患者有胸闷、胸痛以及肩膀痛的症状，应该建议他去哪个科室就诊","options":[{"key":"A","text":"呼吸内科"},{"key":"B","text":"胸外科"},{"key":"C","text":"心血管内科"},{"key":"D","text":"骨科"}],"answer":["C"],"explanation":"如果出现胸闷、胸痛、肩膀痛等症状，建议去心血管内科就诊，因此应选择心血管内科。","page":41,"endPage":41,"category":"陪诊与导诊","sourceNote":""},{"id":"single-239","type":"single","number":239,"title":"对于初次就诊的患者，推荐首先前往哪种类型的医院","options":[{"key":"A","text":"社区医院"},{"key":"B","text":"二级及以上医院"},{"key":"C","text":"三级甲等医院"},{"key":"D","text":"私立医院"}],"answer":["B"],"explanation":"初次就诊建议上二级及以上的医院，因为这些医院可以提供更全面的诊疗服务。","page":41,"endPage":41,"category":"陪诊与导诊","sourceNote":""},{"id":"single-240","type":"single","number":240,"title":"下列哪项不属于挂号渠道","options":[{"key":"A","text":"各家医院APP、小程序、公众号、自助机"},{"key":"B","text":"114 挂号平台"},{"key":"C","text":"医院官网"},{"key":"D","text":"报到机排队"}],"answer":["D"],"explanation":"报到机排队是用于检查、取药的排队，并不是挂号的渠道。挂号可以通过医院APP、小程序、公众号、自助机或114 挂号平台完成。","page":41,"endPage":41,"category":"陪诊与导诊","sourceNote":""},{"id":"single-241","type":"single","number":241,"title":"如果一位患者发热且伴有嗓子痛，应该建议他去哪个科室","options":[{"key":"A","text":"神经内科"},{"key":"B","text":"综合内科"},{"key":"C","text":"耳鼻喉科"},{"key":"D","text":"感染科"}],"answer":["D"],"explanation":"发热伴有嗓子痛的症状指向感染性疾病，因此应选择感染科。","page":41,"endPage":41,"category":"陪诊与导诊","sourceNote":""},{"id":"single-242","type":"single","number":242,"title":"在紧急情况下，导诊人员的首要任务是什么","options":[{"key":"A","text":"保持冷静，按照医院的紧急程序行动"},{"key":"B","text":"立即通知医生"},{"key":"C","text":"帮助患者找到最近的出口"},{"key":"D","text":"询问患者是否购买了医疗保险"}],"answer":["A"],"explanation":"在紧急情况下，导诊人员的首要任务是保持冷静，并按照医院的紧急程序行动，确保患者能够得到及时和有效的救治。","page":41,"endPage":42,"category":"陪诊与导诊","sourceNote":""},{"id":"single-243","type":"single","number":243,"title":"下列属于根据《医疗器械监督管理条例》医疗器械分类范畴的是","options":[{"key":"A","text":"无风险"},{"key":"B","text":"具有中度风险"},{"key":"C","text":"表面接触器械"},{"key":"D","text":"植入器械"}],"answer":["B"],"explanation":"国家对医疗器械按照风险程度实行分类管理，第一类医疗器械风险程度低，第二类医疗器械具有中度风险，第三类医疗器械具有较高风险。","page":42,"endPage":42,"category":"药品与器械","sourceNote":""},{"id":"single-244","type":"single","number":244,"title":"根据《医疗器械监督管理条例》，具有较高风险的医疗器械如何管理","options":[{"key":"A","text":"常规管理"},{"key":"B","text":"无需管理"},{"key":"C","text":"严格控制管理"},{"key":"D","text":"采取特别措施"}],"answer":["D"],"explanation":"根据《医疗器械监督管理条例》规定：具有较高风险，需要采取特别措施严格控制管理以保证其安全、有效。","page":42,"endPage":42,"category":"药品与器械","sourceNote":""},{"id":"single-245","type":"single","number":245,"title":"根据《医疗器械监督管理条例》，需采取严格控制管理以保证其安全有效的医疗器械是","options":[{"key":"A","text":"风险程度低"},{"key":"B","text":"无风险"},{"key":"C","text":"具有中度风险"},{"key":"D","text":"具有较高风险"}],"answer":["C"],"explanation":"根据《医疗器械监督管理条例》规定：具有较高风险，需要采取特别措施严格控制管理以保证其安全、有效。","page":42,"endPage":42,"category":"药品与器械","sourceNote":"原答案为 C（中度风险），但原解析描述的是“较高风险”，答案与解析存在不一致。"},{"id":"single-246","type":"single","number":246,"title":"非接触医疗器械是指不直接或间接接触患者的器械，如","options":[{"key":"A","text":"体外假肢"},{"key":"B","text":"支气管镜"},{"key":"C","text":"固定带"},{"key":"D","text":"清洗消毒器械"}],"answer":["D"],"explanation":"根据题目，除D 选项外，其余均为表面接触器械。","page":42,"endPage":42,"category":"药品与器械","sourceNote":""},{"id":"single-247","type":"single","number":247,"title":"下列哪个选项属于仅接触未受损皮肤表面的器械","options":[{"key":"A","text":"各种电极"},{"key":"B","text":"胃镜"},{"key":"C","text":"心脏瓣膜"},{"key":"D","text":"输液器"}],"answer":["A"],"explanation":"仅接触未受损皮肤表面的器械，如各种类型的电极、体外假体、固定带、压迫绷带和监测器等。","page":42,"endPage":42,"category":"药品与器械","sourceNote":""},{"id":"single-248","type":"single","number":248,"title":"下列哪个选项属于外部接入器械","options":[{"key":"A","text":"人工关节"},{"key":"B","text":"创口贴"},{"key":"C","text":"输血器"},{"key":"D","text":"人工血管"}],"answer":["C"],"explanation":"血路，间接与血路上某一点接触，作为管路向血管系统输入的器械，如输液器、延长器、转移器、输血器等。","page":42,"endPage":43,"category":"药品与器械","sourceNote":""},{"id":"single-249","type":"single","number":249,"title":"通过审批的药品说明书","options":[{"key":"A","text":"可以修改"},{"key":"B","text":"每两年自行修改一次"},{"key":"C","text":"每年自行修改一次"},{"key":"D","text":"不得自行修改"}],"answer":["D"],"explanation":"通过审批的药品说明书不得自行修改。","page":43,"endPage":43,"category":"药品与器械","sourceNote":""},{"id":"single-250","type":"single","number":250,"title":"下列哪个选项不属于药品说明书的内容","options":[{"key":"A","text":"药品名称"},{"key":"B","text":"用法用量"},{"key":"C","text":"药品制作流程"},{"key":"D","text":"不良反应"}],"answer":["C"],"explanation":"药品说明书的内容应包括药品的品名、规格、生产企业、药品批准文号、产品批号、有效期、主要成分、适应症或功能主治、用法、用量、禁忌、不良反应和注意事项。","page":43,"endPage":43,"category":"药品与器械","sourceNote":""},{"id":"single-251","type":"single","number":251,"title":"中药制剂说明书输了常规说明书的内容外，还应包括","options":[{"key":"A","text":"主要药味"},{"key":"B","text":"中药制作流程"},{"key":"C","text":"药品采集地"},{"key":"D","text":"中药采集时间"}],"answer":["A"],"explanation":"药品说明书的内容应包括药品的品名、规格、生产企业、药品批准文号、产品批号、有效期、主要成分、适应症或功能主治、用法、用量、禁忌、不良反应和注意事项，中药制剂说明书还应包括主要药味(成分)性状、药理作用、贮藏等。","page":43,"endPage":43,"category":"药品与器械","sourceNote":""},{"id":"single-252","type":"single","number":252,"title":"下列哪个选项符合预约转诊的基本流程","options":[{"key":"A","text":"基层医院将病人转至上级医院相关科室"},{"key":"B","text":"病人从家中直接就诊"},{"key":"C","text":"转诊病人病情稳定后直接出院"},{"key":"D","text":"基层医院未予上级医院沟通直接转诊病人"}],"answer":["A"],"explanation":"预约转诊的基本流程是基层医院将患者转至上级医院相关科室。","page":43,"endPage":43,"category":"陪诊与导诊","sourceNote":""},{"id":"single-253","type":"single","number":253,"title":"下列哪个选项不是遵循预约转诊的目的","options":[{"key":"A","text":"小病在社区"},{"key":"B","text":"大病进医院"},{"key":"C","text":"康复回社区"},{"key":"D","text":"康复留在医院"}],"answer":["D"],"explanation":"预约转诊的目的是小病在社区、大病进医院、康复回社区。","page":43,"endPage":44,"category":"陪诊与导诊","sourceNote":""},{"id":"single-254","type":"single","number":254,"title":"导诊人员在帮助患者预约检查时，以下哪项是最重要的考虑因素","options":[{"key":"A","text":"检查的费用"},{"key":"B","text":"检查的准确性和必要性"},{"key":"C","text":"检查的时间长度"},{"key":"D","text":"检查的舒适度"}],"answer":["B"],"explanation":"在帮助患者预约检查时，最重要的是考虑检查的准确性和必要性，确保患者能够接受到最适合其病情的检查。","page":44,"endPage":44,"category":"陪诊与导诊","sourceNote":""},{"id":"single-255","type":"single","number":255,"title":"如果患者在就诊过程中需要转诊到其他科室或医院，导诊人员应该：","options":[{"key":"A","text":"立即安排转诊，无需通知原医生"},{"key":"B","text":"通知原医生，并根据原医生的建议安排转诊"},{"key":"C","text":"让患者自行决定是否需要转诊"},{"key":"D","text":"忽略转诊需求，继续当前治疗"}],"answer":["B"],"explanation":"导诊人员在患者需要转诊时，应通知原医生，并根据原医生的建议来安排转诊，确保患者能够得到连续和适当的医疗服务。","page":44,"endPage":44,"category":"陪诊与导诊","sourceNote":""},{"id":"single-256","type":"single","number":256,"title":"在医院中，导诊人员在协助患者使用自助服务设备时，以下哪项做法是不正确的","options":[{"key":"A","text":"指导患者如何使用自助服务设备"},{"key":"B","text":"代替患者操作自助服务设备"},{"key":"C","text":"确保患者能够独立完成自助服务操作"},{"key":"D","text":"提供帮助，但鼓励患者尝试自己操作"}],"answer":["B"],"explanation":"导诊人员应该指导患者如何使用自助服务设备，并确保患者能够独立完成操作，而不是代替患者操作，这样有助于提高患者的自助能力。","page":44,"endPage":44,"category":"陪诊与导诊","sourceNote":""},{"id":"single-257","type":"single","number":257,"title":"常见的健康咨询主题不包括","options":[{"key":"A","text":"饮食营养"},{"key":"B","text":"心理问题"},{"key":"C","text":"头痛问题"},{"key":"D","text":"口腔问题"}],"answer":["C"],"explanation":"常见的健康咨询主题包括饮食营养、心理问题、口腔问题等。","page":44,"endPage":44,"category":"咨询与访视","sourceNote":""},{"id":"single-258","type":"single","number":258,"title":"办公室常见疾病不包括","options":[{"key":"A","text":"灰尘过敏"},{"key":"B","text":"颈椎和腰椎疾病"},{"key":"C","text":"“鼠标手”"},{"key":"D","text":"计算机引起的眼疾"}],"answer":["A"],"explanation":"灰尘过敏不属于办公室的常见疾病。","page":44,"endPage":44,"category":"咨询与访视","sourceNote":""},{"id":"single-259","type":"single","number":259,"title":"以下哪项不是高血压发病时的具体表现","options":[{"key":"A","text":"脑卒中"},{"key":"B","text":"冠心病"},{"key":"C","text":"肾功能衰竭"},{"key":"D","text":"心肌梗死"}],"answer":["B"],"explanation":"高血压发病的具体表现主要是脑卒中、肾功能衰竭、心肌梗死等。","page":44,"endPage":45,"category":"医学基础","sourceNote":""},{"id":"single-260","type":"single","number":260,"title":"抑郁症的主要临床特征是","options":[{"key":"A","text":"显著的体重增加"},{"key":"B","text":"显著而持久的心
